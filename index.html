<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbiting Planets</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    canvas { display: block; cursor: grab; }
  </style>
</head>
<body>
  <canvas id="solarSystem"></canvas>
  <script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const cameraSmoothness = 0.01; // Adjust for faster/slower smooth camera (0.03 = 3% movement per frame)

    // Physics constants
    const G = 0.1; // Gravitational constant (scaled for game physics)
    const TIME_SCALE = 0.01; // Slow down the simulation (1.0 = normal speed, lower = slower)
    const planetGravityFactor = 800; // Extremely strong planet gravity influence on rocket

    // Visual constants
    const COLLECTIBLE_RADIUS = 1;
    const BOOSTER_COLOR = 'green';
    const MATERIAL_COLOR = 'gold';

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let lastX, lastY;
    let followEnabled = true; // Camera following is enabled by default
    let targetOffsetX = 0;
    let targetOffsetY = 0;

    let closestPlanet = null;
    let closestDistanceSQ = Infinity;

    // Initialize planets with position, velocity and mass
    const planets = [];
    
    // ------------------ GAME COLLECTIBLES ------------------
    // Arrays for booster items and material items orbiting planets
    const boosters = [];    // Each item: { planet, angle, distance, x, y }
    const materials = [];   // Each item: { planet, angle, distance, x, y }
    
    // Player scoring & booster count
    let score = 0;
     
    // Calculate mass based on radius (assuming density is constant)
    function calculateMass(radius) {
      return Math.pow(radius, 3) * (1-Math.random()/10) // Scale factor for game physics
    }
    
    // Calculate orbital velocity for a circular orbit
    function calculateOrbitalVelocity(centralMass, orbitRadius) {
      // For a circular orbit: v = sqrt(G * M / r)
      return Math.sqrt(G * centralMass / orbitRadius);
    }

    const sun = {
      x: 0,
      y: 0,
      radius: 30,
      color: 'yellow',
      mass: 1000000 // Much larger mass for the sun to dominate gravitational effects
    };
    
    
    function initializePlanets() {
      // Planet data: radius, distance from sun, color
      const planetData = [
        { radius: 5, distance: 120, color: 'gray' },
        { radius: 8, distance: 200, color: 'blue' },
        { radius: 6, distance: 320, color: 'red' },
        { radius: 10, distance: 440, color: 'orange' }
      ];
      
      // Create planets with proper orbital velocities
      for (const data of planetData) {
        const mass = calculateMass(data.radius);
        const orbitalVelocity = calculateOrbitalVelocity(sun.mass, data.distance);
        
        planets.push({
          radius: data.radius,
          x: data.distance, // Start along positive x-axis
          y: 0,
          vx: 0,
          vy: orbitalVelocity, // Velocity in y direction for circular orbit
          color: data.color,
          mass: mass
        });
      }
    }

    // Spawn a handful of boosters & materials in orbit around each planet
    function initializeCollectibles() {
      const MIN_DISTANCE_FROM_PLANET = 10; // offset from surface

      for (const planet of planets) {
        const orbitalDistance = planet.radius + MIN_DISTANCE_FROM_PLANET;
        const BOOSTERS_PER_PLANET = Math.floor(planet.radius*1.4);
        const MATERIALS_PER_PLANET = Math.floor(planet.radius*2);
      
        // Boosters
        for (let i = 0; i < BOOSTERS_PER_PLANET; i++) {
          boosters.push({
            planet,
            angle: Math.random() * Math.PI * 2,
            distance: orbitalDistance + Math.random() * 5,
            x: 0,
            y: 0
          });
        }

        // Materials
        for (let i = 0; i < MATERIALS_PER_PLANET; i++) {
          materials.push({
            planet,
            angle: Math.random() * Math.PI * 2,
            distance: orbitalDistance + Math.random() * 3,
            x: 0,
            y: 0
          });
        }
      }
    }

    // Rocket object containing all rocket properties
    const rocket = {
      angle: 0,
      rotation: Math.PI/2, // Start facing down (PI/2 radians = 90 degrees in the new system)
      vx: 0,
      vy: 0,
      x: 0,
      y: 0,
      mass: 20, // Mass of the rocket
      thrustPower: 0.05, // Thrust power when engine is fired
      boosters: 0, // Number of collected boosters
    };

    function initializeRocket() {
      // Set rocket initial position near blue planet
      const bluePlanet = planets.find(p => p.color === 'blue');
      if (bluePlanet) {
        // Position rocket close to the blue planet
        const orbitDist = bluePlanet.radius + 2; 
        rocket.x = bluePlanet.x + orbitDist;
        rocket.y = bluePlanet.y;
        
        // Calculate proper orbital velocity around the blue planet using Kepler's laws
        // This uses the enhanced planet gravity factor to match the simulation
        const enhancedPlanetMass = bluePlanet.mass * planetGravityFactor;
        const rocketOrbitSpeed = calculateOrbitalVelocity(enhancedPlanetMass, orbitDist);
        
        // The rocket should orbit clockwise (to match downward orientation)
        // For a rocket positioned to the right of the planet, velocity should be downward
        rocket.rotation = Math.PI/2; // Make sure rocket is facing down (90 degrees in our system)
        rocket.vx = 0;
        rocket.vy = rocketOrbitSpeed + bluePlanet.vy ; 
      }
    }

    const keys = {};
    
    function addListeners(){
      // add zoom, pan, and key listeners
      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const zoom = Math.exp(-e.deltaY * 0.001);
        scale *= zoom;
        offsetX -= (e.offsetX - canvas.width / 2 - offsetX) * (zoom - 1);
        offsetY -= (e.offsetY - canvas.height / 2 - offsetY) * (zoom - 1);
      }, { passive: false });

      canvas.addEventListener('mousedown', e => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        
        // Stop following when user drags
        followEnabled = false;
      });

      canvas.addEventListener('mousemove', e => {
        if (isDragging) {
          offsetX += e.clientX - lastX;
          offsetY += e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
        }
      });

      canvas.addEventListener('mouseup', () => isDragging = false);
      canvas.addEventListener('mouseleave', () => isDragging = false);

      document.addEventListener('keydown', e => {
        keys[e.key] = true;
      });

      document.addEventListener('keyup', e => {
        keys[e.key] = false;
        
        // Toggle camera follow mode with 'f' key
        if (e.key === 'f') {
          followEnabled = !followEnabled;
        }
      });
    }

    function setInitialCameraFocus() {
    
      // Initialize camera focus on blue planet (as a starting point)
      const bluePlanet = planets.find(p => p.color === 'blue');
      if (bluePlanet) {
        offsetX = -bluePlanet.x * scale;
        offsetY = -bluePlanet.y * scale;
        targetOffsetX = offsetX;
        targetOffsetY = offsetY;
      }
    }
    
    function init(){
      initializePlanets();
      initializeRocket();
      initializeCollectibles();
      addListeners();
      setInitialCameraFocus();
    }

    init();

    // Consume a booster to give the rocket a quick speed burst
    function useBooster() {
      if (rocket.boosters > 0) {
        rocket.boosters--;
        const BOOST_POWER = 1; // Stronger than normal thrust
        rocket.vx += Math.sin(rocket.rotation) * BOOST_POWER;
        rocket.vy -= Math.cos(rocket.rotation) * BOOST_POWER;
      }
    }

    function respondToUserInput() {
      // Handle rocket controls
      if (keys['ArrowLeft']) rocket.rotation -= 0.05;
      if (keys['ArrowRight']) rocket.rotation += 0.05;
      if (keys['ArrowUp']) {
        // Apply thrust in the direction the rocket is pointing
        rocket.vx += Math.sin(rocket.rotation) * rocket.thrustPower;
        rocket.vy -= Math.cos(rocket.rotation) * rocket.thrustPower;
      }
      if (keys[' ']) {
        useBooster();
      }
    }

    function DEBUG_show_orbital_info() {
      // Debug overlay - show which planet is influencing the rocket most
      if (closestPlanet && closestDistanceSQ < 10000) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = closestPlanet.color;
        const size = Math.min(200, 40000/closestDistanceSQ);
        ctx.fillRect(100, 100, size, size );
        ctx.restore();
      }
    } 
    
    function drawPlanet(planet) {
      ctx.beginPath();
      ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
      ctx.fillStyle = planet.color;
      ctx.fill();
    }

    function drawRocket() {
        ctx.save();
        ctx.translate(rocket.x, rocket.y);
        // Rotate so the rocket points in the direction it's facing
        ctx.rotate(rocket.rotation - Math.PI/2); // Adjust by -90° so that a rotation of 0 faces right
        
        // Draw rocket with point facing right (which will be rotated to match the thrust direction)
        ctx.beginPath();
        ctx.moveTo(4, 0);    // Nose of rocket (now pointing right)
        ctx.lineTo(-2, -2);  // Top left corner
        ctx.lineTo(-2, 2);   // Bottom left corner
        ctx.closePath();
        ctx.fillStyle = 'white';
        ctx.fill();

        // Draw a bigger flame while boosting
        if (keys[' '] && rocket.boosters > 0) {
          ctx.beginPath();
          ctx.moveTo(-2, -1.8);  // Top of rocket back
          ctx.lineTo(-8, 0);   // Flame tip (smaller)
          ctx.lineTo(-2, 1.8);   // Bottom of rocket back
          ctx.closePath();
          ctx.fillStyle = 'blue';
          ctx.fill();
        }
        
        // Draw a small flame when thrusting
        if (keys['ArrowUp']) {
          ctx.beginPath();
          ctx.moveTo(-2, -1);  // Top of rocket back
          ctx.lineTo(-6, 0);   // Flame tip (smaller)
          ctx.lineTo(-2, 1);   // Bottom of rocket back
          ctx.closePath();
          ctx.fillStyle = 'orange';
          ctx.fill();
        }
        
        ctx.restore();
      }

    // Draw collectibles within world space
    function drawCollectibles() {
      ctx.save();
      for (const b of boosters) {
        ctx.fillStyle = BOOSTER_COLOR;
        ctx.beginPath();
        ctx.arc(b.x, b.y, COLLECTIBLE_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const m of materials) {
        ctx.fillStyle = MATERIAL_COLOR;
        ctx.beginPath();
        ctx.arc(m.x, m.y, COLLECTIBLE_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // HUD drawing (screen space)
    function drawHUD() {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0); // Screen space
      ctx.fillStyle = 'white';
      ctx.font = '16px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`Ore: ${score}`, canvas.width - 10, 20);
      ctx.fillText(`Fuel: ${Math.floor(rocket.boosters)}`, canvas.width - 10, 40);
      ctx.restore();
    }

    // Calculate gravitational force between two bodies
    // with special handling for rocket-planet interactions
    function calculateGravity(body1, body2) {
      const dx = body2.x - body1.x;
      const dy = body2.y - body1.y;
      const distSq = dx * dx + dy * dy;

      if(body2.radius  && distSq < body2.radius*body2.radius){
        rocket.vx *= 0.9999;
        rocket.vy *= 0.9999;
        return { fx: 0, fy: 0, distSq };
      }

      // Special case: if one of the bodies is the rocket and the other is a planet
      let gravityMultiplier = 1;
      
      // Check if body1 is the rocket and body2 is not the sun
      if (body1 === rocket && body2.mass < sun.mass) {
        gravityMultiplier = planetGravityFactor;
      }
      
      // Force magnitude (Newton's law of universal gravitation)
      const force = G * body1.mass * body2.mass * gravityMultiplier / distSq;

      if(force < 5){
        return { fx: 0, fy: 0, distSq };  
      }

      const dist = Math.sqrt(distSq);

      // Force components
      const fx = force * dx / dist;
      const fy = force * dy / dist;
      
      return { fx, fy, distSq };
    }

    function applyAcceleration(forceX, forceY, body,  dt){
      // Apply acceleration (F = ma, so a = F/m)
      const ax = forceX / body.mass;
      const ay = forceY / body.mass;
      
      // Update velocity based on acceleration
      body.vx += ax * dt;
      body.vy += ay * dt;
      
      // Update position
      body.x += body.vx * dt;
      body.y += body.vy * dt;
    }
    
    // Apply gravitational forces and update positions
    function updatePhysics(dt) {

      closestPlanet = null;
      closestDistanceSQ = Infinity;
      
      // Calculate rocket physics - rocket experiences gravity but doesn't affect planets
      let rocketFx = 0;
      let rocketFy = 0;
      
      const { fx: sunFx, fy: sunFy } = calculateGravity(rocket, sun);
      rocketFx += sunFx;
      rocketFy += sunFy;

      for (let i = 0; i < planets.length; i++) {
        const planet = planets[i];

        const { fx, fy } = calculateGravity(planet, sun);

        applyAcceleration(fx, fy, planet, dt);
      
        const { fx: rfx, fy: rfy, distSq } = calculateGravity(rocket, planet);
        rocketFx += rfx;
        rocketFy += rfy;

        if (distSq < closestDistanceSQ) {
          closestDistanceSQ = distSq;
          closestPlanet = planet;
        }
      }
            
      applyAcceleration(rocketFx, rocketFy, rocket, dt);
      
    }
    
    function updateCameraPosition() {
      // Constants used for both planet and rocket following
      const baseThreshold = 4000; // Start adjusting at this distance
      const veryCloseThreshold = 500; // Perfect centering below this
      
      // Determine which object to follow and set target position
      let targetObject;
      let distanceSQ;
      
      if (closestPlanet && closestDistanceSQ <= baseThreshold) {
        // Follow the closest planet when close enough
        targetObject = closestPlanet;
        distanceSQ = closestDistanceSQ;
      } else {
        // Follow the rocket when no planet is close enough
        targetObject = rocket;
        // For the rocket, we'll measure the distance between current camera focus and where it should be
        const cameraDeltaX = (-rocket.x * scale) - offsetX;
        const cameraDeltaY = (-rocket.y * scale) - offsetY;
        distanceSQ = cameraDeltaX * cameraDeltaX + cameraDeltaY * cameraDeltaY;
      }
      
      // Set target offset based on the object we're following
      targetOffsetX = -targetObject.x * scale;
      targetOffsetY = -targetObject.y * scale;
      
      // Apply the appropriate camera movement based on distance
      if (distanceSQ <= veryCloseThreshold) {
        // When extremely close, snap precisely to target position
        offsetX = targetOffsetX;
        offsetY = targetOffsetY;
      } else {
        // Adaptive smoothness - increases as distance decreases
        // Map distance from [veryCloseThreshold, baseThreshold] to [1.0, cameraSmoothness]
        const distanceRatio = Math.min(1, (distanceSQ - veryCloseThreshold) / (baseThreshold - veryCloseThreshold));
        const adaptiveSmoothness = cameraSmoothness + (1 - cameraSmoothness) * (1 - distanceRatio);
        
        // Apply the adaptive smoothing
        offsetX += (targetOffsetX - offsetX) * adaptiveSmoothness;
        offsetY += (targetOffsetY - offsetY) * adaptiveSmoothness;
      }
    }
    
    // Update collectible positions and handle collisions
    function updateCollectibles(dt) {
      

      const updateGroup = (group, onCollect) => {
        for (let i = group.length - 1; i >= 0; i--) {
          const item = group[i];
          const angularSpeed = item.distance * 0.05 * dt;  // radians per update (scaled)
          item.angle += angularSpeed;
          item.x = item.planet.x + Math.cos(item.angle) * item.distance;
          item.y = item.planet.y + Math.sin(item.angle) * item.distance;

          // Collision with rocket (simple distance check)
          const dx = item.x - rocket.x;
          const dy = item.y - rocket.y;
          if (dx * dx + dy * dy < 16) {
            onCollect(); // trigger reward
            group.splice(i, 1); // remove item
          }
        }
      };

      // Booster collection
      updateGroup(boosters, () => {
        rocket.boosters+=100;
      });

      // Material collection
      updateGroup(materials, () => {
        score += 10;
      });
    }

    
    function update() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (followEnabled) {
        updateCameraPosition();
      }

      ctx.setTransform(scale, 0, 0, scale, canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);

      // Update physics (with small time step for stability)
      const dt = TIME_SCALE; // Apply time scale to slow down simulation
      updatePhysics(dt);
      
      updateCollectibles(dt);
      
      // Draw everything
      drawPlanet(sun);

      for (let i = 0; i < planets.length; i++) {
        drawPlanet(planets[i]);
      }

      drawCollectibles();

      drawRocket();

      respondToUserInput();
     
      drawHUD();

      // DEBUG_show_orbital_info();

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
