<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital</title>
  <style>
    body { margin: 0; background: #02030a; overflow: hidden; }
    canvas { display: block; cursor: grab; }
    @font-face {
      font-family: 'SpaceFont';
      src: url('https://fonts.gstatic.com/s/quantico/v15/rax5HiSdp9cPL3km3mujm9_1kw.woff2') format('woff2');
      font-display: swap;
    }
    .start-button {
      position: absolute;
      top: 66%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      background: rgba(79, 195, 247, 0.2);
      color: #4fc3f7;
      border: 2px solid #4fc3f7;
      border-radius: 30px;
      font-size: 24px;
      font-family: 'SpaceFont', Arial, sans-serif;
      cursor: pointer;
      transition: background 0.3s;
      animation: pulse 1.5s infinite;
      outline: none;
      z-index: 100;
      display: none; /* shown by the welcome screen */
    }
    .start-button:hover {
      background: rgba(79, 195, 247, 0.5);
      transform: translate(-50%, -50%) scale(1.05);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(79, 195, 247, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0); }
    }
  </style>
</head>
<body>
  <canvas id="solarSystem"></canvas>
  <button id="startButton" class="start-button">START GAME</button>
  <script src="audio.js"></script>

    // ---------- State ----------

      rotation: Math.PI,          // direction of thrust; PI points "down" (+y) on screen
      rotationSpeed: 0.05,
      mass: 20,
      thrustPower: 0.06,
      boostPower: 0.5,
      fuel: 0, battery: 0, charging: false,
      dead: false, respawnTimer: 0, heat: 0, invuln: 0,

    };

    const camera = { scale: 1, zoomMul: 1, focusX: 0, focusY: 0, offsetX: 0, offsetY: 0, follow: true, shake: 0 };   // focus is the world point at screen centre; offsets are derived
    let closestPlanet = null, closestDistanceSQ = Infinity;
    const prediction = { pts: [], hit: null, frame: null };   // pts are relative to frame (a body) when set
    const predBodies = [];

    const predRocket = { x: 0, y: 0, vx: 0, vy: 0, mass: 20 };

    const keys = {};

    // ---------- Helpers ----------
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const smoothstep = t => t * t * (3 - 2 * t);
    function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function shade(hex, f) {
      const [r, g, b] = hexToRgb(hex);
      return `rgb(${clamp(Math.round(r * f), 0, 255)},${clamp(Math.round(g * f), 0, 255)},${clamp(Math.round(b * f), 0, 255)})`;
    }
    function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
    function formatTime(s) { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
    function worldToScreen(x, y) { return { x: x * camera.scale + W / 2 + camera.offsetX, y: y * camera.scale + H / 2 + camera.offsetY }; }
    function calculateMass(radius) { return Math.pow(radius, 3) * planetGravityFactor; }
    function orbitalVelocity(centralMass, r) { return Math.sqrt(G * centralMass / r); }
    function soiRadius(mass) { return Math.sqrt(G * rocket.mass * mass / MIN_FORCE); }   // where the rocket stops feeling a body
    function homePlanet() { return planets.find(p => p.home) || planets[0]; }
    function levelBelts(L) { const A = L && L.asteroids; return !A ? [] : Array.isArray(A) ? A : [A]; }   // a level may have one belt or several

    // ---------- World building ----------
    function makeStars() {
      stars = [];
      const n = Math.floor(W * H / 5000);
      for (let i = 0; i < n; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, size: Math.random() * 1.6 + 0.4,
                     par: 0.05 + Math.random() * 0.25, phase: Math.random() * Math.PI * 2,
                     tint: i % 5 === 0 ? '#b0c4de' : (i % 7 === 0 ? '#ffe4c4' : '#ffffff') });
      }
    }

    function buildLevel(def) {
      planets.length = 0; ores.length = 0; fuels.length = 0; asteroids.length = 0;
      particles.length = 0; rings.length = 0; popups.length = 0; trail.length = 0;
      Object.assign(sun, DEFAULT_STAR, def.star || {});
      def.planets.forEach((d, i) => {
        const mass = calculateMass(d.radius);
        const a = d.startAngle === undefined ? i * 1.7 : d.startAngle;
        const v = orbitalVelocity(sun.mass, d.distance) * (d.retro ? -1 : 1);   // retrograde worlds orbit the other way
        const p = {
          name: d.name, radius: d.radius, color: d.color, mass, home: !!d.home, distance: d.distance, retro: !!d.retro,
          x: Math.cos(a) * d.distance, y: Math.sin(a) * d.distance,
          vx: -Math.sin(a) * v, vy: Math.cos(a) * v,
          soi: soiRadius(mass), oreTotal: d.ore, collected: 0,
        };
        planets.push(p);
        // Ore sits in two belts: a low one the starting orbit skims, and a high one that needs a burn to reach.
        for (let k = 0; k < d.ore; k++) {
          const distance = k % 2 === 0 ? p.radius + 5 + Math.random() * 7 : p.radius + 24 + Math.random() * 12;
          ores.push({ planet: p, angle: Math.random() * Math.PI * 2, distance, x: 0, y: 0, phase: Math.random() * Math.PI * 2 });
        }
        for (let k = 0; k < d.fuel; k++) {
          fuels.push({ planet: p, angle: Math.random() * Math.PI * 2, distance: p.radius + 12 + Math.random() * 12, x: 0, y: 0, phase: Math.random() * Math.PI * 2 });
        }
      });
      for (const A of levelBelts(def)) {
        for (let k = 0; k < A.count; k++) {
          const dist = A.inner + Math.random() * (A.outer - A.inner);
          const radius = 3 + Math.random() * 3;
          const shape = [];
          const sides = 6 + Math.floor(Math.random() * 3);
          for (let s = 0; s < sides; s++) {
            const ang = s / sides * Math.PI * 2, r = radius * (0.7 + Math.random() * 0.5);
            shape.push([Math.cos(ang) * r, Math.sin(ang) * r]);
          }
          asteroids.push({ dist, angle: Math.random() * Math.PI * 2, omega: orbitalVelocity(sun.mass, dist) / dist,
                           radius, shape, rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.02, x: 0, y: 0 });
        }
      }
      gravBodies = [sun, ...planets];
      predBodies.length = 0;
      for (const p of planets) predBodies.push({ x: 0, y: 0, vx: 0, vy: 0, mass: p.mass, radius: p.radius });
      predGrav = [sun, ...predBodies];
      for (const a of asteroids) { a.x = Math.cos(a.angle) * a.dist; a.y = Math.sin(a.angle) * a.dist; }
      moveCollectibles(0);
    }

    // Put the rocket into a circular orbit around the home planet, facing prograde.
    function spawnRocket() {
      const home = homePlanet();
      const orbitDist = home.radius + 12;
      const v = orbitalVelocity(home.mass, orbitDist);
      rocket.x = home.x + orbitDist;
      rocket.y = home.y;
      rocket.vx = home.vx;
      rocket.vy = home.vy + v;
      rocket.rotation = Math.PI;
      rocket.dead = false; rocket.heat = 0; rocket.invuln = 120; rocket.thrusting = false; rocket.boosting = false;
      trail.length = 0; trailFrame = null;
      rocket.battery = BATTERY_MAX; rocket.charging = false;
      closestPlanet = home; closestDistanceSQ = orbitDist * orbitDist;
    }

    // ---------- Physics ----------
    function gravityAt(x, y, mass, bodies, out) {
      let fx = 0, fy = 0;
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        const dx = b.x - x, dy = b.y - y;
        const core = b.radius * b.radius * 0.25;
        const d2 = Math.max(dx * dx + dy * dy, core);
        const f = G * mass * b.mass / d2;
        if (f < MIN_FORCE && !b.alwaysPulls) continue;
        const d = Math.sqrt(d2);
        fx += f * dx / d; fy += f * dy / d;
      }
      out.fx = fx; out.fy = fy;
    }
    function integrate(b, f, dt) {
      b.vx += f.fx / b.mass * dt;
      b.vy += f.fy / b.mass * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }

    function stepWorld() {
      const dt = TIME_SCALE;
      for (const p of planets) { gravityAt(p.x, p.y, p.mass, sunOnly, tmpForce); integrate(p, tmpForce, dt); }
      for (const a of asteroids) {
        a.angle += a.omega * dt;
        a.x = Math.cos(a.angle) * a.dist; a.y = Math.sin(a.angle) * a.dist;
        a.rot += a.rotSpeed;
      }
      if (!rocket.dead) {
        gravityAt(rocket.x, rocket.y, rocket.mass, gravBodies, tmpForce);
        integrate(rocket, tmpForce, dt);
      }
      closestPlanet = null; closestDistanceSQ = Infinity;
      for (const b of gravBodies) {
        const dx = b.x - rocket.x, dy = b.y - rocket.y, d2 = dx * dx + dy * dy;
        if (d2 < closestDistanceSQ) { closestDistanceSQ = d2; closestPlanet = b; }
      }
      if (!rocket.dead && game.ticks % 2 === 0) recordTrail();
      moveCollectibles(dt);
      if (rocket.invuln > 0) rocket.invuln--;
    }

    // The body whose sphere of influence the rocket is inside, if any. Paths are stored relative to
    // it, so an orbit around a moving planet draws as a loop instead of a stretched spiral.
    function dominantBody() {
      if (!closestPlanet) return null;
      const soi = closestPlanet === sun ? soiRadius(sun.mass) : closestPlanet.soi;
      return closestDistanceSQ < soi * soi ? closestPlanet : null;
    }
    function recordTrail() {
      const frame = dominantBody();
      if (frame !== trailFrame) {   // re-base the stored points so the line never jumps when the frame changes
        const ox = (trailFrame ? trailFrame.x : 0) - (frame ? frame.x : 0);
        const oy = (trailFrame ? trailFrame.y : 0) - (frame ? frame.y : 0);
        for (let i = 0; i < trail.length; i += 2) { trail[i] += ox; trail[i + 1] += oy; }
        trailFrame = frame;
      }
      trail.push(rocket.x - (frame ? frame.x : 0), rocket.y - (frame ? frame.y : 0));
      if (trail.length > TRAIL_LENGTH * 2) trail.splice(0, 2);
    }

    function moveCollectibles(dt) {
      const move = item => {
        item.angle += orbitalVelocity(item.planet.mass, item.distance) / item.distance * dt * 0.3;
        item.x = item.planet.x + Math.cos(item.angle) * item.distance;
        item.y = item.planet.y + Math.sin(item.angle) * item.distance;
      };
      ores.forEach(move); fuels.forEach(move);
    }

    function collectItems() {
      for (let i = ores.length - 1; i >= 0; i--) {
        const o = ores[i];
        const dx = o.x - rocket.x, dy = o.y - rocket.y;
        if (dx * dx + dy * dy < COLLECT_RADIUS_SQ) {
          ores.splice(i, 1);
          o.planet.collected++;
          game.ore++;
          game.combo = game.comboTimer > 0 ? Math.min(MAX_COMBO, game.combo + 1) : 1;
          game.comboTimer = COMBO_WINDOW;
          const points = ORE_POINTS * game.combo;
          game.score += points;
          popup(o.x, o.y, `+${points}` + (game.combo > 1 ? `  x${game.combo}` : ''), '#facc15');
          sparkle(o.x, o.y, '#facc15');
          OrbitalAudio.sfx.collectOre(game.combo);
          if (goalMet()) { completeLevel(); return; }
        }
      }
      for (let i = fuels.length - 1; i >= 0; i--) {
        const f = fuels[i];
        const dx = f.x - rocket.x, dy = f.y - rocket.y;
        if (dx * dx + dy * dy < COLLECT_RADIUS_SQ) {
          fuels.splice(i, 1);
          rocket.fuel = Math.min(MAX_FUEL, rocket.fuel + FUEL_PER_PICKUP);
          popup(f.x, f.y, `+${FUEL_PER_PICKUP} BOOST`, '#4ade80');
          sparkle(f.x, f.y, '#4ade80');
          OrbitalAudio.sfx.collectFuel();
        }
      }
    }

    function checkCollisions() {
      const ds = Math.hypot(rocket.x - sun.x, rocket.y - sun.y);
      if (ds < sun.radius + 1) return destroyRocket('Flew into the sun');
      if (ds < sun.heatRadius) {
        rocket.heat = Math.min(1, rocket.heat + (1 - ds / sun.heatRadius) * 0.025);
        if (game.ticks % 20 === 0) OrbitalAudio.sfx.sizzle();
        if (rocket.heat >= 1) return destroyRocket('Hull melted');
      } else {
        rocket.heat = Math.max(0, rocket.heat - 0.004);
      }
      for (const p of planets) {
        const r = p.radius + 1.5;
        const dx = p.x - rocket.x, dy = p.y - rocket.y;
        if (dx * dx + dy * dy < r * r) return destroyRocket(`Crashed into ${p.name}`);
      }
      for (const a of asteroids) {
        const r = a.radius + 1.5;
        const dx = a.x - rocket.x, dy = a.y - rocket.y;
        if (dx * dx + dy * dy < r * r) return destroyRocket('Hit an asteroid');
      }
    }

    function destroyRocket(reason) {
      if (rocket.dead) return;
      rocket.dead = true; rocket.respawnTimer = 150; rocket.heat = 0;
      rocket.thrusting = false; rocket.boosting = false;
      game.lives--; game.combo = 0; game.comboTimer = 0; game.deathReason = reason;
      explode(rocket.x, rocket.y, rocket.vx, rocket.vy);
      camera.shake = 22;
      popup(rocket.x, rocket.y - 6, reason.toUpperCase(), '#ff5252', 16);
      OrbitalAudio.sfx.crash();
      syncEngineAudio();
    }

    function handleRespawn() {
      if (!rocket.dead) return;
      rocket.respawnTimer--;
      if (rocket.respawnTimer > 0) return;
      if (game.lives > 0) {
        spawnRocket();
        rocket.fuel = Math.max(rocket.fuel, START_FUEL);
        popup(rocket.x, rocket.y - 8, `${game.lives} ${game.lives === 1 ? 'LIFE' : 'LIVES'} LEFT`, '#4fc3f7');
        OrbitalAudio.sfx.respawn();
      } else {
        endGame(game.deathReason);
      }
    }

    // ---------- Trajectory prediction ----------
    // Simulates the rocket (and the planets) forward from the current state with no further thrust.
    // When the rocket is inside a body's sphere of influence the path is stored relative to that
    // body, so a stable orbit draws as a closed loop that moves with its planet.
    function computePrediction() {
      const pts = prediction.pts;
      pts.length = 0; prediction.hit = null; prediction.frame = null;
      if (rocket.dead || !navActive()) return;
      for (let i = 0; i < planets.length; i++) {
        const p = planets[i], b = predBodies[i];
        b.x = p.x; b.y = p.y; b.vx = p.vx; b.vy = p.vy;
      }
      let frameBody = null;
      prediction.frame = dominantBody();
      if (prediction.frame) frameBody = prediction.frame === sun ? sun : predBodies[planets.indexOf(prediction.frame)];
      const r = predRocket;
      r.x = rocket.x; r.y = rocket.y; r.vx = rocket.vx; r.vy = rocket.vy;
      const dt = TIME_SCALE;
      const steps = closestDistanceSQ < 120 * 120 ? PREDICT_STEPS_NEAR : PREDICT_STEPS_FAR;
      for (let i = 1; i <= steps; i++) {
        for (const b of predBodies) { gravityAt(b.x, b.y, b.mass, sunOnly, tmpForce); integrate(b, tmpForce, dt); }
        gravityAt(r.x, r.y, r.mass, predGrav, tmpForce);
        integrate(r, tmpForce, dt);
        const fx = frameBody ? frameBody.x : 0, fy = frameBody ? frameBody.y : 0;
        if (i % PREDICT_EVERY === 0) pts.push(r.x - fx, r.y - fy);
        let hit = r.x * r.x + r.y * r.y < (sun.radius + 1) * (sun.radius + 1);
        if (!hit) for (const b of predBodies) {
          const dx = b.x - r.x, dy = b.y - r.y, rr = b.radius + 1.5;
          if (dx * dx + dy * dy < rr * rr) { hit = true; break; }
        }
        if (!hit && i % 3 === 0) {
          const t = i * dt;
          for (const a of asteroids) {
            const ang = a.angle + a.omega * t;
            const dx = Math.cos(ang) * a.dist - r.x, dy = Math.sin(ang) * a.dist - r.y, rr = a.radius + 1.5;
            if (dx * dx + dy * dy < rr * rr) { hit = true; break; }
          }
        }
        if (hit) { prediction.hit = { x: r.x - fx, y: r.y - fy }; pts.push(r.x - fx, r.y - fy); break; }
      }
    }

    // ---------- Effects ----------
    function spawnParticle(x, y, vx, vy, life, size, color) {
      particles.push({ x, y, vx, vy, life, maxLife: life, size, color });
    }
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vx *= 0.98; p.vy *= 0.98;
        if (--p.life <= 0) particles.splice(i, 1);
      }
      for (let i = rings.length - 1; i >= 0; i--) if (--rings[i].life <= 0) rings.splice(i, 1);
    }
    function exhaust(boost) {
      const dx = Math.sin(rocket.rotation), dy = -Math.cos(rocket.rotation);
      const n = boost ? 3 : 2;
      for (let i = 0; i < n; i++) {
        const side = (Math.random() - 0.5) * 1.2;
        const speed = (boost ? 1.3 : 0.7) + Math.random() * 0.4;
        spawnParticle(rocket.x - dx * 2.5 - dy * side, rocket.y - dy * 2.5 + dx * side,
                      rocket.vx * TIME_SCALE - dx * speed + (Math.random() - 0.5) * 0.2,
                      rocket.vy * TIME_SCALE - dy * speed + (Math.random() - 0.5) * 0.2,
                      20 + Math.random() * 20, boost ? 1.4 : 1,
                      boost ? (Math.random() < 0.5 ? '#60a5fa' : '#e0f2fe') : (Math.random() < 0.5 ? '#fb923c' : '#fde68a'));
      }
    }
    function explode(x, y, vx, vy) {
      const colors = ['#ffffff', '#fde68a', '#fb923c', '#ef4444'];
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * Math.PI * 2, s = 0.3 + Math.random() * 2.5;
        spawnParticle(x, y, vx * TIME_SCALE + Math.cos(a) * s, vy * TIME_SCALE + Math.sin(a) * s,
                      30 + Math.random() * 40, 0.8 + Math.random() * 1.5, colors[i % 4]);
      }
      rings.push({ x, y, life: 30, maxLife: 30 });
    }
    function sparkle(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2, s = 0.3 + Math.random() * 0.8;
        spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, 20 + Math.random() * 12, 0.6, color);
      }
    }
    function popup(x, y, text, color, size = 14) {
      popups.push({ x, y, text, color, size, life: 90, maxLife: 90 });
    }
    function updatePopups() {
      for (let i = popups.length - 1; i >= 0; i--) if (--popups[i].life <= 0) popups.splice(i, 1);
    }

    // ---------- Camera ----------
    // Zoom in near planets and out in deep space; follow in world space so zooming never drags the view.
    function updateCamera() {
      const d = Math.sqrt(closestDistanceSQ);
      const auto = clamp(260 / Math.max(d, 1), FAR_ZOOM, game.level.nearZoom || NEAR_ZOOM);   // compact systems cap the zoom so they stay in view
      const target = clamp(auto * camera.zoomMul, 0.25, 8);
      camera.scale += (target - camera.scale) * 0.05;

      if (camera.follow) {
        const baseThreshold = 4000;   // follow the planet when the rocket is this close (squared world units)
        const veryClose = 500;        // snap exactly onto the target below this (squared world units)
        let obj, distSQ;
        if (closestPlanet && closestDistanceSQ <= baseThreshold && !rocket.dead) {
          obj = closestPlanet; distSQ = closestDistanceSQ;
        } else {
          obj = rocket;
          const dx = rocket.x - camera.focusX, dy = rocket.y - camera.focusY;
          distSQ = dx * dx + dy * dy;
        }
        if (distSQ <= veryClose) {
          camera.focusX = obj.x; camera.focusY = obj.y;
        } else {
          const ratio = Math.min(1, (distSQ - veryClose) / (baseThreshold - veryClose));
          const smooth = CAMERA_SMOOTHNESS + (1 - CAMERA_SMOOTHNESS) * (1 - ratio);
          camera.focusX += (obj.x - camera.focusX) * smooth;
          camera.focusY += (obj.y - camera.focusY) * smooth;
        }
      }
      camera.offsetX = -camera.focusX * camera.scale;
      camera.offsetY = -camera.focusY * camera.scale;
    }

    // ---------- Game flow ----------
    function newGame(levelIdx) {
      game.inRun = true; game.score = 0; game.lives = START_LIVES; rocket.fuel = START_FUEL;
      startLevel(levelIdx);
    }

    function startLevel(idx) {
      const L = LEVELS[idx];
      game.levelIndex = idx; game.level = L;
      game.ore = 0; game.timeLeft = L.time; game.lastSec = -1; game.hot = false;
      game.combo = 0; game.comboTimer = 0; game.ticks = 0; game.stateTimer = 0; game.deathReason = '';
      game.nav = true; ui.boost = false; ui.charge = false; pressedButton = null;
      buildLevel(L);
      spawnRocket();
      rocket.fuel = Math.max(rocket.fuel, L.startFuel || START_FUEL);
      const home = homePlanet();
      camera.follow = true; camera.zoomMul = 1; camera.scale = L.nearZoom || NEAR_ZOOM; camera.shake = 0;
      camera.focusX = home.x; camera.focusY = home.y;
      camera.offsetX = -home.x * camera.scale; camera.offsetY = -home.y * camera.scale;
      computePrediction();
      game.state = GAME_STATE.LEVEL_INTRO;
      startButton.style.display = 'none';
      OrbitalAudio.setIntensity(0);
      OrbitalAudio.startMusic(L.theme);
    }

    function beginPlay() {
      game.state = GAME_STATE.PLAYING; game.stateTimer = 0;
      keys[' '] = false;
      OrbitalAudio.sfx.select();
    }

    function goalMet() {
      const g = game.level.goal;
      if (g.type === 'ore') return game.ore >= g.count;
      return planets.every(p => p.collected > 0);
    }
    function goalProgress() {
      const g = game.level.goal;
      if (g.type === 'ore') return game.ore / g.count;
      return planets.filter(p => p.collected > 0).length / planets.length;
    }
    function goalText() {
      const g = game.level.goal;
      if (g.type === 'ore') return `ORE  ${game.ore} / ${g.count}`;
      return planets.map(p => (p.collected > 0 ? '✓ ' : '○ ') + p.name.toUpperCase()).join('   ');
    }
    function oresLeft(p) { let n = 0; for (const o of ores) if (o.planet === p) n++; return n; }
    function findTarget() {
      const g = game.level.goal;
      let best = null, bestD = Infinity;
      for (const p of planets) {
        const wanted = g.type === 'visit' ? p.collected === 0 : oresLeft(p) > 0;
        if (!wanted) continue;
        const dx = p.x - rocket.x, dy = p.y - rocket.y, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = p; }
      }
      return best;
    }

    function completeLevel() {
      const timeBonus = Math.floor(game.timeLeft) * TIME_BONUS_PER_SECOND;
      game.stats = { ore: game.ore, timeLeft: game.timeLeft, timeBonus, levelBonus: LEVEL_BONUS };
      game.score += timeBonus + LEVEL_BONUS;
      game.lives = Math.min(MAX_LIVES, game.lives + 1);
      updateHighScore();
      maxLevelReached = Math.max(maxLevelReached, Math.min(game.levelIndex + 1, LEVELS.length - 1));
      localStorage.setItem('orbitalMaxLevel', maxLevelReached);
      cleared = Math.max(cleared, game.levelIndex + 1);
      localStorage.setItem('orbitalCleared', cleared);
      game.state = GAME_STATE.LEVEL_COMPLETE; game.stateTimer = 0;
      rocket.thrusting = false; rocket.boosting = false;
      for (let i = 0; i < 6; i++) sparkle(rocket.x + (Math.random() - 0.5) * 20, rocket.y + (Math.random() - 0.5) * 20, ['#facc15', '#4ade80', '#4fc3f7'][i % 3]);
      OrbitalAudio.stopMusic();
      OrbitalAudio.sfx.levelComplete();
      syncEngineAudio();
    }

    function nextLevel() {
      if (game.levelIndex + 1 < LEVELS.length) openMap(game.levelIndex + 1, game.levelIndex);   // fly on to the next system
      else winGame();
    }

    function winGame() {
      updateHighScore(); game.inRun = false;
      game.state = GAME_STATE.WIN; game.stateTimer = 0;
      OrbitalAudio.sfx.win();
    }

    function endGame(reason) {
      updateHighScore(); game.inRun = false;
      game.gameOverReason = reason;
      game.state = GAME_STATE.GAME_OVER; game.stateTimer = 0;
      rocket.thrusting = false; rocket.boosting = false;
      OrbitalAudio.stopMusic();
      OrbitalAudio.sfx.gameOver();
      OrbitalAudio.setIntensity(0);
      syncEngineAudio();
    }

    function toWelcome() {
      game.state = GAME_STATE.WELCOME; game.stateTimer = 0; game.level = null; game.inRun = false;
      map.travel = null;
      OrbitalAudio.startMusic('ambient');
    }

    // ---------- Star map ----------
    // Every level is a star system. The map shows them all, lets the player pick any unlocked one,
    // and animates the flight from a finished system to the next.
    function openMap(select, travelFrom = -1) {
      game.state = GAME_STATE.MAP; game.stateTimer = 0; game.level = null;
      map.selected = select; map.rocketAt = travelFrom >= 0 ? travelFrom : select; map.hover = -1;
      map.travel = travelFrom >= 0 ? { from: travelFrom, to: select, t: 0, duration: 180 } : null;
      particles.length = 0; rings.length = 0; popups.length = 0;
      hoverButton = null; pressedButton = null;
      startButton.style.display = 'none';
      OrbitalAudio.startMusic('ambient');
      if (map.travel) OrbitalAudio.sfx.warp();
    }
    function mapStarPos(i) {   // the systems snake across the screen in two or three rows
      const n = LEVELS.length, rows = n > 14 ? 3 : 2, cols = Math.ceil(n / rows);
      const row = Math.floor(i / cols), k = i - row * cols;
      const c = row % 2 === 0 ? k : cols - 1 - k;
      const rowY = rows === 3 ? [0.28, 0.47, 0.66] : [0.40, 0.64];
      return { x: W * (0.12 + 0.76 * c / Math.max(1, cols - 1)), y: H * rowY[row] + 14 * Math.sin(i * 2.1) };
    }
    function mapStarStyle(i) { return Object.assign({}, DEFAULT_STAR, LEVELS[i].star || {}); }
    function travelPos(T, k) {   // a gentle arc between two systems
      const A = mapStarPos(T.from), B = mapStarPos(T.to);
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      const bulge = len * 0.18 * Math.sin(Math.PI * k);
      return { x: A.x + dx * k - dy / len * bulge, y: A.y + dy * k + dx / len * bulge };
    }
    function mapStarAt(x, y) {
      for (let i = 0; i <= maxLevelReached && i < LEVELS.length; i++) {
        const p = mapStarPos(i);
        if (Math.hypot(p.x - x, p.y - y) < 24) return i;
      }
      return -1;
    }
    function selectStar(i) {
      if (map.travel || i < 0 || i > maxLevelReached || i >= LEVELS.length || i === map.selected) return;
      map.selected = i;
      OrbitalAudio.sfx.select();
    }
    function launchSelected() {
      if (map.travel) return;
      if (game.inRun) startLevel(map.selected); else newGame(map.selected);
    }
    function leaveMap() {
      if (game.inRun) updateHighScore();
      toWelcome();
    }
    function updateTravel() {
      const T = map.travel;
      if (!T) return;
      T.t = Math.min(1, T.t + 1 / T.duration);
      const k = smoothstep(T.t), p = travelPos(T, k), q = travelPos(T, Math.min(1, k + 0.01));
      const ang = Math.atan2(q.y - p.y, q.x - p.x);
      for (let i = 0; i < 2; i++) {   // exhaust, in screen pixels
        const spread = (Math.random() - 0.5) * 1.2, speed = 2 + Math.random() * 2;
        spawnParticle(p.x - Math.cos(ang) * 8, p.y - Math.sin(ang) * 8, -Math.cos(ang + spread) * speed, -Math.sin(ang + spread) * speed,
                      25 + Math.random() * 15, 2.5, i ? '#4fc3f7' : '#ffffff');
      }
      if (T.t >= 1) {
        map.rocketAt = T.to; map.selected = T.to; map.travel = null;
        OrbitalAudio.sfx.arrive();
      }
    }

    function updateHighScore() {
      if (game.score > highScore) {
        highScore = game.score;
        localStorage.setItem('orbitalHighScore', highScore);
      }
    }

    function updateTimer() {
      game.timeLeft -= 1 / 60;
      const sec = Math.ceil(game.timeLeft);
      if (sec !== game.lastSec) {
        game.lastSec = sec;
        if (sec <= 10 && sec > 0) OrbitalAudio.sfx.tick();
      }
      const hot = game.timeLeft < 30;
      if (hot !== game.hot) { game.hot = hot; OrbitalAudio.setIntensity(hot ? 1 : 0); }
      if (game.timeLeft <= 0) { game.timeLeft = 0; endGame('Out of time'); }
    }
    function updateCombo() {
      if (game.comboTimer > 0 && --game.comboTimer === 0) game.combo = 0;
    }

    // ---------- Input ----------
    function unlockAudio() {
      if (!OrbitalAudio.unlock()) return;
      if (game.state === GAME_STATE.WELCOME) OrbitalAudio.startMusic('ambient');
    }

    function handleInput() {
      if (rocket.dead) return;
      const left = keys['ArrowLeft'] || keys['a'];
      const right = keys['ArrowRight'] || keys['d'];
      const up = keys['ArrowUp'] || keys['w'];
      const boost = keys[' '] || ui.boost;
      if (left) rocket.rotation -= rocket.rotationSpeed;
      if (right) rocket.rotation += rocket.rotationSpeed;
      const dx = Math.sin(rocket.rotation), dy = -Math.cos(rocket.rotation);
      rocket.thrusting = !!up;
      rocket.boosting = !!boost && rocket.fuel > 0;
      if (rocket.thrusting) {
        rocket.vx += dx * rocket.thrustPower;
        rocket.vy += dy * rocket.thrustPower;
      }
      if (rocket.boosting) {
        rocket.fuel = Math.max(0, rocket.fuel - 1);
        rocket.vx += dx * rocket.boostPower;
        rocket.vy += dy * rocket.boostPower;
      }
      if (rocket.boosting) exhaust(true);
      else if (rocket.thrusting) exhaust(false);
    }

    // ---------- Battery and the nav AI ----------
    function navActive() {
      if (game.level.noNav) return false;   // some systems have no working nav AI at all
      return !game.level.battery || (game.nav && rocket.battery > 0);
    }
    function solarRate() {
      const d = Math.max(Math.hypot(rocket.x, rocket.y), sun.radius);
      return SOLAR_RATE * sun.luminosity * (SOLAR_DISTANCE / d) ** 2;
    }
    function powerRate() {   // net battery change per second, shown on the gauge
      let r = solarRate();
      if (game.nav) r -= NAV_DRAIN;
      if (rocket.charging) r += CHARGE_RATE;
      return r;
    }
    function toggleNav() {
      if (!game.level.battery || rocket.dead) return;
      if (!game.nav && rocket.battery < NAV_MIN_CHARGE) {
        popup(rocket.x, rocket.y - 8, 'NO POWER', '#ff5252', 12);
        OrbitalAudio.sfx.tick();
        return;
      }
      game.nav = !game.nav;
      popup(rocket.x, rocket.y - 8, game.nav ? 'NAV AI ON' : 'NAV AI OFF', game.nav ? '#4fc3f7' : '#cbd5e1', 12);
      OrbitalAudio.sfx.select();
    }
    function updatePower() {
      if (!game.level.battery || rocket.dead) { rocket.charging = false; return; }
      const dt = 1 / 60;
      rocket.charging = !!(keys['r'] || ui.charge) && rocket.fuel > 0 && rocket.battery < BATTERY_MAX;
      let b = rocket.battery + solarRate() * dt;
      if (rocket.charging) {
        const add = Math.min(CHARGE_RATE * dt, BATTERY_MAX - b, rocket.fuel / CHARGE_FUEL_COST);
        b += add; rocket.fuel = Math.max(0, rocket.fuel - add * CHARGE_FUEL_COST);
      }
      if (game.nav) {
        b -= NAV_DRAIN * dt;
        if (b <= 0) {
          b = 0; game.nav = false;
          popup(rocket.x, rocket.y - 8, 'NAV AI OFFLINE', '#ff5252', 12);
          OrbitalAudio.sfx.tick();
        }
      }
      rocket.battery = clamp(b, 0, BATTERY_MAX);
    }

    function syncEngineAudio() {
      const playing = game.state === GAME_STATE.PLAYING && !rocket.dead;
      const th = playing && rocket.thrusting && !rocket.boosting;
      const bo = playing && rocket.boosting;
      if (th !== audioThrust) { audioThrust = th; OrbitalAudio.setThrust(th); }
      if (bo !== audioBoost) { audioBoost = bo; OrbitalAudio.setBoost(bo); }
    }

    function addListeners() {
      window.addEventListener('resize', () => {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        makeStars();
      });
      window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; ui.boost = ui.charge = false; pressedButton = null; hoverButton = null; });

      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        camera.zoomMul = clamp(camera.zoomMul * Math.exp(-e.deltaY * 0.001), 0.25, 3);
      }, { passive: false });

      // On-screen console buttons take presses before the camera drag does.
      function pressAt(x, y) {
        const S = game.state;
        if (S === GAME_STATE.MAP) {
          const b = mapButtonAt(x, y);
          if (b) { b.press(); return true; }
          const i = mapStarAt(x, y);
          if (i < 0 || map.travel) return false;
          if (i === map.selected) launchSelected(); else selectStar(i);   // a second click on the chosen star launches
          return true;
        }
        if (S === GAME_STATE.LEVEL_INTRO) {
          if (hit(introButton, x, y) || buttonAt(x, y)) { beginPlay(); return true; }
          return false;
        }
        if (S !== GAME_STATE.PLAYING) return false;
        const b = buttonAt(x, y);
        if (!b) return false;
        pressedButton = b; b.press();
        return true;
      }
      function releasePress() { if (pressedButton) { pressedButton.release(); pressedButton = null; } }
      canvas.addEventListener('mousedown', e => {
        unlockAudio();
        if (pressAt(e.clientX, e.clientY) || game.state === GAME_STATE.MAP) return;
        isDragging = true; lastX = e.clientX; lastY = e.clientY;
      });
      canvas.addEventListener('mousemove', e => {
        if (!isDragging) {
          const S = game.state, x = e.clientX, y = e.clientY;
          hoverButton = S === GAME_STATE.PLAYING ? buttonAt(x, y)
                      : S === GAME_STATE.MAP ? mapButtonAt(x, y)
                      : S === GAME_STATE.LEVEL_INTRO && hit(introButton, x, y) ? introButton : null;
          map.hover = S === GAME_STATE.MAP ? mapStarAt(x, y) : -1;
          canvas.style.cursor = hoverButton || map.hover >= 0 ? 'pointer' : S === GAME_STATE.MAP ? 'default' : 'grab';
          return;
        }
        const mx = e.clientX - lastX, my = e.clientY - lastY;
        if (Math.abs(mx) + Math.abs(my) > 2) camera.follow = false;   // dragging the view stops the camera following
        camera.focusX -= mx / camera.scale; camera.focusY -= my / camera.scale;
        camera.offsetX = -camera.focusX * camera.scale; camera.offsetY = -camera.focusY * camera.scale;
        lastX = e.clientX; lastY = e.clientY;
      });
      canvas.addEventListener('mouseup', () => { isDragging = false; releasePress(); });
      canvas.addEventListener('mouseleave', () => { isDragging = false; releasePress(); hoverButton = null; });
      canvas.addEventListener('touchstart', e => {
        unlockAudio();
        const t = e.changedTouches[0];
        if (t && pressAt(t.clientX, t.clientY)) e.preventDefault();
      }, { passive: false });
      canvas.addEventListener('touchend', releasePress);
      canvas.addEventListener('touchcancel', releasePress);

      document.addEventListener('keydown', e => {
        unlockAudio();
        const k = e.key;
        keys[k] = true;
        if (k.length === 1) keys[k.toLowerCase()] = true;
        if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
        if (e.repeat) return;
        const S = game.state, confirm = k === ' ' || k === 'Enter';
        if (k === 'm' || k === 'M') { OrbitalAudio.toggleMute(); return; }
        if (S === GAME_STATE.WELCOME) {
          if (confirm) openMap(maxLevelReached);
        } else if (S === GAME_STATE.MAP) {
          if (map.travel) { if (confirm) map.travel.t = 1; }   // skip the flight
          else if (confirm) launchSelected();
          else if (['ArrowLeft', 'ArrowUp', 'a', 'A', 'w', 'W'].includes(k)) selectStar(map.selected - 1);
          else if (['ArrowRight', 'ArrowDown', 'd', 'D', 's', 'S'].includes(k)) selectStar(map.selected + 1);
          else if (k === 'Escape') leaveMap();
        } else if (S === GAME_STATE.LEVEL_INTRO) {   // only a deliberate launch starts the clock
          if (confirm) beginPlay();
          else if (k === 'Escape') openMap(game.levelIndex);
        } else if (S === GAME_STATE.PLAYING) {
          if (k === 'x' || k === 'X') endGame('Run abandoned');
          if (k === 'f' || k === 'F') camera.follow = !camera.follow;
          if (k === 'n' || k === 'N') toggleNav();
        } else if (S === GAME_STATE.LEVEL_COMPLETE) {
          if (confirm && game.stateTimer > 45) nextLevel();
        } else if (S === GAME_STATE.GAME_OVER || S === GAME_STATE.WIN) {
          if (confirm && game.stateTimer > 90) toWelcome();
        }
      });
      document.addEventListener('keyup', e => {
        keys[e.key] = false;
        if (e.key.length === 1) keys[e.key.toLowerCase()] = false;
      });

      startButton.addEventListener('click', () => { unlockAudio(); openMap(maxLevelReached); });
    }

    // ---------- Rendering: world ----------
    function drawStars(focusX, focusY, t) {
      for (const s of stars) {
        const x = ((s.x - focusX * s.par) % W + W) % W;
        const y = ((s.y - focusY * s.par) % H + H) % H;
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 0.03 + s.phase);
        ctx.fillStyle = s.tint;
        ctx.fillRect(x, y, s.size, s.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawOrbitRings() {
      ctx.lineWidth = 1 / camera.scale;
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      for (const p of planets) { ctx.beginPath(); ctx.arc(0, 0, p.distance, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = 'rgba(156,163,175,0.06)';
      for (const A of levelBelts(game.level)) {
        ctx.beginPath(); ctx.arc(0, 0, A.outer, 0, Math.PI * 2); ctx.arc(0, 0, A.inner, 0, Math.PI * 2, true); ctx.fill();
      }
    }

    function drawSun() {
      const r = sun.radius, pulse = 1 + 0.05 * Math.sin(game.ticks * 0.04);
      let g = ctx.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 3.2 * pulse);
      g.addColorStop(0, rgba(sun.color, 0.45));
      g.addColorStop(0.35, rgba(sun.color, 0.15));
      g.addColorStop(1, rgba(sun.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 3.2 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,82,82,0.25)'; ctx.lineWidth = 1 / camera.scale;
      ctx.setLineDash([5 / camera.scale, 5 / camera.scale]);
      ctx.beginPath(); ctx.arc(0, 0, sun.heatRadius, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, sun.color); g.addColorStop(1, shade(sun.color, 0.6));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    }

    function drawPlanet(p) {
      const ang = Math.atan2(sun.y - p.y, sun.x - p.x);
      const r = p.radius;
      let g = ctx.createRadialGradient(p.x, p.y, r * 0.9, p.x, p.y, r * 1.6);
      g.addColorStop(0, rgba(p.color, 0.35)); g.addColorStop(1, rgba(p.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.6, 0, Math.PI * 2); ctx.fill();
      g = ctx.createRadialGradient(p.x + Math.cos(ang) * r * 0.5, p.y + Math.sin(ang) * r * 0.5, r * 0.1, p.x, p.y, r);
      g.addColorStop(0, shade(p.color, 1.5)); g.addColorStop(0.6, p.color); g.addColorStop(1, shade(p.color, 0.3));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      if (p.soi < p.distance * 0.9) {   // the influence ring only helps when it is smaller than the planet's own orbit
        ctx.strokeStyle = rgba(p.color, 0.12); ctx.lineWidth = 1 / camera.scale;
        ctx.setLineDash([6 / camera.scale, 6 / camera.scale]);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.soi, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = `${12 / camera.scale}px SpaceFont, Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(p.name.toUpperCase(), p.x, p.y + r * 1.6 + 4 / camera.scale);
    }

    function drawAsteroids() {
      for (const a of asteroids) {
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
        ctx.beginPath();
        a.shape.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
        ctx.closePath();
        ctx.fillStyle = '#6b7280'; ctx.fill();
        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 0.5; ctx.stroke();
        ctx.restore();
      }
    }

    function drawCollectibles() {
      const t = game.ticks;
      for (const o of ores) {
        const tw = 0.7 + 0.3 * Math.sin(t * 0.1 + o.phase);
        ctx.fillStyle = `rgba(250,204,21,${0.25 * tw})`;
        ctx.beginPath(); ctx.arc(o.x, o.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#facc15';
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(t * 0.05 + o.phase); ctx.fillRect(-1.2, -1.2, 2.4, 2.4); ctx.restore();
      }
      for (const f of fuels) {
        ctx.fillStyle = 'rgba(74,222,128,0.25)';
        ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4ade80';
        ctx.beginPath(); ctx.arc(f.x, f.y, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#bbf7d0'; ctx.lineWidth = 0.4;
        ctx.beginPath(); ctx.arc(f.x, f.y, 2.1, 0, Math.PI * 2); ctx.stroke();
      }
    }

    function drawTrail() {
      if (trail.length < 4) return;
      ctx.save();
      if (trailFrame) ctx.translate(trailFrame.x, trailFrame.y);   // the trail moves with the body it was flown around
      ctx.lineWidth = 1 / camera.scale;
      const n = trail.length / 2;
      for (let i = 2; i < trail.length; i += 2) {
        ctx.strokeStyle = `rgba(255,255,255,${0.35 * (i / 2) / n})`;
        ctx.beginPath(); ctx.moveTo(trail[i - 2], trail[i - 1]); ctx.lineTo(trail[i], trail[i + 1]); ctx.stroke();
      }
      ctx.restore();
    }

    function drawPrediction() {
      const pts = prediction.pts;
      if (pts.length < 4 || rocket.dead) return;
      ctx.save();
      if (prediction.frame) ctx.translate(prediction.frame.x, prediction.frame.y);
      ctx.lineWidth = 1.2 / camera.scale;
      ctx.setLineDash([4 / camera.scale, 4 / camera.scale]);
      ctx.strokeStyle = prediction.hit ? 'rgba(255,82,82,0.75)' : 'rgba(79,195,247,0.55)';
      ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
      ctx.stroke();
      ctx.setLineDash([]);
      if (prediction.hit) {
        const h = prediction.hit, s = 4 / camera.scale;
        ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1.5 / camera.scale;
        ctx.beginPath(); ctx.moveTo(h.x - s, h.y - s); ctx.lineTo(h.x + s, h.y + s); ctx.moveTo(h.x + s, h.y - s); ctx.lineTo(h.x - s, h.y + s); ctx.stroke();
      }
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        const k = p.life / p.maxLife;
        ctx.globalAlpha = k; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * k), 0, Math.PI * 2); ctx.fill();
      }
      for (const r of rings) {
        const k = r.life / r.maxLife;
        ctx.globalAlpha = k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 / camera.scale;
        ctx.beginPath(); ctx.arc(r.x, r.y, (1 - k) * 30, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // Rocket in local units, nose pointing +x.
    function drawRocketShape(thrusting, boosting, flat) {
      ctx.beginPath(); ctx.moveTo(4.5, 0); ctx.lineTo(-2.5, -2.2); ctx.lineTo(-2.5, 2.2); ctx.closePath();
      ctx.fillStyle = flat ? 'white' : '#e5e7eb'; ctx.fill();
      if (!flat) {
        ctx.beginPath(); ctx.moveTo(4.5, 0); ctx.lineTo(1.5, -0.95); ctx.lineTo(1.5, 0.95); ctx.closePath();
        ctx.fillStyle = '#4fc3f7'; ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.moveTo(-2.5, -2.2); ctx.lineTo(-3.6, -3.3); ctx.lineTo(-1.4, -1.9); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.5, 2.2); ctx.lineTo(-3.6, 3.3); ctx.lineTo(-1.4, 1.9); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.arc(0.5, 0, 0.7, 0, Math.PI * 2); ctx.fill();
      }
      if (boosting) {
        const len = 8 + Math.random() * 3;
        ctx.beginPath(); ctx.moveTo(-2.5, -1.8); ctx.lineTo(-len, 0); ctx.lineTo(-2.5, 1.8); ctx.closePath();
        ctx.fillStyle = 'rgba(96,165,250,0.9)'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.5, -0.9); ctx.lineTo(-len * 0.6, 0); ctx.lineTo(-2.5, 0.9); ctx.closePath();
        ctx.fillStyle = 'white'; ctx.fill();
      } else if (thrusting) {
        const len = 5 + Math.random() * 2;
        ctx.beginPath(); ctx.moveTo(-2.5, -1.2); ctx.lineTo(-len, 0); ctx.lineTo(-2.5, 1.2); ctx.closePath();
        ctx.fillStyle = '#fb923c'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.5, -0.6); ctx.lineTo(-len * 0.6, 0); ctx.lineTo(-2.5, 0.6); ctx.closePath();
        ctx.fillStyle = '#fde68a'; ctx.fill();
      }
    }

    function drawRocket() {
      if (rocket.dead) return;
      if (rocket.invuln > 0 && rocket.invuln % 16 < 8) ctx.globalAlpha = 0.4;
      ctx.save();
      ctx.translate(rocket.x, rocket.y);
      ctx.rotate(rocket.rotation - Math.PI / 2);
      drawRocketShape(rocket.thrusting, rocket.boosting, false);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // ---------- Rendering: screen space ----------
    function drawPopups() {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const p of popups) {
        const s = worldToScreen(p.x, p.y);
        ctx.globalAlpha = clamp(p.life / 30, 0, 1);
        ctx.fillStyle = p.color;
        ctx.font = `bold ${p.size}px SpaceFont, Arial`;
        ctx.fillText(p.text, s.x, s.y - 14 - (p.maxLife - p.life) * 0.4);
      }
      ctx.globalAlpha = 1;
    }

    function drawTargetArrow() {
      const target = findTarget();
      if (!target || rocket.dead) return;
      const s = worldToScreen(target.x, target.y);
      const margin = 48;
      if (s.x > margin && s.x < W - margin && s.y > margin && s.y < H - margin) return;
      const cx = W / 2, cy = H / 2, dx = s.x - cx, dy = s.y - cy;
      const ang = Math.atan2(dy, dx);
      const k = Math.min((W / 2 - margin) / Math.max(Math.abs(dx), 1e-6), (H / 2 - margin) / Math.max(Math.abs(dy), 1e-6));
      const ax = cx + dx * k, ay = cy + dy * k;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
      ctx.fillStyle = target.color;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-4, 0); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
      ctx.restore();
      const dist = Math.hypot(target.x - rocket.x, target.y - rocket.y);
      ctx.fillStyle = 'white'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${target.name.toUpperCase()} ${Math.round(dist)}`, ax - Math.cos(ang) * 40, ay - Math.sin(ang) * 40);
    }

    // ---------- Console: on-screen buttons with their hotkeys ----------
    const buttons = [
      { id: 'boost', label: 'BOOSTER', key: 'SPACE', color: '#4ade80',
        press() { ui.boost = true; }, release() { ui.boost = false; },
        active: () => rocket.boosting, enabled: () => rocket.fuel > 0 },
      { id: 'nav', label: 'NAV AI', key: 'N', color: '#4fc3f7',
        press() { toggleNav(); }, release() {},
        active: () => game.nav && rocket.battery > 0, enabled: () => game.nav || rocket.battery >= NAV_MIN_CHARGE },
      { id: 'charge', label: 'RECHARGE', key: 'R', color: '#facc15',
        press() { ui.charge = true; }, release() { ui.charge = false; },
        active: () => rocket.charging, enabled: () => rocket.fuel > 0 && rocket.battery < BATTERY_MAX },
    ];
    for (const b of buttons) Object.assign(b, { x: 0, y: 0, w: 0, h: 0, visible: false });

      const total = show.length * BUTTON_W + (show.length - 1) * BUTTON_GAP;
      let x = Math.round(W / 2 - total / 2);
      for (const b of buttons) b.visible = false;
      for (const b of show) { b.x = x; b.y = H - 16 - BUTTON_H; b.w = BUTTON_W; b.h = BUTTON_H; b.visible = true; x += BUTTON_W + BUTTON_GAP; }
    }
    function hit(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
    function buttonAt(x, y) {
      for (const b of buttons) if (b.visible && hit(b, x, y)) return b;
      return null;
    }
    const introButton = { id: 'launch', label: 'LAUNCH', key: 'SPACE', color: '#4fc3f7', x: 0, y: 0, w: 190, h: 48,

      { id: 'go', label: 'LAUNCH', key: 'ENTER', color: '#4fc3f7', x: 0, y: 0, w: 190, h: 48,
        press() { launchSelected(); }, release() {}, active: () => false, enabled: () => !map.travel },
      { id: 'back', label: 'BACK', key: 'ESC', color: '#cbd5e1', x: 0, y: 0, w: 130, h: 40,
        press() { leaveMap(); }, release() {}, active: () => false, enabled: () => true },

    function drawHUD() {

    function drawMinimap() {
      const size = 150, pad = 16, cx = W - pad - size / 2, cy = H - pad - size / 2;
      let range = 0;
      for (const p of planets) range = Math.max(range, p.distance);
      for (const A of levelBelts(game.level)) range = Math.max(range, A.outer);
      range = Math.max(range, Math.hypot(rocket.x, rocket.y)) * 1.12;
      const k = (size / 2) / range;
      ctx.save();

    function drawWelcome() {

    function drawMap() {
      const t = game.ticks;
      drawStars(t * 0.15, 0, t);
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#4fc3f7'; ctx.font = 'bold 34px SpaceFont, Arial';
      ctx.fillText('STAR MAP', W / 2, 44);
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '14px monospace';
      ctx.fillText(`${Math.min(cleared, LEVELS.length)} OF ${LEVELS.length} SYSTEMS CLEARED`, W / 2, 72);
      if (game.inRun) {
        ctx.textAlign = 'right'; ctx.fillStyle = 'white'; ctx.font = 'bold 22px monospace';
        ctx.fillText(`${game.score}`, W - 16, 24);
        ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText(`LIVES ${game.lives}   ·   FUEL ${Math.floor(rocket.fuel)}`, W - 16, 48);
      }
      // the route
      ctx.setLineDash([4, 6]); ctx.lineWidth = 1.5;
      for (let i = 0; i + 1 < LEVELS.length; i++) {
        const a = mapStarPos(i), b = mapStarPos(i + 1);
        ctx.strokeStyle = i < maxLevelReached ? 'rgba(79,195,247,0.55)' : 'rgba(255,255,255,0.12)';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.setLineDash([]);
      // the systems
      ctx.textAlign = 'center';
      for (let i = 0; i < LEVELS.length; i++) {
        const L = LEVELS[i], st = mapStarStyle(i), p = mapStarPos(i);
        const unlocked = i <= maxLevelReached, done = i < cleared;
        const r = 5 + st.radius / 8, color = unlocked ? st.color : '#475569';
        if (unlocked) {
          const g = ctx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, r * 3.5);
          g.addColorStop(0, rgba(st.color, 0.5)); g.addColorStop(1, rgba(st.color, 0));
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 3.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = unlocked ? 1 : 0.5;
        const g2 = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.1, p.x, p.y, r);
        g2.addColorStop(0, unlocked ? '#ffffff' : '#94a3b8'); g2.addColorStop(0.6, color); g2.addColorStop(1, shade(color, 0.6));
        ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
        if (done) { ctx.strokeStyle = 'rgba(74,222,128,0.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2); ctx.stroke(); }
        if (i === map.selected && !map.travel) {
          ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(p.x, p.y, r + 10 + 2 * Math.sin(t * 0.1), 0, Math.PI * 2); ctx.stroke();
        } else if (i === map.hover) {
          ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(p.x, p.y, r + 10, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(`${i + 1}`, p.x, p.y - r - 12);
        ctx.font = unlocked ? 'bold 11px SpaceFont, Arial' : '11px SpaceFont, Arial';
        ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)';
        ctx.fillText(L.name, p.x, p.y + r + 14);
        ctx.globalAlpha = 1;
      }
      // the rocket, parked at a system or flying between two
      let rx, ry, ang, thrusting = false;
      if (map.travel) {
        const k = smoothstep(map.travel.t), p = travelPos(map.travel, k), q = travelPos(map.travel, Math.min(1, k + 0.01));
        rx = p.x; ry = p.y; ang = Math.atan2(q.y - p.y, q.x - p.x); thrusting = true;
      } else {
        const p = mapStarPos(map.rocketAt), nxt = mapStarPos(Math.min(map.rocketAt + 1, LEVELS.length - 1));
        rx = p.x; ry = p.y - 26 + 2 * Math.sin(t * 0.05); ang = Math.atan2(nxt.y - p.y, nxt.x - p.x);
      }
      drawParticles();
      ctx.save(); ctx.translate(rx, ry); ctx.rotate(ang); ctx.scale(2.5, 2.5); drawRocketShape(thrusting, false, false); ctx.restore();
      // the chosen system
      const sel = LEVELS[map.selected], sst = mapStarStyle(map.selected);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = sst.color; ctx.font = 'bold 26px SpaceFont, Arial';
      ctx.fillText(map.travel ? `EN ROUTE TO ${LEVELS[map.travel.to].name}` : sel.name, W / 2, H - 172);
      ctx.fillStyle = 'white'; ctx.font = '15px monospace';
      ctx.fillText(sel.brief, W / 2, H - 144);
      const status = map.selected < cleared ? 'CLEARED' : map.selected === maxLevelReached ? 'NEXT' : 'UNLOCKED';
      const tags = [status, `${sel.planets.length} PLANET${sel.planets.length > 1 ? 'S' : ''}`, `TIME ${formatTime(sel.time)}`];
      if (levelBelts(sel).length) tags.push('ASTEROIDS');
      if (sel.battery) tags.push('BATTERY');
      if (sel.noNav) tags.push('NO NAV AI');
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '13px monospace';
      ctx.fillText(tags.join('   ·   '), W / 2, H - 120);
      // buttons
      const go = mapButtons[0], back = mapButtons[1];
      go.x = W / 2 - go.w / 2; go.y = H - 84;
      back.x = 16; back.y = H - 56; back.label = game.inRun ? 'QUIT RUN' : 'BACK';
      drawButton(go); drawButton(back);
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('ARROWS  choose a system     ENTER  launch     click a star to select it, click again to go', W / 2, H - 18);
      ctx.restore();
    }

    // ---------- Main loop ----------
    function tick() {
      game.ticks++; game.stateTimer++;
      updateParticles(); updatePopups();
      if (camera.shake > 0) { camera.shake *= 0.88; if (camera.shake < 0.3) camera.shake = 0; }
      const S = game.state;
      if (S === GAME_STATE.WELCOME) return;
      if (S === GAME_STATE.MAP) { updateTravel(); return; }
      if (S === GAME_STATE.LEVEL_INTRO) {   // the world turns while the player reads; nothing launches until they do
        stepWorld(); computePrediction(); updateCamera();
        return;
      }
      if (S === GAME_STATE.PLAYING) {
        handleInput(); updatePower();
        stepWorld();
        if (!rocket.dead) { checkCollisions(); collectItems(); }
        if (game.state === GAME_STATE.PLAYING) { updateTimer(); updateCombo(); handleRespawn(); }
        computePrediction(); updateCamera(); syncEngineAudio();
        return;
      }
      stepWorld(); computePrediction(); updateCamera();   // level complete / game over / win: the world keeps drifting
    }

    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
      if (game.state === GAME_STATE.MAP) { drawMap(); return; }
      if (game.state === GAME_STATE.WELCOME || !game.level) { drawWelcome(); return; }

      drawStars(-camera.offsetX / camera.scale, -camera.offsetY / camera.scale, game.ticks);
      const sx = camera.shake ? (Math.random() - 0.5) * camera.shake : 0;
      const sy = camera.shake ? (Math.random() - 0.5) * camera.shake : 0;
      ctx.setTransform(camera.scale, 0, 0, camera.scale, W / 2 + camera.offsetX + sx, H / 2 + camera.offsetY + sy);
      drawOrbitRings();
      drawSun();
      drawAsteroids();
      for (const p of planets) drawPlanet(p);
      drawCollectibles();
      drawTrail();
      drawPrediction();
      drawParticles();
      drawRocket();

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawPopups();
      drawTargetArrow();
      drawHUD();
      drawMinimap();
      if (game.state === GAME_STATE.LEVEL_INTRO) drawLevelIntro();
      else if (game.state === GAME_STATE.LEVEL_COMPLETE) drawLevelComplete();
      else if (game.state === GAME_STATE.GAME_OVER) drawGameOver();
      else if (game.state === GAME_STATE.WIN) drawWin();
    }

    let lastTime = 0, acc = 0;
    function loop(now) {
      if (!lastTime) lastTime = now;
      acc += Math.min(250, now - lastTime);
      lastTime = now;
      while (acc >= TICK_MS) { tick(); acc -= TICK_MS; }
      render();
      requestAnimationFrame(loop);
    }

    makeStars();
    addListeners();
    const devLevel = parseInt(new URLSearchParams(location.search).get('level'));
    if (devLevel >= 1 && devLevel <= LEVELS.length) { newGame(devLevel - 1); beginPlay(); }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
