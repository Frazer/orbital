<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Orbital</title>
  <!-- platform -->
  <style>
    body { margin: 0; background: #02030a; overflow: hidden; }
    canvas { display: block; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    @font-face {
      font-family: 'SpaceFont';
      src: url('https://fonts.gstatic.com/s/quantico/v15/rax5HiSdp9cPL3km3mujm9_1kw.woff2') format('woff2');
      font-display: swap;
    }
    .start-button {
      position: absolute;
      top: 66%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      background: rgba(79, 195, 247, 0.2);
      color: #4fc3f7;
      border: 2px solid #4fc3f7;
      border-radius: 30px;
      font-size: 24px;
      font-family: 'SpaceFont', Arial, sans-serif;
      cursor: pointer;
      transition: background 0.3s;
      animation: pulse 1.5s infinite;
      outline: none;
      z-index: 100;
      display: none; /* shown by the welcome screen */
    }
    .start-button:hover {
      background: rgba(79, 195, 247, 0.5);
      transform: translate(-50%, -50%) scale(1.05);
    }
    .join-code {
      position: absolute; left: 50%; transform: translate(-50%, -50%); width: 220px; padding: 8px 0;
      font-family: monospace; font-size: 40px; text-align: center; letter-spacing: 12px; text-transform: uppercase;
      color: #fff; background: rgba(255,255,255,0.08); border: 2px solid #4fc3f7; border-radius: 10px; outline: none; z-index: 100; display: none;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(79, 195, 247, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0); }
    }
  </style>
</head>

      { color: '#a78bfa', pal: { body: '#ddd6fe', nose: '#a78bfa', fin: '#5b21b6' } },

    let maxLevelReached = parseInt(localStorage.getItem('orbitalMaxLevel')) || 0;   // index of the furthest level unlocked

    // ---------- Helpers ----------

    // ---------- World building ----------
    function makeStars() {
      stars = [];

        stars.push({ x: Math.random() * W, y: Math.random() * H, size: Math.random() * 1.6 + 0.4,
                     par: 0.05 + Math.random() * 0.25, phase: Math.random() * Math.PI * 2,
                     tint: i % 5 === 0 ? '#b0c4de' : (i % 7 === 0 ? '#ffe4c4' : '#ffffff') });
      }
    }

    const allOres = [], allFuels = [];   // every item the level started with, by id; `ores` and `fuels` hold the ones still out there
    function buildLevel(def) {
      const rnd = seededRandom(game.seed);
      planets.length = 0; ores.length = 0; fuels.length = 0; asteroids.length = 0; allOres.length = 0; allFuels.length = 0;
      particles.length = 0; rings.length = 0; popups.length = 0; rivals.length = 0; rival = null;
      for (const P of players) { P.trail.length = 0; P.trailFrame = null; }

          rivalHome: d.rivalHome === true ? 0 : typeof d.rivalHome === 'number' ? d.rivalHome : -1,   // which rival starts here
          x: Math.cos(a) * d.distance, y: Math.sin(a) * d.distance,

    // Put the rocket into a circular orbit around the home planet, facing prograde; the second player starts on the far side.

    // ---------- The rivals ----------
    // On race levels other ships mine the same belts. They obey the same physics and controls as the player's

    // single one in `rival`); each entry sets a handicap: thrust, turn and boost multipliers, a pause after every

    const RIVAL_RESPAWN = 240;            // ticks out of action after a crash
    const RIVAL_BUDGET = 1200;            // ticks it works one world before moving on even if ore remains

            const dx = Math.cos(ang) * a.dist - r.x, dy = Math.sin(ang) * a.dist - r.y, rr = a.radius + 1.5;
            if (dx * dx + dy * dy < rr * rr) { hit = true; break; }
          }
        }
        if (hit) { prediction.hit = { x: r.x - fx, y: r.y - fy }; pts.push(r.x - fx, r.y - fy); break; }
      }
    }

    // ---------- Effects ----------
    function spawnParticle(x, y, vx, vy, life, size, color) {
      particles.push({ x, y, vx, vy, life, maxLife: life, size, color });
    }
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vx *= 0.98; p.vy *= 0.98;
        if (--p.life <= 0) particles.splice(i, 1);
      }
      for (let i = rings.length - 1; i >= 0; i--) if (--rings[i].life <= 0) rings.splice(i, 1);
    }
    function exhaust(boost, ship = rocket) {
      const dx = Math.sin(ship.rotation), dy = -Math.cos(ship.rotation);
      const n = boost ? 3 : 2;
      for (let i = 0; i < n; i++) {
        const side = (Math.random() - 0.5) * 1.2;
        const speed = (boost ? 1.3 : 0.7) + Math.random() * 0.4;
        spawnParticle(ship.x - dx * 2.5 - dy * side, ship.y - dy * 2.5 + dx * side,
                      ship.vx * TIME_SCALE - dx * speed + (Math.random() - 0.5) * 0.2,
                      ship.vy * TIME_SCALE - dy * speed + (Math.random() - 0.5) * 0.2,
                      20 + Math.random() * 20, boost ? 1.4 : 1,
                      boost ? (Math.random() < 0.5 ? '#60a5fa' : '#e0f2fe') : (Math.random() < 0.5 ? '#fb923c' : '#fde68a'));
      }
    }
    function explode(x, y, vx, vy) {
      netEvent(['x', r2(x), r2(y), r2(vx), r2(vy)]);
      const colors = ['#ffffff', '#fde68a', '#fb923c', '#ef4444'];
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * Math.PI * 2, s = 0.3 + Math.random() * 2.5;
        spawnParticle(x, y, vx * TIME_SCALE + Math.cos(a) * s, vy * TIME_SCALE + Math.sin(a) * s,
                      30 + Math.random() * 40, 0.8 + Math.random() * 1.5, colors[i % 4]);
      }
      rings.push({ x, y, life: 30, maxLife: 30 });
    }
    function sparkle(x, y, color) {
      netEvent(['s', r2(x), r2(y), color]);
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2, s = 0.3 + Math.random() * 0.8;
        spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, 20 + Math.random() * 12, 0.6, color);
      }
    }
    function popup(x, y, text, color, size = 14) {
      netEvent(['p', r2(x), r2(y), text, color, size]);
      popups.push({ x, y, text, color, size, life: 90, maxLife: 90 });
    }
    function updatePopups() {
      for (let i = popups.length - 1; i >= 0; i--) if (--popups[i].life <= 0) popups.splice(i, 1);
    }

    // ---------- Camera ----------
    // Zoom in near planets and out in deep space; follow in world space so zooming never drags the view.
    function updateCamera() {
      const d = Math.sqrt(closestDistanceSQ);
      const auto = clamp(260 / Math.max(d, 1), FAR_ZOOM, game.level.nearZoom || NEAR_ZOOM);   // compact systems cap the zoom so they stay in view
      const target = clamp(auto * camera.zoomMul, 0.25, 8);
      camera.scale += (target - camera.scale) * 0.05;

      if (camera.follow) {
        const baseThreshold = 4000;   // follow the planet when the rocket is this close (squared world units)
        const veryClose = 500;        // snap exactly onto the target below this (squared world units)
        let obj, distSQ;
        if (closestPlanet && closestDistanceSQ <= baseThreshold && !rocket.dead) {
          obj = closestPlanet; distSQ = closestDistanceSQ;
        } else {
          obj = rocket;
          const dx = rocket.x - camera.focusX, dy = rocket.y - camera.focusY;
          distSQ = dx * dx + dy * dy;
        }
        if (distSQ <= veryClose) {
          camera.focusX = obj.x; camera.focusY = obj.y;
        } else {
          const ratio = Math.min(1, (distSQ - veryClose) / (baseThreshold - veryClose));
          const smooth = CAMERA_SMOOTHNESS + (1 - CAMERA_SMOOTHNESS) * (1 - ratio);
          camera.focusX += (obj.x - camera.focusX) * smooth;
          camera.focusY += (obj.y - camera.focusY) * smooth;
        }
      }
      camera.offsetX = -camera.focusX * camera.scale;
      camera.offsetY = -camera.focusY * camera.scale;
    }

    // ---------- Game flow ----------
    function newGame(levelIdx) {
      game.inRun = true; game.score = 0;
      for (const P of players) { P.lives = START_LIVES; P.ship.fuel = START_FUEL; }
      startLevel(levelIdx);
    }

    function startLevel(idx, seed) {   // idx -1 is the custom system; the seed lays out the ore and rocks (an online guest gets the host's)
      const L = idx >= 0 ? LEVELS[idx] : custom.level;
      game.levelIndex = idx; game.level = L; game.seed = seed || Math.floor(Math.random() * 1e9) + 1;
      game.ore = 0; game.timeLeft = L.time; game.lastSec = -1; game.hot = false;
      game.ticks = 0; game.stateTimer = 0; pressedButton = null;
      buildLevel(L);
      setupRivals(L);
      game.raceTotal = ores.length;
      const home = homePlanet();
      for (const P of players) {
        usePlayer(P);
        P.ore = 0; P.combo = 0; P.comboTimer = 0; P.deathReason = ''; P.out = false; P.nav = true; ui.boost = false; ui.charge = false;
        spawnRocket();
        rocket.fuel = Math.max(rocket.fuel, L.startFuel || START_FUEL);
        camera.follow = true; camera.zoomMul = 1; camera.scale = L.nearZoom || NEAR_ZOOM; camera.shake = 0;
        camera.focusX = home.x; camera.focusY = home.y;
        camera.offsetX = -home.x * camera.scale; camera.offsetY = -home.y * camera.scale;
        computePrediction();
      }
      usePlayer(players[0]);
      game.state = GAME_STATE.LEVEL_INTRO;
      startButton.style.display = 'none';
      OrbitalAudio.setIntensity(0);
      OrbitalAudio.startMusic(L.theme);
      netSendStart();
    }

    function beginPlay() {
      game.state = GAME_STATE.PLAYING; game.stateTimer = 0;
      keys[' '] = false;
      cgPlay(true);
      OrbitalAudio.sfx.select();
      if (isHost()) netSend({ k: 'play', t: game.ticks });
    }

    function goalMet() {   // the players share ore quotas and visits; in a race each ship's own tally counts
      const g = game.level.goal;
      if (g.type === 'ore') return game.ore >= g.count;
      if (g.type === 'race') return me.ore * 2 > game.raceTotal;   // more than half: nobody can catch up
      return planets.every(p => p.collected > 0);
    }
    function goalProgress() {
      const g = game.level.goal;
      if (g.type === 'ore') return game.ore / g.count;
      if (g.type === 'race') return me.ore / (Math.floor(game.raceTotal / 2) + 1);
      return planets.filter(p => p.collected > 0).length / planets.length;
    }
    function goalText() {
      const g = game.level.goal;
      if (g.type === 'ore') return `ORE  ${game.ore} / ${g.count}` + (players.length > 1 ? `   ·   ${me.name}  ${me.ore}` : '');
      if (g.type === 'race') return `YOU  ${me.ore}     ${rivals.map(r => `${r.name}  ${r.ore}`).join('     ')}     ·   ${ores.length} LEFT`;
      return planets.map(p => (p.collected > 0 ? '✓ ' : '○ ') + p.name.toUpperCase()).join('   ');
    }
    // Race levels end as soon as the outcome is settled. True when this call ended the level.
    function leadingRival() { let best = null; for (const r of rivals) if (!best || r.ore > best.ore) best = r; return best; }
    function raceCheck() {
      if (game.level.goal.type !== 'race' || game.state !== GAME_STATE.PLAYING) return false;
      const total = game.raceTotal, lead = leadingRival();
      for (const P of players) if (P.ore * 2 > total) { completeLevel(P); return true; }
      if (lead && lead.ore * 2 > total) { endGame(`Out-mined by ${lead.name}`); return true; }
      if (ores.length === 0) { raceFinish(); return true; }
      return false;
    }
    function raceFinish() {   // no ore left, or time up: whoever holds most wins; a tie goes to the rival, and between players it is a draw
      const lead = leadingRival(), order = players.slice().sort((a, b) => b.ore - a.ore), top = order[0];
      if (lead && lead.ore >= top.ore) endGame(lead.ore === top.ore ? `Tied with ${lead.name}` : `Out-mined by ${lead.name}`);
      else completeLevel(order.length > 1 && order[1].ore === top.ore ? null : top);
    }
    function oresLeft(p) { let n = 0; for (const o of ores) if (o.planet === p) n++; return n; }
    function findTarget() {
      const g = game.level.goal;
      let best = null, bestD = Infinity;
      for (const p of planets) {
        const wanted = g.type === 'visit' ? p.collected === 0 : oresLeft(p) > 0;
        if (!wanted) continue;
        const dx = p.x - rocket.x, dy = p.y - rocket.y, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = p; }
      }
      return best;
    }

    function completeLevel(winner) {   // winner: the player who won a race (null: a draw, or not a race)
      const timeBonus = Math.floor(game.timeLeft) * TIME_BONUS_PER_SECOND;
      game.stats = { ore: game.ore, ores: players.map(p => ({ name: p.name, ore: p.ore })), winner: winner ? winner.name : null,
                     timeLeft: game.timeLeft, timeBonus, levelBonus: LEVEL_BONUS, rivalOres: rivals.map(r => ({ name: r.name, ore: r.ore })) };
      game.score += timeBonus + LEVEL_BONUS;
      for (const P of players) P.lives = Math.min(MAX_LIVES, P.lives + 1);
      updateHighScore();
      if (game.levelIndex >= 0) {   // custom systems do not count towards the campaign
        maxLevelReached = Math.max(maxLevelReached, Math.min(game.levelIndex + 1, LEVELS.length - 1));
        localStorage.setItem('orbitalMaxLevel', maxLevelReached);
        cleared = Math.max(cleared, game.levelIndex + 1);
        localStorage.setItem('orbitalCleared', cleared);
      }
      game.state = GAME_STATE.LEVEL_COMPLETE; game.stateTimer = 0;
      cgPlay(false);
      for (const P of players) { P.ship.thrusting = false; P.ship.boosting = false; }
      for (let i = 0; i < 6; i++) sparkle(rocket.x + (Math.random() - 0.5) * 20, rocket.y + (Math.random() - 0.5) * 20, ['#facc15', '#4ade80', '#4fc3f7'][i % 3]);
      OrbitalAudio.stopMusic();
      OrbitalAudio.sfx.levelComplete();
      syncEngineAudio();
    }

    function nextLevel() {
      if (game.levelIndex < 0) openCustom();   // back to the builder, to tweak the system or fly it again
      else if (game.levelIndex + 1 < LEVELS.length) openMap(game.levelIndex + 1, game.levelIndex);   // fly on to the next system
      else winGame();
    }

    function winGame() {
      updateHighScore(); game.inRun = false;
      game.state = GAME_STATE.WIN; game.stateTimer = 0;
      cgPlay(false); cg(g => g.happytime());
      OrbitalAudio.sfx.win();
    }

    function endGame(reason) {
      updateHighScore(); game.inRun = false;
      game.gameOverReason = reason;
      game.state = GAME_STATE.GAME_OVER; game.stateTimer = 0;
      cgPlay(false);
      for (const P of players) { P.ship.thrusting = false; P.ship.boosting = false; }
      OrbitalAudio.stopMusic();
      OrbitalAudio.sfx.gameOver();
      OrbitalAudio.setIntensity(0);
      syncEngineAudio();
    }

    function toWelcome() {
      cgPlay(false);
      game.state = GAME_STATE.WELCOME; game.stateTimer = 0; game.level = null; game.inRun = false;
      map.travel = null;
      OrbitalAudio.startMusic('ambient');
    }

    // ---------- Star map ----------
    // Every level is a star system. The map shows them all, lets the player pick any unlocked one,
    // and animates the flight from a finished system to the next.
    function openMap(select, travelFrom = -1) {
      cgPlay(false);
      game.state = GAME_STATE.MAP; game.stateTimer = 0; game.level = null;
      map.selected = select; map.rocketAt = travelFrom >= 0 ? travelFrom : select; map.hover = -1;
      map.travel = travelFrom >= 0 ? { from: travelFrom, to: select, t: 0, duration: 180 } : null;
      particles.length = 0; rings.length = 0; popups.length = 0;
      hoverButton = null; pressedButton = null;
      startButton.style.display = 'none';
      OrbitalAudio.startMusic('ambient');
      if (map.travel) OrbitalAudio.sfx.warp();
      netSendMap();
    }
    const MAP_PER_PAGE = 24;   // systems per page of the star map: a sector
    function mapPage(i) { return Math.floor(i / MAP_PER_PAGE); }
    function mapPages() { return Math.ceil(LEVELS.length / MAP_PER_PAGE); }
    function mapShownPage() {   // the sector on screen: the one being flown into, an explicit choice, or the chosen system's
      const T = map.travel;
      if (T && mapPage(T.from) !== mapPage(T.to)) return smoothstep(T.t) < 0.5 ? mapPage(T.from) : mapPage(T.to);
      return map.page === null ? mapPage(map.selected) : map.page;
    }
    function mapFlip(delta) {   // show another sector, choosing its furthest unlocked system if it has one
      if (map.travel) return;
      const page = clamp(mapShownPage() + delta, 0, mapPages() - 1);
      if (page === mapShownPage()) return;
      const first = page * MAP_PER_PAGE, last = Math.min(first + MAP_PER_PAGE, LEVELS.length) - 1;
      if (first <= unlockedUpTo()) { map.selected = Math.min(last, unlockedUpTo()); map.page = null; }
      else map.page = page;
      OrbitalAudio.sfx.select();
      netSendMap();
    }
    function mapStarPos(i) {   // the systems of a sector snake across the screen in two or three rows
      const first = mapPage(i) * MAP_PER_PAGE, n = Math.min(MAP_PER_PAGE, LEVELS.length - first), rows = n > 14 ? 3 : 2, cols = Math.ceil(n / rows);
      const j = i - first, row = Math.floor(j / cols), k = j - row * cols;
      const c = row % 2 === 0 ? k : cols - 1 - k;
      const short = H < 520, rowY = rows === 3 ? (short ? [0.22, 0.36, 0.50] : [0.28, 0.47, 0.66]) : (short ? [0.30, 0.50] : [0.40, 0.64]);
      return { x: W * (0.12 + 0.76 * c / Math.max(1, cols - 1)), y: H * rowY[row] + (short ? 6 : 14) * Math.sin(i * 2.1) };
    }
    function mapStarStyle(i) { return Object.assign({}, DEFAULT_STAR, LEVELS[i].star || {}); }
    function travelPos(T, k) {   // a gentle arc between two systems; between sectors it leaves at the right and comes in from the left
      let A = mapStarPos(T.from), B = mapStarPos(T.to);
      if (mapPage(T.from) !== mapPage(T.to)) {
        if (k < 0.5) { B = { x: W + 60, y: A.y }; k *= 2; } else { A = { x: -60, y: B.y }; k = (k - 0.5) * 2; }
      }
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      const bulge = len * 0.18 * Math.sin(Math.PI * k);
      return { x: A.x + dx * k - dy / len * bulge, y: A.y + dy * k + dx / len * bulge };
    }
    function mapStarAt(x, y) {
      const page = mapShownPage();
      for (let i = page * MAP_PER_PAGE; i <= unlockedUpTo() && i < LEVELS.length && mapPage(i) === page; i++) {
        const p = mapStarPos(i);
        if (Math.hypot(p.x - x, p.y - y) < 24) return i;
      }
      return -1;
    }
    function selectStar(i) {
      if (map.travel || i < 0 || i > unlockedUpTo() || i >= LEVELS.length || i === map.selected) return;
      map.selected = i; map.page = null;
      OrbitalAudio.sfx.select();
      netSendMap();
    }
    function launchSelected() {
      if (map.travel) return;
      if (isGuest()) return;
      if (game.inRun) startLevel(map.selected); else newGame(map.selected);
    }
    function leaveMap() {
      if (online()) { netLeave(); return; }
      if (game.inRun) updateHighScore();
      toWelcome();
    }
    function updateTravel() {
      const T = map.travel;
      if (!T) return;
      T.t = Math.min(1, T.t + 1 / T.duration);
      const k = smoothstep(T.t), p = travelPos(T, k), q = travelPos(T, Math.min(1, k + 0.01));
      const ang = Math.atan2(q.y - p.y, q.x - p.x);
      for (let i = 0; i < 2; i++) {   // exhaust, in screen pixels
        const spread = (Math.random() - 0.5) * 1.2, speed = 2 + Math.random() * 2;
        spawnParticle(p.x - Math.cos(ang) * 8, p.y - Math.sin(ang) * 8, -Math.cos(ang + spread) * speed, -Math.sin(ang + spread) * speed,
                      25 + Math.random() * 15, 2.5, i ? '#4fc3f7' : '#ffffff');
      }
      if (T.t >= 1) {
        map.rocketAt = T.to; map.selected = T.to; map.travel = null;
        OrbitalAudio.sfx.arrive();
      }
    }

      if (rocket.thrusting) {
        rocket.vx += dx * rocket.thrustPower;
        rocket.vy += dy * rocket.thrustPower;
      }
      if (rocket.boosting) {
        rocket.fuel = Math.max(0, rocket.fuel - 1);
        rocket.vx += dx * rocket.boostPower;
        rocket.vy += dy * rocket.boostPower;
      }
      if (rocket.boosting) exhaust(true);
      else if (rocket.thrusting) exhaust(false);
    }

    // ---------- Battery and the nav AI ----------
    function navActive() {
      if (game.level.noNav) return false;   // some systems have no working nav AI at all
      return !game.level.battery || (me.nav && rocket.battery > 0);
    }
    function solarRate() {
      const d = Math.max(Math.hypot(rocket.x, rocket.y), sun.radius);
      return SOLAR_RATE * sun.luminosity * (SOLAR_DISTANCE / d) ** 2;
    }
    function powerRate() {   // net battery change per second, shown on the gauge
      let r = solarRate();
      if (me.nav) r -= NAV_DRAIN;
      if (rocket.charging) r += CHARGE_RATE;
      return r;
    }
    function toggleNav() {
      if (!game.level.battery || rocket.dead) return;
      if (!me.nav && rocket.battery < NAV_MIN_CHARGE) {
        popup(rocket.x, rocket.y - 8, 'NO POWER', '#ff5252', 12);
        OrbitalAudio.sfx.tick();
        return;
      }
      me.nav = !me.nav;
      popup(rocket.x, rocket.y - 8, me.nav ? 'NAV AI ON' : 'NAV AI OFF', me.nav ? '#4fc3f7' : '#cbd5e1', 12);
      OrbitalAudio.sfx.select();
    }
    function updatePower() {
      if (!game.level.battery || rocket.dead) { rocket.charging = false; return; }
      const dt = 1 / 60;
      rocket.charging = (me.remote ? !!net.input.c : down(me.keys.charge) || ui.charge) && rocket.fuel > 0 && rocket.battery < BATTERY_MAX;
      let b = rocket.battery + solarRate() * dt;
      if (rocket.charging) {
        const add = Math.min(CHARGE_RATE * dt, BATTERY_MAX - b, rocket.fuel / CHARGE_FUEL_COST);
        b += add; rocket.fuel = Math.max(0, rocket.fuel - add * CHARGE_FUEL_COST);
      }
      if (me.nav) {
        b -= NAV_DRAIN * dt;
        if (b <= 0) {
          b = 0; me.nav = false;
          popup(rocket.x, rocket.y - 8, 'NAV AI OFFLINE', '#ff5252', 12);
          OrbitalAudio.sfx.tick();
        }
      }
      rocket.battery = clamp(b, 0, BATTERY_MAX);
    }

    function syncEngineAudio() {
      const playing = game.state === GAME_STATE.PLAYING;
      const bo = playing && players.some(p => !p.ship.dead && p.ship.boosting);
      const th = playing && !bo && players.some(p => !p.ship.dead && p.ship.thrusting);
      if (th !== audioThrust) { audioThrust = th; OrbitalAudio.setThrust(th); }
      if (bo !== audioBoost) { audioBoost = bo; OrbitalAudio.setBoost(bo); }
    }

    function addListeners() {
      window.addEventListener('resize', () => {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        makeStars();
      });
      window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const P of players) P.ui.boost = P.ui.charge = false; pressedButton = null; hoverButton = null; });

      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const c = playerAtX(e.clientX).camera;   // the view under the pointer
        c.zoomMul = clamp(c.zoomMul * Math.exp(-e.deltaY * 0.001), 0.25, 3);
      }, { passive: false });

      // On-screen console buttons take presses before the camera drag does.
      function pressAt(x, y) {
        const S = game.state;
        if (S === GAME_STATE.MAP) {
          const b = mapButtonAt(x, y);
          if (b) { b.press(); return true; }
          const i = mapStarAt(x, y);
          if (i < 0 || map.travel) return false;
          if (i === map.selected) launchSelected(); else selectStar(i);   // a second click on the chosen star launches
          return true;
        }
        if (S === GAME_STATE.CUSTOM) {
          const b = customButtonAt(x, y);
          if (b) b.press();
          return !!b;
        }
        if (S === GAME_STATE.LEVEL_INTRO) {
          if (hit(introButton, x, y) || buttonAt(x, y)) { if (!isGuest()) beginPlay(); return true; }
          if (hit(introBack, x, y)) { introBack.press(); return true; }
          return false;
        }
        if (S === GAME_STATE.LOBBY) { const b = lobbyButtonAt(x, y); if (b) b.press(); return true; }
        if (isGuest() && S !== GAME_STATE.PLAYING) return true;   // the host drives the menus
        if (S === GAME_STATE.LEVEL_COMPLETE) { if (game.stateTimer > 45) nextLevel(); return true; }       // a tap or click moves on, like SPACE
        if (S === GAME_STATE.GAME_OVER || S === GAME_STATE.WIN) { if (game.stateTimer > 90) { if (isHost()) openMap(maxLevelReached); else toWelcome(); } return true; }
        if (S === GAME_STATE.WELCOME) { const b = welcomeChipAt(x, y); if (b) b.press(); return !!b; }
        if (S !== GAME_STATE.PLAYING) return false;
        const b = viewButtonAt(x, y);
        if (!b) return false;
        pressedButton = b; pressedPlayer = me; b.press();
        return true;
      }
      function viewButtonAt(x, y) {   // a console button or chip under a point, in whichever player's view it falls; leaves that player current
        let b = null;
        const P = playerAtX(x);
        usePlayer(P);
        withView(P, () => { layoutButtons(); b = buttonAt(x - VX, y) || hudLinkAt(x - VX, y); });
        return b;
      }
      function releasePress() { if (pressedButton) { usePlayer(pressedPlayer); pressedButton.release(); pressedButton = null; } }
      canvas.addEventListener('mousedown', e => {
        unlockAudio();
        if (pressAt(e.clientX, e.clientY) || game.state === GAME_STATE.MAP || game.state === GAME_STATE.CUSTOM || game.state === GAME_STATE.WELCOME || game.state === GAME_STATE.LOBBY) return;
        isDragging = true; lastX = e.clientX; lastY = e.clientY; dragPlayer = playerAtX(e.clientX);
      });
      canvas.addEventListener('mousemove', e => {
        if (!isDragging) {
          const S = game.state, x = e.clientX, y = e.clientY;
          hoverVX = 0;
          hoverButton = S === GAME_STATE.PLAYING ? (hoverVX = viewPlayers().length > 1 && x >= W / 2 ? Math.floor(W / 2) : 0, viewButtonAt(x, y))
                      : S === GAME_STATE.MAP ? mapButtonAt(x, y)
                      : S === GAME_STATE.LOBBY ? lobbyButtonAt(x, y)
                      : S === GAME_STATE.CUSTOM ? customButtonAt(x, y)
                      : S === GAME_STATE.LEVEL_INTRO && hit(introButton, x, y) ? introButton
                      : S === GAME_STATE.WELCOME ? welcomeChipAt(x, y) : null;
          map.hover = S === GAME_STATE.MAP ? mapStarAt(x, y) : -1;
          canvas.style.cursor = hoverButton || map.hover >= 0 ? 'pointer' : S === GAME_STATE.MAP || S === GAME_STATE.CUSTOM || S === GAME_STATE.WELCOME || S === GAME_STATE.LOBBY ? 'default' : 'grab';
          return;
        }
        const mx = e.clientX - lastX, my = e.clientY - lastY, c = (dragPlayer || players[0]).camera;
        if (Math.abs(mx) + Math.abs(my) > 2) c.follow = false;   // dragging the view stops the camera following
        c.focusX -= mx / c.scale; c.focusY -= my / c.scale;
        c.offsetX = -c.focusX * c.scale; c.offsetY = -c.focusY * c.scale;
        lastX = e.clientX; lastY = e.clientY;
      });
      canvas.addEventListener('mouseup', () => { isDragging = false; releasePress(); });
      canvas.addEventListener('mouseleave', () => { isDragging = false; releasePress(); hoverButton = null; });
      // Touch: each finger is tracked by its identifier, so the stick and a button can be held at once.
      canvas.addEventListener('touchstart', e => {
        unlockAudio(); touchUI = true;
        for (const t of e.changedTouches) {
          const x = t.clientX, y = t.clientY;
          if (game.state === GAME_STATE.PLAYING) {
            if (joy.id === null && joyHit(x, y)) { joy.id = t.identifier; joyMove(x, y); continue; }
            const b = viewButtonAt(x, y);
            if (b) { b.press(); touchButtons.set(t.identifier, { b, P: me }); }
          } else pressAt(x, y);
        }
        e.preventDefault();   // no scrolling, zooming or simulated mouse clicks from the canvas
      }, { passive: false });
      canvas.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) if (t.identifier === joy.id) joyMove(t.clientX, t.clientY);
        e.preventDefault();
      }, { passive: false });
      const touchEnd = e => {
        for (const t of e.changedTouches) {
          if (t.identifier === joy.id) joyRelease();
          const h = touchButtons.get(t.identifier);
          if (h) { usePlayer(h.P); h.b.release(); touchButtons.delete(t.identifier); }
        }
      };
      canvas.addEventListener('touchend', touchEnd);
      canvas.addEventListener('touchcancel', touchEnd);
      window.addEventListener('blur', () => { joyRelease(); for (const h of touchButtons.values()) { usePlayer(h.P); h.b.release(); } touchButtons.clear(); });

      document.addEventListener('keydown', e => {
        unlockAudio();
        const k = e.key;
        if (document.activeElement === joinInput) {   // typing a room code
          if (k === 'Enter') netJoin(joinInput.value); else if (k === 'Escape') lobbyBack();
          return;
        }
        keys[k] = true; keys[e.code] = true;   // the code tells the two shift keys apart
        if (k.length === 1) keys[k.toLowerCase()] = true;
        if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', '/'].includes(k)) e.preventDefault();
        if (e.repeat) return;
        const S = game.state, confirm = k === ' ' || k === 'Enter';
        if (k === 'm' || k === 'M') { OrbitalAudio.toggleMute(); return; }
        if (S === GAME_STATE.WELCOME) {
          if (confirm) openMap(maxLevelReached);
          else if (k === '1' || k === '2') setPlayers(+k);
          else if (k === 'p' || k === 'P') setPlayers(3 - players.length);
          else if (k === 'o' || k === 'O' || k === '3') openLobby(null);
          else if (k === 'j' || k === 'J') { const r = netRooms(); if (r.length) netJoin(r[0].slot); else openLobby(null); }   // the first game waiting
        } else if (S === GAME_STATE.LOBBY) {
          if (k === 'Escape') lobbyBack();
          else if (online()) {}   // a join from the list is under way: only ESC
          else if (lobby.mode === null && (k === 'h' || k === 'H')) netHost(true);
          else if (lobby.mode === null && (k === 'p' || k === 'P')) netHost(false);
          else if (lobby.mode === null && (k === 'j' || k === 'J')) openLobby('join');
          else if (lobby.mode === null && k >= '1' && k <= '9') { const r = netRooms()[+k - 1]; if (r) netJoin(r.slot); }
          else if (lobby.mode === 'host' && (k === 'c' || k === 'C')) netCopyLink();
        } else if (isGuest()) {   // a guest only watches the host choose, and can leave
          if (k === 'Escape' || k === 'x' || k === 'X') netLeave();
          else if (S === GAME_STATE.PLAYING) {
            if (k === 'f' || k === 'F') camera.follow = !camera.follow;
            if (localPlayer().keys.nav.includes(k.toLowerCase())) { net.navToggles++; usePlayer(localPlayer()); toggleNav(); }
          }
        } else if (S === GAME_STATE.MAP) {
          if (map.travel) { if (confirm) map.travel.t = 1; }   // skip the flight
          else if (confirm) launchSelected();
          else if (['ArrowLeft', 'ArrowUp', 'a', 'A', 'w', 'W'].includes(k)) selectStar(map.selected - 1);
          else if (['ArrowRight', 'ArrowDown', 'd', 'D', 's', 'S'].includes(k)) selectStar(map.selected + 1);
          else if (['PageUp', 'q', 'Q'].includes(k)) mapFlip(-1);
          else if (['PageDown', 'e', 'E'].includes(k)) mapFlip(1);
          else if (k === 'c' || k === 'C') openCustom();
          else if ((k === 'p' || k === 'P') && !game.inRun && !online()) setPlayers(3 - players.length);
          else if (k === 'Escape') leaveMap();
        } else if (S === GAME_STATE.CUSTOM) {
          if (confirm) launchCustom();
          else if (['ArrowUp', 'w', 'W'].includes(k)) customRow(-1);
          else if (['ArrowDown', 's', 'S'].includes(k)) customRow(1);
          else if (['ArrowLeft', 'a', 'A'].includes(k)) customChange(-1);
          else if (['ArrowRight', 'd', 'D'].includes(k)) customChange(1);
          else if (k === 'r' || k === 'R') customShuffle();
          else if (k === 'Escape') openMap(maxLevelReached);
        } else if (S === GAME_STATE.LEVEL_INTRO) {   // only a deliberate launch starts the clock
          if (confirm) beginPlay();
          else if (k === 'Escape') { if (game.levelIndex < 0) openCustom(); else openMap(game.levelIndex); }
        } else if (S === GAME_STATE.PLAYING) {
          if (k === 'x' || k === 'X') endGame('Run abandoned');
          if (k === 'f' || k === 'F') for (const P of players) P.camera.follow = !P.camera.follow;
          for (const P of players) if (P.keys.nav.includes(k) || P.keys.nav.includes(k.toLowerCase())) { usePlayer(P); toggleNav(); }
        } else if (S === GAME_STATE.LEVEL_COMPLETE) {
          if (confirm && game.stateTimer > 45) nextLevel();
        } else if (S === GAME_STATE.GAME_OVER || S === GAME_STATE.WIN) {
          if (confirm && game.stateTimer > 90) { if (isHost()) openMap(maxLevelReached); else toWelcome(); }
        }
      });
      document.addEventListener('keyup', e => {
        keys[e.key] = false; keys[e.code] = false;
        if (e.key.length === 1) keys[e.key.toLowerCase()] = false;
      });

      startButton.addEventListener('click', () => { unlockAudio(); openMap(maxLevelReached); });
    }

    // ---------- Rendering: world ----------
    function drawStars(focusX, focusY, t) {
      for (const s of stars) {
        const x = ((s.x - focusX * s.par) % W + W) % W;
        const y = ((s.y - focusY * s.par) % H + H) % H;
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 0.03 + s.phase);
        ctx.fillStyle = s.tint;
        ctx.fillRect(x, y, s.size, s.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawOrbitRings() {
      ctx.lineWidth = 1 / camera.scale;
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      for (const p of planets) { ctx.beginPath(); ctx.arc(0, 0, p.distance, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = 'rgba(156,163,175,0.06)';
      for (const A of levelBelts(game.level)) {
        ctx.beginPath(); ctx.arc(0, 0, A.outer, 0, Math.PI * 2); ctx.arc(0, 0, A.inner, 0, Math.PI * 2, true); ctx.fill();
      }
    }

    function drawSun() {
      const r = sun.radius, pulse = 1 + 0.05 * Math.sin(game.ticks * 0.04);
      let g = ctx.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 3.2 * pulse);
      g.addColorStop(0, rgba(sun.color, 0.45));
      g.addColorStop(0.35, rgba(sun.color, 0.15));
      g.addColorStop(1, rgba(sun.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 3.2 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,82,82,0.25)'; ctx.lineWidth = 1 / camera.scale;
      ctx.setLineDash([5 / camera.scale, 5 / camera.scale]);
      ctx.beginPath(); ctx.arc(0, 0, sun.heatRadius, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, sun.color); g.addColorStop(1, shade(sun.color, 0.6));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    }

    function drawPlanet(p) {
      const ang = Math.atan2(sun.y - p.y, sun.x - p.x);
      const r = p.radius;
      let g = ctx.createRadialGradient(p.x, p.y, r * 0.9, p.x, p.y, r * 1.6);
      g.addColorStop(0, rgba(p.color, 0.35)); g.addColorStop(1, rgba(p.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.6, 0, Math.PI * 2); ctx.fill();
      g = ctx.createRadialGradient(p.x + Math.cos(ang) * r * 0.5, p.y + Math.sin(ang) * r * 0.5, r * 0.1, p.x, p.y, r);
      g.addColorStop(0, shade(p.color, 1.5)); g.addColorStop(0.6, p.color); g.addColorStop(1, shade(p.color, 0.3));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      if (p.soi < p.distance * 0.9) {   // the influence ring only helps when it is smaller than the planet's own orbit
        ctx.strokeStyle = rgba(p.color, 0.12); ctx.lineWidth = 1 / camera.scale;
        ctx.setLineDash([6 / camera.scale, 6 / camera.scale]);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.soi, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = `${12 / camera.scale}px SpaceFont, Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(p.name.toUpperCase(), p.x, p.y + r * 1.6 + 4 / camera.scale);
    }

    function drawAsteroids() {
      for (const a of asteroids) {
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
        ctx.beginPath();
        a.shape.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
        ctx.closePath();
        ctx.fillStyle = '#6b7280'; ctx.fill();
        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 0.5; ctx.stroke();
        ctx.restore();
      }
    }

    function drawCollectibles() {
      const t = game.ticks;
      for (const o of ores) {
        const tw = 0.7 + 0.3 * Math.sin(t * 0.1 + o.phase);
        ctx.fillStyle = `rgba(250,204,21,${0.25 * tw})`;
        ctx.beginPath(); ctx.arc(o.x, o.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#facc15';
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(t * 0.05 + o.phase); ctx.fillRect(-1.2, -1.2, 2.4, 2.4); ctx.restore();
      }
      for (const f of fuels) {
        ctx.fillStyle = 'rgba(74,222,128,0.25)';
        ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4ade80';
        ctx.beginPath(); ctx.arc(f.x, f.y, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#bbf7d0'; ctx.lineWidth = 0.4;
        ctx.beginPath(); ctx.arc(f.x, f.y, 2.1, 0, Math.PI * 2); ctx.stroke();
      }
    }

    function drawTrail() {
      for (const P of players) if (!P.ship.dead) drawTrailOf(P.trail, P === me ? trailFrame : P.trailFrame, P === me ? '255,255,255' : hexToRgb(P.color).join(','), 0.35);
      for (const r of rivals) if (!r.dead) drawTrailOf(r.trail, r.trailFrame, hexToRgb(r.color).join(','), 0.3);
    }
    function drawTrailOf(T, frame, rgb, alpha) {
      if (T.length < 4) return;
      ctx.save();
      if (frame) ctx.translate(frame.x, frame.y);   // the trail moves with the body it was flown around
      ctx.lineWidth = 1 / camera.scale;
      const n = T.length / 2;
      for (let i = 2; i < T.length; i += 2) {
        ctx.strokeStyle = `rgba(${rgb},${alpha * (i / 2) / n})`;
        ctx.beginPath(); ctx.moveTo(T[i - 2], T[i - 1]); ctx.lineTo(T[i], T[i + 1]); ctx.stroke();
      }
      ctx.restore();
    }

    function drawPrediction() {
      const pts = prediction.pts;
      if (pts.length < 4 || rocket.dead) return;
      ctx.save();
      if (prediction.frame) ctx.translate(prediction.frame.x, prediction.frame.y);
      ctx.lineWidth = 1.2 / camera.scale;
      ctx.setLineDash([4 / camera.scale, 4 / camera.scale]);
      ctx.strokeStyle = prediction.hit ? 'rgba(255,82,82,0.75)' : 'rgba(79,195,247,0.55)';
      ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
      ctx.stroke();
      ctx.setLineDash([]);
      if (prediction.hit) {
        const h = prediction.hit, s = 4 / camera.scale;
        ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1.5 / camera.scale;
        ctx.beginPath(); ctx.moveTo(h.x - s, h.y - s); ctx.lineTo(h.x + s, h.y + s); ctx.moveTo(h.x + s, h.y - s); ctx.lineTo(h.x - s, h.y + s); ctx.stroke();
      }
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        const k = p.life / p.maxLife;
        ctx.globalAlpha = k; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * k), 0, Math.PI * 2); ctx.fill();
      }
      for (const r of rings) {
        const k = r.life / r.maxLife;
        ctx.globalAlpha = k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 / camera.scale;
        ctx.beginPath(); ctx.arc(r.x, r.y, (1 - k) * 30, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // Rocket in local units, nose pointing +x.
    const ROCKET_PALETTE = { body: '#e5e7eb', nose: '#4fc3f7', fin: '#ef4444' };
    function drawRocketShape(thrusting, boosting, flat, pal = ROCKET_PALETTE) {
      ctx.beginPath(); ctx.moveTo(4.5, 0); ctx.lineTo(-2.5, -2.2); ctx.lineTo(-2.5, 2.2); ctx.closePath();
      ctx.fillStyle = flat ? 'white' : pal.body; ctx.fill();
      if (!flat) {
        ctx.beginPath(); ctx.moveTo(4.5, 0); ctx.lineTo(1.5, -0.95); ctx.lineTo(1.5, 0.95); ctx.closePath();
        ctx.fillStyle = pal.nose; ctx.fill();
        ctx.fillStyle = pal.fin;
        ctx.beginPath(); ctx.moveTo(-2.5, -2.2); ctx.lineTo(-3.6, -3.3); ctx.lineTo(-1.4, -1.9); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.5, 2.2); ctx.lineTo(-3.6, 3.3); ctx.lineTo(-1.4, 1.9); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.arc(0.5, 0, 0.7, 0, Math.PI * 2); ctx.fill();
      }
      if (boosting) {
        const len = 8 + Math.random() * 3;
        ctx.beginPath(); ctx.moveTo(-2.5, -1.8); ctx.lineTo(-len, 0); ctx.lineTo(-2.5, 1.8); ctx.closePath();
        ctx.fillStyle = 'rgba(96,165,250,0.9)'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.5, -0.9); ctx.lineTo(-len * 0.6, 0); ctx.lineTo(-2.5, 0.9); ctx.closePath();
        ctx.fillStyle = 'white'; ctx.fill();
      } else if (thrusting) {
        const len = 5 + Math.random() * 2;

        if (sel) { ctx.fillStyle = 'rgba(79,195,247,0.1)'; roundRectPath(R.x, R.y, R.w, R.h, 8); ctx.fill(); }
        ctx.globalAlpha = dim ? 0.35 : 1;
        ctx.textAlign = 'left'; ctx.fillStyle = sel ? '#4fc3f7' : 'rgba(255,255,255,0.8)'; ctx.font = `${sel ? 'bold ' : ''}${short ? 14 : 16}px SpaceFont, Arial`;
        ctx.fillText(row.label, lx, y);
        const text = row.text(v), big = short ? 17 : 20;
        ctx.textAlign = 'center'; ctx.fillStyle = row.color ? row.color(v) : 'white'; ctx.font = `bold ${text.length > 8 ? big - 4 : big}px monospace`;
        ctx.fillText(text, vx + 75, y);
        for (const h of custom.hit) {   // the arrows either side of the value
          if (h.row !== i) continue;
          h.x = h.delta < 0 ? vx - 14 : vx + 136; h.y = y - 14; h.w = 28; h.h = 28;
          const can = h.delta < 0 ? v > row.min : v < row.max;
          ctx.fillStyle = !can ? 'rgba(255,255,255,0.15)' : hoverButton === h ? '#ffffff' : sel ? '#4fc3f7' : 'rgba(255,255,255,0.6)';
          ctx.beginPath();
          if (h.delta < 0) { ctx.moveTo(h.x + 19, h.y + 5); ctx.lineTo(h.x + 8, h.y + 14); ctx.lineTo(h.x + 19, h.y + 23); }
          else { ctx.moveTo(h.x + 9, h.y + 5); ctx.lineTo(h.x + 20, h.y + 14); ctx.lineTo(h.x + 9, h.y + 23); }
          ctx.closePath(); ctx.fill();
        }
        ctx.globalAlpha = 1;
      });
      // what the chosen setting means, under the choices (not on short screens, where the buttons need the room)
      if (!short) {
        const sk = CUSTOM_SKILLS[custom.skill], ly = y0 + (CUSTOM_ROWS.length - 1) * dy + 30, key = CUSTOM_ROWS[custom.row].key;
        ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '12px monospace';
        const pct = v => `${Math.round(v * 100)}%`, secs = t => `${(t / 60).toFixed(0)} s`;
        const lines = key === 'star' ? [`${CUSTOM_STAR_TYPES[custom.star].label}: ${CUSTOM_STAR_TYPES[custom.star].blurb}`]
                    : key === 'nav' ? [`NAV AI ${CUSTOM_NAV[custom.nav].label}: ${CUSTOM_NAV[custom.nav].blurb}`]
                    : key === 'size' ? [`${CUSTOM_SIZES[custom.size].label}: orbits about ${CUSTOM_SIZES[custom.size].gap} units apart`]
                    : key === 'delay' ? [custom.delay ? `HEAD START: the rivals launch ${CUSTOM_DELAYS[custom.delay]} seconds after you` : 'HEAD START: the rivals launch when you do']
                    : custom.rivals === 0 ? ['No rivals: collect the ore quota before time runs out']
                    : [`${sk.label}: ${pct(sk.thrust)} thrust, ${pct(sk.turn)} turn rate,`, `pauses ${secs(sk.pause)} after each capture and ${secs(sk.linger)} after each pickup`];
        lines.forEach((t, i) => ctx.fillText(t, lx, ly + i * 18));
      }
      // the generated system
      const cx = Math.round(W * 0.73), cy = Math.round(H * (short ? 0.38 : 0.47)), R = Math.round(Math.min(W * 0.17, H * (short ? 0.2 : 0.25)));
      drawCustomPreview(cx, cy, R);
      const nr = levelRivals(L).length;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = Object.assign({}, DEFAULT_STAR, L.star).color; ctx.font = 'bold 22px SpaceFont, Arial';
      ctx.fillText(L.name, cx, cy + R + (short ? 28 : 36));
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '13px monospace';
      ctx.fillText(`${L.planets.length} WORLDS   ·   ${L.oreTotal} ORE   ·   TIME ${formatTime(L.time)}`, cx, cy + R + (short ? 46 : 60));
      ctx.fillText(nr ? `WIN: MORE ORE THAN ${nr > 1 ? 'EVERY RIVAL' : 'THE RIVAL'}${custom.delay ? `   ·   ${CUSTOM_DELAYS[custom.delay]} S HEAD START` : ''}` : `WIN: COLLECT ${L.goal.count} ORE`, cx, cy + R + (short ? 62 : 80));
      // buttons
      const go = customButtons[0], back = customButtons[1], shuf = customButtons[2];
      go.x = W / 2 - go.w / 2; go.y = H - 84;
      back.x = 16; back.y = H - 56;
      shuf.x = W - 16 - shuf.w; shuf.y = H - 56;
      drawButton(go); drawButton(back); drawButton(shuf);
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(touchUI ? 'TAP the arrows to change a setting     SHUFFLE  new layout     LAUNCH  fly it' : 'UP / DOWN  choose a setting     LEFT / RIGHT  change it     R  new layout     ENTER  launch', W / 2, H - 18);
      ctx.restore();
    }
    function drawCustomPreview(cx, cy, R) {   // the system to scale: orbits, worlds, and who starts where
      const L = custom.level, S = Object.assign({}, DEFAULT_STAR, L.star), nr = levelRivals(L).length;
      let range = 0;
      for (const p of L.planets) range = Math.max(range, p.distance);
      const k = R / (range * 1.08), inner = L.planets[0].distance;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.strokeStyle = 'rgba(79,195,247,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, R + 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      const sr = Math.max(4, S.radius * k);
      const g = ctx.createRadialGradient(cx, cy, sr * 0.5, cx, cy, sr * 3);
      g.addColorStop(0, rgba(S.color, 0.5)); g.addColorStop(1, rgba(S.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, sr * 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = S.color; ctx.beginPath(); ctx.arc(cx, cy, sr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      for (const p of L.planets) { ctx.beginPath(); ctx.arc(cx, cy, p.distance * k, 0, Math.PI * 2); ctx.stroke(); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 9px monospace';
      for (const p of L.planets) {
        const a = p.startAngle + game.ticks * 0.004 * Math.pow(inner / p.distance, 1.5);   // the worlds turn, inner ones fastest
        const x = cx + Math.cos(a) * p.distance * k, y = cy + Math.sin(a) * p.distance * k, pr = 2 + p.radius * 0.35;
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y, pr, 0, Math.PI * 2); ctx.fill();
        const tag = p.home ? { text: 'YOU', color: '#4fc3f7' }
                  : p.rivalHome !== undefined ? { text: rivalName(p.rivalHome, nr), color: RIVAL_LOOKS[p.rivalHome].color } : null;
        if (!tag) continue;
        ctx.strokeStyle = tag.color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, pr + 4, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = tag.color; ctx.fillText(tag.text, x, y - pr - 10);
      }
      ctx.restore();
    }

    // ---------- Main loop ----------
    function tick() {
      game.ticks++; game.stateTimer++;
      updateParticles(); updatePopups();
      for (const P of players) { const c = P.camera; if (c.shake > 0) { c.shake *= 0.88; if (c.shake < 0.3) c.shake = 0; } }
      netBrowseTick();
      if (isGuest()) { guestTick(); return; }
      tickLocal();
      if (isHost()) netHostTick();
    }
    function tickLocal() {
      const S = game.state;
      if (S === GAME_STATE.WELCOME || S === GAME_STATE.CUSTOM || S === GAME_STATE.LOBBY) return;
      if (S === GAME_STATE.MAP) { updateTravel(); return; }
      if (S === GAME_STATE.LEVEL_INTRO) {   // the world turns while the player reads; nothing launches until they do
        stepWorld(); updateViews();
        return;
      }
      if (S === GAME_STATE.PLAYING) {
        for (const P of players) { usePlayer(P); handleInput(); updatePower(); }
        rivalPlanSpent = 0;   // the rivals take turns going first, so a slow planner cannot starve the others
        for (let j = 0; j < rivals.length; j++) { rival = rivals[(j + game.ticks) % rivals.length]; rivalThink(); rivalInput(); }
        stepWorld();
        for (const P of players) { if (game.state !== GAME_STATE.PLAYING) break; usePlayer(P); if (!rocket.dead) { checkCollisions(); collectItems(); } }
        for (const r of rivals) { if (game.state !== GAME_STATE.PLAYING || r.dead) continue; rival = r; rivalCollisions(); rivalCollect(); }
        if (game.state === GAME_STATE.PLAYING) {
          updateTimer();
          for (const P of players) { if (game.state !== GAME_STATE.PLAYING) break; usePlayer(P); updateCombo(); handleRespawn(); }
          for (const r of rivals) { rival = r; rivalRespawn(); }
        }
        if (game.abandonArmed > 0) game.abandonArmed--;
        updateViews(); syncEngineAudio();
        return;
      }
      stepWorld(); updateViews();   // level complete / game over / win: the world keeps drifting
    }
    function updateViews() { for (const P of players) { usePlayer(P); computePrediction(); updateCamera(); } usePlayer(players[0]); }

    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
      if (game.state === GAME_STATE.MAP) { drawMap(); return; }
      if (game.state === GAME_STATE.CUSTOM) { drawCustom(); return; }
      if (game.state === GAME_STATE.LOBBY) { drawLobby(); return; }
      if (game.state === GAME_STATE.WELCOME || !game.level) { drawWelcome(); return; }

      const views = viewPlayers(), split = views.length > 1;
      for (const P of views) {   // each player's view of the world, side by side when there are two; online, only your own
        usePlayer(P);
        withView(P, () => {
          ctx.save();
          if (split) { ctx.beginPath(); ctx.rect(VX, 0, W, H); ctx.clip(); }
          ctx.setTransform(1, 0, 0, 1, VX, 0);
          drawStars(-camera.offsetX / camera.scale, -camera.offsetY / camera.scale, game.ticks);
          const sx = camera.shake ? (Math.random() - 0.5) * camera.shake : 0;
          const sy = camera.shake ? (Math.random() - 0.5) * camera.shake : 0;
          ctx.setTransform(camera.scale, 0, 0, camera.scale, VX + W / 2 + camera.offsetX + sx, H / 2 + camera.offsetY + sy);
          drawOrbitRings();
          drawSun();
          drawAsteroids();
          for (const p of planets) drawPlanet(p);
          drawCollectibles();
          drawTrail();
          drawPrediction();
          drawParticles();
          drawRivals();
          drawRockets();

          ctx.setTransform(1, 0, 0, 1, VX, 0);
          drawRivalLabels();
          drawPopups();
          drawTargetArrow();
          drawHUD();
          drawMinimap();
          ctx.restore();
        });
      }
      usePlayer(localPlayer());
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (split) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(Math.floor(W / 2) - 1, 0, 2, H); }
      drawTopBar();
      if (game.state === GAME_STATE.LEVEL_INTRO) drawLevelIntro();
      else if (game.state === GAME_STATE.LEVEL_COMPLETE) drawLevelComplete();
      else if (game.state === GAME_STATE.GAME_OVER) drawGameOver();
      else if (game.state === GAME_STATE.WIN) drawWin();
    }

    let lastTime = 0, acc = 0;
    function loop(now) {
      if (!lastTime) lastTime = now;
      acc += Math.min(250, now - lastTime);
      lastTime = now;
      while (acc >= TICK_MS) { tick(); acc -= TICK_MS; }
      render();
      requestAnimationFrame(loop);
    }

    for (const k of Object.keys(OrbitalAudio.sfx)) { const f = OrbitalAudio.sfx[k]; OrbitalAudio.sfx[k] = (...a) => { netEvent(['f', k, ...a]); return f(...a); }; }   // a host's sounds play for the guest too
    makeStars();
    addListeners();
    loadCustom();
    const joinParam = new URLSearchParams(location.search).get('join');   // an invite link: straight to the lobby with the code filled in
    if (joinParam) { if (netIsSlot(joinParam)) netJoin(joinParam); else { lobby.joinCode = joinParam.toUpperCase().slice(0, 4); openLobby('join'); } }
    cgInit();
    const devLevel = parseInt(new URLSearchParams(location.search).get('level'));
    if (devLevel >= 1 && devLevel <= LEVELS.length) { newGame(devLevel - 1); beginPlay(); }
    const devCustom = new URLSearchParams(location.search).get('custom');   // planets,size,rivals,skill[,seed]: straight into a custom system
    if (devCustom) { applyCustomParam(devCustom); newGame(-1); beginPlay(); }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
