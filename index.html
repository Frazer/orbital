<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orbiting Planets</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    canvas { display: block; cursor: grab; }
  </style>
</head>
<body>
  <canvas id="solarSystem"></canvas>
  <script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let lastX, lastY;

    // Physics constants
    const G = 0.1; // Gravitational constant (scaled for game physics)
    const TIME_SCALE = 0.01; // Slow down the simulation (1.0 = normal speed, lower = slower)
    const planetGravityFactor = 800; // 5000; // Extremely strong planet gravity influence on rocket
    
    let closestPlanet = null;
    let closestDistanceSQ = Infinity;
      
    // Calculate mass based on radius (assuming density is constant)
    function calculateMass(radius) {
      return Math.pow(radius, 3) * (1-Math.random()/10) // Scale factor for game physics
    }
    
    // Calculate orbital velocity for a circular orbit
    function calculateOrbitalVelocity(centralMass, orbitRadius) {
      // For a circular orbit: v = sqrt(G * M / r)
      return Math.sqrt(G * centralMass / orbitRadius);
    }

    const sun = {
      x: 0,
      y: 0,
      radius: 30,
      color: 'yellow',
      mass: 1000000 // Much larger mass for the sun to dominate gravitational effects
    };
    
    // Initialize planets with position, velocity and mass
    const planets = [];
    
    function initializePlanets() {
      // Planet data: radius, distance from sun, color
      const planetData = [
        { radius: 5, distance: 120, color: 'gray' },
        { radius: 8, distance: 200, color: 'blue' },
        { radius: 6, distance: 320, color: 'red' },
        { radius: 10, distance: 440, color: 'orange' }
      ];
      
      // Create planets with proper orbital velocities
      for (const data of planetData) {
        const mass = calculateMass(data.radius);
        const orbitalVelocity = calculateOrbitalVelocity(sun.mass, data.distance);
        
        planets.push({
          radius: data.radius,
          x: data.distance, // Start along positive x-axis
          y: 0,
          vx: 0,
          vy: orbitalVelocity, // Velocity in y direction for circular orbit
          color: data.color,
          mass: mass
        });
      }
    }

    // Rocket object containing all rocket properties
    const rocket = {
      angle: 0,
      rotation: Math.PI/2, // Start facing down (PI/2 radians = 90 degrees in the new system)
      vx: 0,
      vy: 0,
      x: 0,
      y: 0,
      mass: 20, // Mass of the rocket
      thrustPower: 0.05, // Thrust power when engine is fired
      initialized: false // Whether the rocket has been positioned
    };

    function initializeRocket() {
      // Set rocket initial position near blue planet if not initialized
      // Find blue planet
      const bluePlanet = planets.find(p => p.color === 'blue');
      if (bluePlanet) {
        // Position rocket close to the blue planet
        const orbitDist = bluePlanet.radius + 2; 
        rocket.x = bluePlanet.x + orbitDist;
        rocket.y = bluePlanet.y;
        
        // Calculate proper orbital velocity around the blue planet using Kepler's laws
        // This uses the enhanced planet gravity factor to match the simulation
        const enhancedPlanetMass = bluePlanet.mass * planetGravityFactor;
        const rocketOrbitSpeed = calculateOrbitalVelocity(enhancedPlanetMass, orbitDist);
        
        // The rocket should orbit clockwise (to match downward orientation)
        // For a rocket positioned to the right of the planet, velocity should be downward
        const speedMultiplier = 1.35; // Slightly faster than orbital velocity for a stable orbit
        rocket.rotation = Math.PI/2; // Make sure rocket is facing down (90 degrees in our system)
        rocket.vx = 0;
        rocket.vy = rocketOrbitSpeed * speedMultiplier; // Positive Y is downward in canvas coordinates
        
        // Mark as initialized
        rocket.initialized = true;
      }
    }

    const keys = {};
    
    function addListeners(){

      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const zoom = Math.exp(-e.deltaY * 0.001);
        scale *= zoom;
        offsetX -= (e.offsetX - canvas.width / 2 - offsetX) * (zoom - 1);
        offsetY -= (e.offsetY - canvas.height / 2 - offsetY) * (zoom - 1);
      });

      canvas.addEventListener('mousedown', e => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });

      canvas.addEventListener('mousemove', e => {
        if (isDragging) {
          offsetX += e.clientX - lastX;
          offsetY += e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
        }
      });

      canvas.addEventListener('mouseup', () => isDragging = false);
      canvas.addEventListener('mouseleave', () => isDragging = false);

      document.addEventListener('keydown', e => {
        keys[e.key] = true;
      });

      document.addEventListener('keyup', e => {
        keys[e.key] = false;
      });
    }
    
    function init(){
      initializePlanets();
      initializeRocket();
      addListeners();
    }

    init();

    function respondToUserInput() {
      // Handle rocket controls
      if (keys['ArrowLeft']) rocket.rotation -= 0.05;
      if (keys['ArrowRight']) rocket.rotation += 0.05;
      if (keys['ArrowUp']) {
        // Apply thrust in the direction the rocket is pointing
        rocket.vx += Math.sin(rocket.rotation) * rocket.thrustPower;
        rocket.vy -= Math.cos(rocket.rotation) * rocket.thrustPower;
      }
    }

    function DEBUG_show_orbital_info() {
       // Show orbital information when close to a planet
      closestPlanet = null;
      closestDistanceSQ = Infinity;
      
      for (const planet of planets) {
        const dx = planet.x - rocket.x;
        const dy = planet.y - rocket.y;
        const distanceSQ = dx*dx + dy*dy;
        
        if (distanceSQ < closestDistanceSQ) {
          closestDistanceSQ = distanceSQ;
          closestPlanet = planet;
        }
      }
      
      // Debug overlay - show which planet is influencing the rocket most
      if (closestPlanet && closestDistanceSQ < 10000) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = closestPlanet.color;
        const size = Math.min(200, 40000/closestDistanceSQ);
        ctx.fillRect(100, 100, size, size );
        ctx.restore();
      }
    } 
    
    function drawPlanet(planet) {
      ctx.beginPath();
      ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
      ctx.fillStyle = planet.color;
      ctx.fill();
    }

    function drawRocket() {
        ctx.save();
        ctx.translate(rocket.x, rocket.y);
        // Rotate so the rocket points in the direction it's facing
        ctx.rotate(rocket.rotation - Math.PI/2); // Adjust by -90° so that a rotation of 0 faces right
        
        // Draw rocket with point facing right (which will be rotated to match the thrust direction)
        ctx.beginPath();
        ctx.moveTo(4, 0);    // Nose of rocket (now pointing right)
        ctx.lineTo(-2, -2);  // Top left corner
        ctx.lineTo(-2, 2);   // Bottom left corner
        ctx.closePath();
        ctx.fillStyle = 'white';
        ctx.fill();
        
        // Draw a small flame when thrusting
        if (keys['ArrowUp']) {
          ctx.beginPath();
          ctx.moveTo(-2, -1);  // Top of rocket back
          ctx.lineTo(-6, 0);   // Flame tip (smaller)
          ctx.lineTo(-2, 1);   // Bottom of rocket back
          ctx.closePath();
          ctx.fillStyle = 'orange';
          ctx.fill();
        }
        
        ctx.restore();
      }

    // Calculate gravitational force between two bodies
    // with special handling for rocket-planet interactions
    function calculateGravity(body1, body2) {
      const dx = body2.x - body1.x;
      const dy = body2.y - body1.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq);
      
      // Special case: if one of the bodies is the rocket and the other is a planet
      let gravityMultiplier = 1;
      
      // Check if body1 is the rocket and body2 is not the sun
      if (body1 === rocket && body2.mass < sun.mass) {
        gravityMultiplier = planetGravityFactor;
      }
      
      // Force magnitude (Newton's law of universal gravitation)
      const force = G * body1.mass * body2.mass * gravityMultiplier / distSq;
      
      // Force components
      const fx = force * dx / dist;
      const fy = force * dy / dist;
      
      return { fx, fy };
    }
    
    // Apply gravitational forces and update positions
    function updatePhysics(dt) {
      // Store forces for each planet to avoid immediate position updates affecting other calculations
      const forces = [];
      for (let i = 0; i < planets.length; i++) {
        forces.push({ fx: 0, fy: 0 });
      }
      
      // Calculate all gravitational forces
      // 1. Sun's gravity on all planets
      for (let i = 0; i < planets.length; i++) {
        const planet = planets[i];
        const { fx, fy } = calculateGravity(planet, sun);
        forces[i].fx += fx;
        forces[i].fy += fy;
      }
      
      // 2. Inter-planetary gravity (each planet affects all other planets)
      for (let i = 0; i < planets.length; i++) {
        for (let j = i + 1; j < planets.length; j++) {  // Only calculate each pair once
          const { fx, fy } = calculateGravity(planets[i], planets[j]);
          
          // Apply Newton's third law: equal and opposite forces
          forces[i].fx += fx;
          forces[i].fy += fy;
          forces[j].fx -= fx;  // Opposite direction for the other planet
          forces[j].fy -= fy;
        }
      }
      
      // Apply forces to update planet velocities and positions
      for (let i = 0; i < planets.length; i++) {
        const planet = planets[i];
        
        // Apply acceleration (F = ma, so a = F/m)
        const ax = forces[i].fx / planet.mass;
        const ay = forces[i].fy / planet.mass;
        
        // Update velocity based on acceleration
        planet.vx += ax * dt;
        planet.vy += ay * dt;
        
        // Update position based on velocity
        planet.x += planet.vx * dt;
        planet.y += planet.vy * dt;
      }
      
      // Calculate rocket physics - rocket experiences gravity but doesn't affect planets
      if (rocket.x !== 0 || rocket.y !== 0) {
        let totalFx = 0;
        let totalFy = 0;
        
        // Apply sun's gravity to rocket
        const { fx: sunFx, fy: sunFy } = calculateGravity(rocket, sun);
        totalFx += sunFx;
        totalFy += sunFy;
        
        // Apply planets' gravity to rocket
        for (let i = 0; i < planets.length; i++) {
          const planet = planets[i];
          const { fx, fy } = calculateGravity(rocket, planet);
          totalFx += fx;
          totalFy += fy;
        }
        
        // Apply acceleration (F = ma, so a = F/m)
        const ax = totalFx / rocket.mass;
        const ay = totalFy / rocket.mass;
        
        // Update velocity based on acceleration
        rocket.vx += ax * dt;
        rocket.vy += ay * dt;
        
        // Update rocket position
        rocket.x += rocket.vx * dt;
        rocket.y += rocket.vy * dt;
      }
    }
    
    function update() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.setTransform(scale, 0, 0, scale, canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);

      // Update physics (with small time step for stability)
      const dt = TIME_SCALE; // Apply time scale to slow down simulation
      updatePhysics(dt);
      
      // Draw everything
      drawPlanet(sun);

      for (let i = 0; i < planets.length; i++) {
        drawPlanet(planets[i]);
      }

      drawRocket();

      respondToUserInput();
     
      DEBUG_show_orbital_info();

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
