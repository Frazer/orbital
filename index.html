<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital</title>
  <style>
    body { margin: 0; background: #02030a; overflow: hidden; }
    canvas { display: block; cursor: grab; }
    @font-face {
      font-family: 'SpaceFont';
      src: url('https://fonts.gstatic.com/s/quantico/v15/rax5HiSdp9cPL3km3mujm9_1kw.woff2') format('woff2');
      font-display: swap;
    }
    .start-button {
      position: absolute;
      top: 66%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      background: rgba(79, 195, 247, 0.2);
      color: #4fc3f7;
      border: 2px solid #4fc3f7;
      border-radius: 30px;
      font-size: 24px;
      font-family: 'SpaceFont', Arial, sans-serif;
      cursor: pointer;
      transition: background 0.3s;
      animation: pulse 1.5s infinite;
      outline: none;
      z-index: 100;
      display: none; /* shown by the welcome screen */
    }
    .start-button:hover {
      background: rgba(79, 195, 247, 0.5);
      transform: translate(-50%, -50%) scale(1.05);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(79, 195, 247, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 195, 247, 0); }
    }
  </style>
</head>

  <canvas id="solarSystem"></canvas>
  <button id="startButton" class="start-button">START GAME</button>

      const look = RIVAL_LOOKS[index % RIVAL_LOOKS.length];
      return {
        index, name: 'RIVAL', color: look.color, pal: look.pal, cfg: null,
        x: 0, y: 0, vx: 0, vy: 0, rotation: 0, rotationSpeed: 0.05, mass: 20, thrustPower: 0.06, boostPower: 0.5,

        trail: [], trailFrame: null, nearest: null, nearestSQ: Infinity,
        ai: null,
      };
    }

    const game = {
      state: GAME_STATE.WELCOME, levelIndex: 0, level: null,
      score: 0, lives: START_LIVES, ore: 0, timeLeft: 0, lastSec: -1, hot: false,
      ticks: 0, stateTimer: 0, combo: 0, comboTimer: 0,
      gameOverReason: '', deathReason: '', stats: null,
      nav: true,                  // nav AI switched on (only matters on battery levels)
      inRun: false,               // a run is in progress (score and lives carry across the star map)
      raceTotal: 0,               // ore in play on a race level
    };
    let highScore = parseInt(localStorage.getItem('orbitalHighScore')) || 0;
    let maxLevelReached = parseInt(localStorage.getItem('orbitalMaxLevel')) || 0;   // index of the furthest level unlocked
    let cleared = parseInt(localStorage.getItem('orbitalCleared')) || 0;            // number of levels completed
    const map = { selected: 0, rocketAt: 0, travel: null, hover: -1 };             // star map: chosen system, where the rocket sits, flight in progress

    const camera = { scale: 1, zoomMul: 1, focusX: 0, focusY: 0, offsetX: 0, offsetY: 0, follow: true, shake: 0 };   // focus is the world point at screen centre; offsets are derived
    let closestPlanet = null, closestDistanceSQ = Infinity;
    const prediction = { pts: [], hit: null, frame: null };   // pts are relative to frame (a body) when set
    const predBodies = [];
    let predGrav = [sun];
    const predRocket = { x: 0, y: 0, vx: 0, vy: 0, mass: 20 };
    const tmpForce = { fx: 0, fy: 0 };
    let isDragging = false, lastX = 0, lastY = 0;
    const keys = {};
    const ui = { boost: false, charge: false };   // on-screen buttons being held
    let pressedButton = null, hoverButton = null;
    let audioThrust = false, audioBoost = false;
    const welcome = { rocketAngle: 0 };

    // ---------- Helpers ----------
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const smoothstep = t => t * t * (3 - 2 * t);
    function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function shade(hex, f) {
      const [r, g, b] = hexToRgb(hex);
      return `rgb(${clamp(Math.round(r * f), 0, 255)},${clamp(Math.round(g * f), 0, 255)},${clamp(Math.round(b * f), 0, 255)})`;
    }
    function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
    function formatTime(s) { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
    function worldToScreen(x, y) { return { x: x * camera.scale + W / 2 + camera.offsetX, y: y * camera.scale + H / 2 + camera.offsetY }; }
    function calculateMass(radius) { return Math.pow(radius, 3) * planetGravityFactor; }
    function orbitalVelocity(centralMass, r) { return Math.sqrt(G * centralMass / r); }
    function soiRadius(mass) { return Math.sqrt(G * rocket.mass * mass / MIN_FORCE); }   // where the rocket stops feeling a body
    function homePlanet() { return planets.find(p => p.home) || planets[0]; }
    function levelBelts(L) { const A = L && L.asteroids; return !A ? [] : Array.isArray(A) ? A : [A]; }   // a level may have one belt or several

    // ---------- World building ----------
    function makeStars() {
      stars = [];
      const n = Math.floor(W * H / 5000);
      for (let i = 0; i < n; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, size: Math.random() * 1.6 + 0.4,
                     par: 0.05 + Math.random() * 0.25, phase: Math.random() * Math.PI * 2,
                     tint: i % 5 === 0 ? '#b0c4de' : (i % 7 === 0 ? '#ffe4c4' : '#ffffff') });
      }
    }

    function buildLevel(def) {
      planets.length = 0; ores.length = 0; fuels.length = 0; asteroids.length = 0;
      particles.length = 0; rings.length = 0; popups.length = 0; trail.length = 0; rivals.length = 0; rival = null;
      Object.assign(sun, DEFAULT_STAR, def.star || {});
      def.planets.forEach((d, i) => {
        const mass = calculateMass(d.radius);
        const a = d.startAngle === undefined ? i * 1.7 : d.startAngle;
        const v = orbitalVelocity(sun.mass, d.distance) * (d.retro ? -1 : 1);   // retrograde worlds orbit the other way
        const p = {
          name: d.name, radius: d.radius, color: d.color, mass, home: !!d.home, distance: d.distance, retro: !!d.retro,
          rivalHome: d.rivalHome === true ? 0 : typeof d.rivalHome === 'number' ? d.rivalHome : -1,   // which rival starts here
          x: Math.cos(a) * d.distance, y: Math.sin(a) * d.distance,
          vx: -Math.sin(a) * v, vy: Math.cos(a) * v,
          soi: soiRadius(mass), oreTotal: d.ore, collected: 0,
        };
        planets.push(p);
        // Ore sits in two belts: a low one the starting orbit skims, and a high one that needs a burn to reach.
        for (let k = 0; k < d.ore; k++) {
          const distance = k % 2 === 0 ? p.radius + 5 + Math.random() * 7 : p.radius + 24 + Math.random() * 12;
          ores.push({ planet: p, angle: Math.random() * Math.PI * 2, distance, x: 0, y: 0, phase: Math.random() * Math.PI * 2 });
        }
        for (let k = 0; k < d.fuel; k++) {
          fuels.push({ planet: p, angle: Math.random() * Math.PI * 2, distance: p.radius + 12 + Math.random() * 12, x: 0, y: 0, phase: Math.random() * Math.PI * 2 });
        }
      });
      for (const A of levelBelts(def)) {
        for (let k = 0; k < A.count; k++) {
          const dist = A.inner + Math.random() * (A.outer - A.inner);
          const radius = 3 + Math.random() * 3;
          const shape = [];
          const sides = 6 + Math.floor(Math.random() * 3);
          for (let s = 0; s < sides; s++) {
            const ang = s / sides * Math.PI * 2, r = radius * (0.7 + Math.random() * 0.5);
            shape.push([Math.cos(ang) * r, Math.sin(ang) * r]);
          }
          asteroids.push({ dist, angle: Math.random() * Math.PI * 2, omega: orbitalVelocity(sun.mass, dist) / dist,
                           radius, shape, rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.02, x: 0, y: 0 });
        }
      }
      gravBodies = [sun, ...planets];
      predBodies.length = 0;
      for (const p of planets) predBodies.push({ x: 0, y: 0, vx: 0, vy: 0, mass: p.mass, radius: p.radius });
      predGrav = [sun, ...predBodies];
      for (const a of asteroids) { a.x = Math.cos(a.angle) * a.dist; a.y = Math.sin(a.angle) * a.dist; }
      moveCollectibles(0);
    }

    // Put the rocket into a circular orbit around the home planet, facing prograde.
    function spawnRocket() {
      const home = homePlanet();
      const orbitDist = home.radius + 12;
      const v = orbitalVelocity(home.mass, orbitDist);
      rocket.x = home.x + orbitDist;
      rocket.y = home.y;
      rocket.vx = home.vx;
      rocket.vy = home.vy + v;
      rocket.rotation = Math.PI;
      rocket.dead = false; rocket.heat = 0; rocket.invuln = 120; rocket.thrusting = false; rocket.boosting = false;
      trail.length = 0; trailFrame = null;
      rocket.battery = BATTERY_MAX; rocket.charging = false;
      closestPlanet = home; closestDistanceSQ = orbitDist * orbitDist;
    }

    // ---------- Physics ----------
    function gravityAt(x, y, mass, bodies, out) {
      let fx = 0, fy = 0;
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        const dx = b.x - x, dy = b.y - y;
        const core = b.radius * b.radius * 0.25;
        const d2 = Math.max(dx * dx + dy * dy, core);
        const f = G * mass * b.mass / d2;
        if (f < MIN_FORCE && !b.alwaysPulls) continue;
        const d = Math.sqrt(d2);
        fx += f * dx / d; fy += f * dy / d;
      }
      out.fx = fx; out.fy = fy;
    }
    function integrate(b, f, dt) {
      b.vx += f.fx / b.mass * dt;
      b.vy += f.fy / b.mass * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }

    function stepWorld() {
      const dt = TIME_SCALE;
      for (const p of planets) { gravityAt(p.x, p.y, p.mass, sunOnly, tmpForce); integrate(p, tmpForce, dt); }
      for (const a of asteroids) {
        a.angle += a.omega * dt;
        a.x = Math.cos(a.angle) * a.dist; a.y = Math.sin(a.angle) * a.dist;
        a.rot += a.rotSpeed;
      }
      if (!rocket.dead) {
        gravityAt(rocket.x, rocket.y, rocket.mass, gravBodies, tmpForce);
        integrate(rocket, tmpForce, dt);
      }
      for (const r of rivals) {
        if (r.dead) continue;
        gravityAt(r.x, r.y, r.mass, gravBodies, tmpForce);
        integrate(r, tmpForce, dt);
        nearestBody(r);
      }
      closestPlanet = null; closestDistanceSQ = Infinity;
      for (const b of gravBodies) {
        const dx = b.x - rocket.x, dy = b.y - rocket.y, d2 = dx * dx + dy * dy;
        if (d2 < closestDistanceSQ) { closestDistanceSQ = d2; closestPlanet = b; }
      }
      if (!rocket.dead && game.ticks % 2 === 0) recordTrail();
      if (game.ticks % 2 === 0) for (const r of rivals) if (!r.dead) r.trailFrame = recordTrailInto(r, r.trail, r.trailFrame, dominantBodyOf(r));
      moveCollectibles(dt);
      if (rocket.invuln > 0) rocket.invuln--;
    }

    // The body whose sphere of influence the rocket is inside, if any. Paths are stored relative to
    // it, so an orbit around a moving planet draws as a loop instead of a stretched spiral.
    function dominantBody() {
      if (!closestPlanet) return null;
      const soi = closestPlanet === sun ? soiRadius(sun.mass) : closestPlanet.soi;
      return closestDistanceSQ < soi * soi ? closestPlanet : null;
    }
    function recordTrail() { trailFrame = recordTrailInto(rocket, trail, trailFrame, dominantBody()); }
    function recordTrailInto(ship, T, oldFrame, frame) {   // appends the ship's position to T, stored relative to frame; returns the frame
      if (frame !== oldFrame) {   // re-base the stored points so the line never jumps when the frame changes
        const ox = (oldFrame ? oldFrame.x : 0) - (frame ? frame.x : 0);
        const oy = (oldFrame ? oldFrame.y : 0) - (frame ? frame.y : 0);
        for (let i = 0; i < T.length; i += 2) { T[i] += ox; T[i + 1] += oy; }
      }
      T.push(ship.x - (frame ? frame.x : 0), ship.y - (frame ? frame.y : 0));
      if (T.length > TRAIL_LENGTH * 2) T.splice(0, 2);
      return frame;
    }
    function nearestBody(ship) {   // the gravitating body closest to a ship, cached on it
      let best = null, bestSQ = Infinity;
      for (const b of gravBodies) {
        const dx = b.x - ship.x, dy = b.y - ship.y, d2 = dx * dx + dy * dy;
        if (d2 < bestSQ) { bestSQ = d2; best = b; }
      }
      ship.nearest = best; ship.nearestSQ = bestSQ;
    }
    function dominantBodyOf(ship) {
      if (!ship.nearest) return null;
      const soi = ship.nearest === sun ? soiRadius(sun.mass) : ship.nearest.soi;
      return ship.nearestSQ < soi * soi ? ship.nearest : null;
    }

    function moveCollectibles(dt) {
      const move = item => {
        item.angle += orbitalVelocity(item.planet.mass, item.distance) / item.distance * dt * 0.3;
        item.x = item.planet.x + Math.cos(item.angle) * item.distance;
        item.y = item.planet.y + Math.sin(item.angle) * item.distance;
      };
      ores.forEach(move); fuels.forEach(move);
    }

    function collectItems() {
      for (let i = ores.length - 1; i >= 0; i--) {
        const o = ores[i];
        const dx = o.x - rocket.x, dy = o.y - rocket.y;
        if (dx * dx + dy * dy < COLLECT_RADIUS_SQ) {
          ores.splice(i, 1);
          o.planet.collected++;
          game.ore++;
          game.combo = game.comboTimer > 0 ? Math.min(MAX_COMBO, game.combo + 1) : 1;
          game.comboTimer = COMBO_WINDOW;
          const points = ORE_POINTS * game.combo;
          game.score += points;
          popup(o.x, o.y, `+${points}` + (game.combo > 1 ? `  x${game.combo}` : ''), '#facc15');
          sparkle(o.x, o.y, '#facc15');
          OrbitalAudio.sfx.collectOre(game.combo);
          if (goalMet()) { completeLevel(); return; }
          if (raceCheck()) return;
        }
      }
      for (let i = fuels.length - 1; i >= 0; i--) {
        const f = fuels[i];
        const dx = f.x - rocket.x, dy = f.y - rocket.y;
        if (dx * dx + dy * dy < COLLECT_RADIUS_SQ) {
          fuels.splice(i, 1);
          rocket.fuel = Math.min(MAX_FUEL, rocket.fuel + FUEL_PER_PICKUP);
          popup(f.x, f.y, `+${FUEL_PER_PICKUP} BOOST`, '#4ade80');
          sparkle(f.x, f.y, '#4ade80');
          OrbitalAudio.sfx.collectFuel();
        }
      }
    }

    function checkCollisions() {
      const ds = Math.hypot(rocket.x - sun.x, rocket.y - sun.y);
      if (ds < sun.radius + 1) return destroyRocket('Flew into the sun');
      if (ds < sun.heatRadius) {
        rocket.heat = Math.min(1, rocket.heat + (1 - ds / sun.heatRadius) * 0.025);
        if (game.ticks % 20 === 0) OrbitalAudio.sfx.sizzle();
        if (rocket.heat >= 1) return destroyRocket('Hull melted');
      } else {
        rocket.heat = Math.max(0, rocket.heat - 0.004);
      }
      for (const p of planets) {
        const r = p.radius + 1.5;
        const dx = p.x - rocket.x, dy = p.y - rocket.y;
        if (dx * dx + dy * dy < r * r) return destroyRocket(`Crashed into ${p.name}`);
      }
      for (const a of asteroids) {
        const r = a.radius + 1.5;
        const dx = a.x - rocket.x, dy = a.y - rocket.y;
        if (dx * dx + dy * dy < r * r) return destroyRocket('Hit an asteroid');
      }
    }

    function destroyRocket(reason) {
      if (rocket.dead) return;
      rocket.dead = true; rocket.respawnTimer = 150; rocket.heat = 0;
      rocket.thrusting = false; rocket.boosting = false;
      game.lives--; game.combo = 0; game.comboTimer = 0; game.deathReason = reason;
      explode(rocket.x, rocket.y, rocket.vx, rocket.vy);
      camera.shake = 22;
      popup(rocket.x, rocket.y - 6, reason.toUpperCase(), '#ff5252', 16);
      OrbitalAudio.sfx.crash();
      syncEngineAudio();
    }

    function handleRespawn() {
      if (!rocket.dead) return;
      rocket.respawnTimer--;
      if (rocket.respawnTimer > 0) return;
      if (game.lives > 0) {
        spawnRocket();
        rocket.fuel = Math.max(rocket.fuel, START_FUEL);
        popup(rocket.x, rocket.y - 8, `${game.lives} ${game.lives === 1 ? 'LIFE' : 'LIVES'} LEFT`, '#4fc3f7');
        OrbitalAudio.sfx.respawn();
      } else {
        endGame(game.deathReason);
      }
    }

    // ---------- The rivals ----------
    // On race levels other ships mine the same belts. They obey the same physics and controls as the player's
    // rocket; their pilot (further down) presses the same four controls. A level lists them in `rivals` (or a
    // single one in `rival`); each entry sets a handicap: thrust, turn and boost multipliers, a pause after every
    // capture and a linger after every pickup, in ticks.
    const RIVAL_RESPAWN = 240;            // ticks out of action after a crash
    const RIVAL_BUDGET = 1200;            // ticks it works one world before moving on even if ore remains
    const RIVAL_PLAN_MS = 3.5, RIVAL_SIMS_PER_TICK = 40;   // planning budget per tick, shared between the rivals: whichever runs out first
    let rivalPlanSpent = 0;               // planning time used so far this tick, by all rivals

    function levelRivals(L) { return L.rivals || (L.rival ? [L.rival] : []); }
    function setupRivals(L) {
      rivals.length = 0; rival = null;
      const cfgs = levelRivals(L);
      cfgs.forEach((R, i) => {
        const r = makeRival(i);
        r.name = R.name || rivalName(i, cfgs.length);
        if (R.color) r.color = R.color;
        r.cfg = R;
        r.thrustPower = rocket.thrustPower * (R.thrust || 1);
        r.boostPower = rocket.boostPower * (R.boost || 1);
        r.rotationSpeed = rocket.rotationSpeed * (R.turn || 1);
        r.fuel = L.startFuel || START_FUEL;
        rivals.push(r);
        rival = r; spawnRival();
      });
      rival = rivals[0] || null;
    }
    function rivalHome() {   // its own home world; failing that, the worlds counted in from the far end
      return planets.find(p => p.rivalHome === rival.index) || planets[Math.max(0, planets.length - 1 - rival.index)];
    }
    // Into a circular orbit around its home world, on the far side from where a player would spawn, going the same way round.
    function spawnRival() {
      const home = rivalHome(), d = home.radius + 12, v = orbitalVelocity(home.mass, d);
      rival.x = home.x - d; rival.y = home.y; rival.vx = home.vx; rival.vy = home.vy - v;
      rival.rotation = 0; rival.dead = false; rival.heat = 0; rival.thrusting = false; rival.boosting = false;
      rival.trail.length = 0; rival.trailFrame = null; rival.nearest = home; rival.nearestSQ = d * d;
      const c = rival.ctl; c.left = c.right = c.up = c.boost = false;
      rival.ai = { phase: 'sweep', planet: home, target: null, dest: null, R: d, r: d, t: 0, playT: 0, arrivedT: 0, visits: 0,
                   evading: 0, pause: 0, plan: null, burned: 0, search: null, skip: {}, lookT: 0, danger: null, corr: null };
    }
    function rivalInput() {
      if (rival.dead) return;
      const c = rival.ctl;
      if (c.left) rival.rotation -= rival.rotationSpeed;
      if (c.right) rival.rotation += rival.rotationSpeed;
      const dx = Math.sin(rival.rotation), dy = -Math.cos(rival.rotation);
      rival.thrusting = !!c.up;
      rival.boosting = !!c.boost && rival.fuel > 0;
      if (rival.thrusting) { rival.vx += dx * rival.thrustPower; rival.vy += dy * rival.thrustPower; }
      if (rival.boosting) { rival.fuel = Math.max(0, rival.fuel - 1); rival.vx += dx * rival.boostPower; rival.vy += dy * rival.boostPower; }
      if (rival.boosting) exhaust(true, rival);
      else if (rival.thrusting) exhaust(false, rival);
    }
    function rivalCollisions() {
      const ds = Math.hypot(rival.x - sun.x, rival.y - sun.y);
      if (ds < sun.radius + 1) return destroyRival('flew into the sun');
      if (ds < sun.heatRadius) {
        rival.heat = Math.min(1, rival.heat + (1 - ds / sun.heatRadius) * 0.025);
        if (rival.heat >= 1) return destroyRival('melted');
      } else rival.heat = Math.max(0, rival.heat - 0.004);
      for (const p of planets) {
        const r = p.radius + 1.5, dx = p.x - rival.x, dy = p.y - rival.y;
        if (dx * dx + dy * dy < r * r) return destroyRival(`crashed into ${p.name}`);
      }
      for (const a of asteroids) {
        const r = a.radius + 1.5, dx = a.x - rival.x, dy = a.y - rival.y;
        if (dx * dx + dy * dy < r * r) return destroyRival('hit an asteroid');
      }
    }
    function destroyRival(reason) {
      if (rival.dead) return;
      rival.dead = true; rival.respawnTimer = RIVAL_RESPAWN; rival.heat = 0; rival.thrusting = false; rival.boosting = false; rival.crashes++;
      const c = rival.ctl; c.left = c.right = c.up = c.boost = false;
      explode(rival.x, rival.y, rival.vx, rival.vy);
      popup(rival.x, rival.y - 6, `${rival.name} ${reason.toUpperCase()}`, rival.color, 14);
    }
    function rivalCollect() {
      for (let i = ores.length - 1; i >= 0; i--) {
        const o = ores[i], dx = o.x - rival.x, dy = o.y - rival.y;
        if (dx * dx + dy * dy < COLLECT_RADIUS_SQ) {
          ores.splice(i, 1);
          rival.ore++; rival.lastOreTick = game.ticks;
          rival.ai.pause = Math.max(rival.ai.pause, rival.cfg.linger || 0);   // it savours each find for a moment
          popup(o.x, o.y, `${rival.name} +1`, rival.color, 12);
          sparkle(o.x, o.y, rival.color);
          if (raceCheck()) return;
        }
      }
      for (let i = fuels.length - 1; i >= 0; i--) {
        const f = fuels[i], dx = f.x - rival.x, dy = f.y - rival.y;
        if (dx * dx + dy * dy < COLLECT_RADIUS_SQ) {
          fuels.splice(i, 1);
          rival.fuel = Math.min(MAX_FUEL, rival.fuel + FUEL_PER_PICKUP);
          popup(f.x, f.y, `${rival.name} +BOOST`, rival.color, 12);
          sparkle(f.x, f.y, rival.color);
        }
      }
    }
    function rivalRespawn() {
      if (!rival.dead) return;
      if (--rival.respawnTimer > 0) return;
      spawnRival();
      rival.fuel = Math.max(rival.fuel, START_FUEL);
    }

    // ---------- The rival's pilot ----------
    // It flies the way a careful player would: hold a circular orbit at the radius of the next ore and slide along the
    // belt to meet it; once a world is worked out, plan a booster burn to the next one by simulating candidate burns with
    // the real physics. The search is spread over several ticks (coasting meanwhile) so it never stalls a frame.
    const normAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
    const vCircular = (p, r) => Math.sqrt(G * p.mass / r);
    const simBodies = [];   // scratch copies of the planets for the pilot's simulations

    function rivalSteer(ax, ay, tol) {   // point the nose along (ax, ay); true once within tol radians
      const diff = normAngle(Math.atan2(ax, -ay) - rival.rotation);
      rival.ctl.left = diff < -0.03; rival.ctl.right = diff > 0.03;
      return Math.abs(diff) < tol;
    }
    function rivalBurn(ax, ay, on, boost, force, emergency) {   // thrust along an error vector: main engine above `on`, booster above `boost`
      const mag = Math.hypot(ax, ay), c = rival.ctl;
      if (mag <= on) { c.up = false; c.boost = false; return false; }
      const aligned = rivalSteer(ax, ay, 0.25);
      c.up = aligned;
      c.boost = aligned && (force || mag > boost) && rival.fuel > (emergency ? 0 : 25);   // keep a reserve, except to dodge a crash
      return true;
    }
    function rivalRel(p) {   // motion relative to p: radial and tangential unit vectors and speeds
      const dx = rival.x - p.x, dy = rival.y - p.y, r = Math.hypot(dx, dy) || 1e-6;
      const ux = dx / r, uy = dy / r, vx = rival.vx - p.vx, vy = rival.vy - p.vy;
      const s = dx * vy - dy * vx >= 0 ? 1 : -1, tx = -uy * s, ty = ux * s;   // s is +1 when going the way the ore drifts
      return { r, ux, uy, vx, vy, s, tx, ty, vr: vx * ux + vy * uy, vt: vx * tx + vy * ty, ang: Math.atan2(dy, dx) };
    }
    function rivalHold(p, R, boostAbove) {   // fly a near-circular orbit around p, easing the radius towards R; returns the error size
      const k = rivalRel(p), ai = rival.ai;
      ai.r = k.r;

      if (g.type === 'race') return game.ore * 2 > game.raceTotal;   // more than half: the rival can no longer catch up
      return planets.every(p => p.collected > 0);
    }
    function goalProgress() {
      const g = game.level.goal;
      if (g.type === 'ore') return game.ore / g.count;
      if (g.type === 'race') return game.ore / (Math.floor(game.raceTotal / 2) + 1);
      return planets.filter(p => p.collected > 0).length / planets.length;
    }
    function goalText() {
      const g = game.level.goal;
      if (g.type === 'ore') return `ORE  ${game.ore} / ${g.count}`;
      if (g.type === 'race') return `YOU  ${game.ore}     ${rivals.map(r => `${r.name}  ${r.ore}`).join('     ')}     ·   ${ores.length} LEFT`;
      return planets.map(p => (p.collected > 0 ? '✓ ' : '○ ') + p.name.toUpperCase()).join('   ');
    }
    // Race levels end as soon as the outcome is settled. True when this call ended the level.
    function leadingRival() { let best = null; for (const r of rivals) if (!best || r.ore > best.ore) best = r; return best; }
    function raceCheck() {
      if (game.level.goal.type !== 'race' || game.state !== GAME_STATE.PLAYING) return false;
      const total = game.raceTotal, lead = leadingRival();
      if (game.ore * 2 > total) { completeLevel(); return true; }
      if (lead && lead.ore * 2 > total) { endGame(`Out-mined by ${lead.name}`); return true; }
      if (ores.length === 0) { raceFinish(); return true; }
      return false;
    }
    function raceFinish() {   // no ore left, or time up: whoever holds most wins; a tie goes to the rival
      const lead = leadingRival();
      if (!lead || game.ore > lead.ore) completeLevel();
      else endGame(game.ore === lead.ore ? `Tied with ${lead.name}` : `Out-mined by ${lead.name}`);
    }
    function oresLeft(p) { let n = 0; for (const o of ores) if (o.planet === p) n++; return n; }
    function findTarget() {
      const g = game.level.goal;
      let best = null, bestD = Infinity;
      for (const p of planets) {
        const wanted = g.type === 'visit' ? p.collected === 0 : oresLeft(p) > 0;
        if (!wanted) continue;
        const dx = p.x - rocket.x, dy = p.y - rocket.y, d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = p; }
      }
      return best;
    }

    function completeLevel() {
      const timeBonus = Math.floor(game.timeLeft) * TIME_BONUS_PER_SECOND;
      game.stats = { ore: game.ore, timeLeft: game.timeLeft, timeBonus, levelBonus: LEVEL_BONUS, rivalOres: rivals.map(r => ({ name: r.name, ore: r.ore })) };
      game.score += timeBonus + LEVEL_BONUS;
      game.lives = Math.min(MAX_LIVES, game.lives + 1);
      updateHighScore();
      if (game.levelIndex >= 0) {   // custom systems do not count towards the campaign
        maxLevelReached = Math.max(maxLevelReached, Math.min(game.levelIndex + 1, LEVELS.length - 1));
        localStorage.setItem('orbitalMaxLevel', maxLevelReached);
        cleared = Math.max(cleared, game.levelIndex + 1);

      game.state = GAME_STATE.LEVEL_COMPLETE; game.stateTimer = 0;
      rocket.thrusting = false; rocket.boosting = false;
      for (let i = 0; i < 6; i++) sparkle(rocket.x + (Math.random() - 0.5) * 20, rocket.y + (Math.random() - 0.5) * 20, ['#facc15', '#4ade80', '#4fc3f7'][i % 3]);
      OrbitalAudio.stopMusic();
      OrbitalAudio.sfx.levelComplete();
      syncEngineAudio();
    }

    function nextLevel() {
      if (game.levelIndex < 0) openCustom();   // back to the builder, to tweak the system or fly it again
      else if (game.levelIndex + 1 < LEVELS.length) openMap(game.levelIndex + 1, game.levelIndex);   // fly on to the next system
      else winGame();
    }

    function winGame() {
      updateHighScore(); game.inRun = false;
      game.state = GAME_STATE.WIN; game.stateTimer = 0;
      OrbitalAudio.sfx.win();
    }

    function endGame(reason) {
      updateHighScore(); game.inRun = false;
      game.gameOverReason = reason;
      game.state = GAME_STATE.GAME_OVER; game.stateTimer = 0;
      rocket.thrusting = false; rocket.boosting = false;
      OrbitalAudio.stopMusic();
      OrbitalAudio.sfx.gameOver();
      OrbitalAudio.setIntensity(0);
      syncEngineAudio();
    }

    function toWelcome() {
      game.state = GAME_STATE.WELCOME; game.stateTimer = 0; game.level = null; game.inRun = false;
      map.travel = null;
      OrbitalAudio.startMusic('ambient');
    }

    // ---------- Star map ----------
    // Every level is a star system. The map shows them all, lets the player pick any unlocked one,
    // and animates the flight from a finished system to the next.
    function openMap(select, travelFrom = -1) {
      game.state = GAME_STATE.MAP; game.stateTimer = 0; game.level = null;
      map.selected = select; map.rocketAt = travelFrom >= 0 ? travelFrom : select; map.hover = -1;
      map.travel = travelFrom >= 0 ? { from: travelFrom, to: select, t: 0, duration: 180 } : null;
      particles.length = 0; rings.length = 0; popups.length = 0;
      hoverButton = null; pressedButton = null;
      startButton.style.display = 'none';
      OrbitalAudio.startMusic('ambient');
      if (map.travel) OrbitalAudio.sfx.warp();
    }
    function mapStarPos(i) {   // the systems snake across the screen in two or three rows
      const n = LEVELS.length, rows = n > 14 ? 3 : 2, cols = Math.ceil(n / rows);
      const row = Math.floor(i / cols), k = i - row * cols;
      const c = row % 2 === 0 ? k : cols - 1 - k;
      const rowY = rows === 3 ? [0.28, 0.47, 0.66] : [0.40, 0.64];
      return { x: W * (0.12 + 0.76 * c / Math.max(1, cols - 1)), y: H * rowY[row] + 14 * Math.sin(i * 2.1) };
    }
    function mapStarStyle(i) { return Object.assign({}, DEFAULT_STAR, LEVELS[i].star || {}); }
    function travelPos(T, k) {   // a gentle arc between two systems
      const A = mapStarPos(T.from), B = mapStarPos(T.to);
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      const bulge = len * 0.18 * Math.sin(Math.PI * k);
      return { x: A.x + dx * k - dy / len * bulge, y: A.y + dy * k + dx / len * bulge };
    }
    function mapStarAt(x, y) {
      for (let i = 0; i <= maxLevelReached && i < LEVELS.length; i++) {
        const p = mapStarPos(i);
        if (Math.hypot(p.x - x, p.y - y) < 24) return i;
      }
      return -1;
    }
    function selectStar(i) {
      if (map.travel || i < 0 || i > maxLevelReached || i >= LEVELS.length || i === map.selected) return;
      map.selected = i;
      OrbitalAudio.sfx.select();
    }
    function launchSelected() {
      if (map.travel) return;
      if (game.inRun) startLevel(map.selected); else newGame(map.selected);
    }
    function leaveMap() {
      if (game.inRun) updateHighScore();
      toWelcome();
    }
    function updateTravel() {
      const T = map.travel;
      if (!T) return;
      T.t = Math.min(1, T.t + 1 / T.duration);
      const k = smoothstep(T.t), p = travelPos(T, k), q = travelPos(T, Math.min(1, k + 0.01));
      const ang = Math.atan2(q.y - p.y, q.x - p.x);
      for (let i = 0; i < 2; i++) {   // exhaust, in screen pixels
        const spread = (Math.random() - 0.5) * 1.2, speed = 2 + Math.random() * 2;
        spawnParticle(p.x - Math.cos(ang) * 8, p.y - Math.sin(ang) * 8, -Math.cos(ang + spread) * speed, -Math.sin(ang + spread) * speed,
                      25 + Math.random() * 15, 2.5, i ? '#4fc3f7' : '#ffffff');
      }
      if (T.t >= 1) {
        map.rocketAt = T.to; map.selected = T.to; map.travel = null;
        OrbitalAudio.sfx.arrive();
      }
    }

    // ---------- Custom systems ----------
    // The player picks a planet count, how spread out the system is, how many rivals fly and how good they are.
    // A system is generated from those choices and a seed, then played like any other level (index -1).
    const CUSTOM_SIZES = [   // gap: typical spacing between orbits; perPlanet: seconds of time limit each world adds
      { label: 'COMPACT', gap: 65,  zoom: 1.5, theme: 'storm', perPlanet: 25, star: { radius: 22, color: '#fbbf24', mass: 700000, luminosity: 1.2, heatRadius: 55 } },
      { label: 'CLOSE',   gap: 100, zoom: 1.6, theme: 'drive', perPlanet: 30, star: { radius: 24, color: '#fbbf24', mass: 800000, luminosity: 1.1, heatRadius: 70 } },
      { label: 'ROOMY',   gap: 160, zoom: 2.2, theme: 'epic',  perPlanet: 40, star: {} },
      { label: 'WIDE',    gap: 260, zoom: 3,   theme: 'deep',  perPlanet: 50, star: {} },
      { label: 'VAST',    gap: 420, zoom: 0,   theme: 'deep',  perPlanet: 60, star: { radius: 28, color: '#fef3c7', mass: 1100000, luminosity: 0.8, heatRadius: 130 } },
    ];
    const CUSTOM_SKILLS = [   // rival handicaps, from a dawdling old ship to a match for yours
      { label: 'ROOKIE',  thrust: 0.6,  turn: 0.6,  pause: 600, linger: 300 },
      { label: 'CRUISER', thrust: 0.75, turn: 0.75, pause: 360, linger: 180 },   // the BONANZA rival
      { label: 'VETERAN', thrust: 0.9,  turn: 0.9,  pause: 180, linger: 60 },
      { label: 'ACE',     thrust: 1,    turn: 1,    pause: 0,   linger: 0 },
    ];
    const CUSTOM_ROWS = [
      { key: 'planets', label: 'PLANETS',     min: 2, max: 12,                        text: v => `${v}` },
      { key: 'size',    label: 'SYSTEM SIZE', min: 0, max: CUSTOM_SIZES.length - 1,   text: v => CUSTOM_SIZES[v].label },
      { key: 'rivals',  label: 'RIVALS',      min: 0, max: RIVAL_LOOKS.length,        text: v => v === 0 ? 'NONE' : `${v}` },
      { key: 'skill',   label: 'RIVAL SKILL', min: 0, max: CUSTOM_SKILLS.length - 1,  text: v => CUSTOM_SKILLS[v].label },
    ];
    const CUSTOM_STARS = ['Kestrel', 'Vesper', 'Halcyon', 'Lantern', 'Orrery', 'Tamsin', 'Beacon', 'Mirage', 'Solace', 'Tallow', 'Wren', 'Cobalt'];
    const CUSTOM_WORLDS = ['Ash', 'Brine', 'Cinder', 'Dusk', 'Ember', 'Fen', 'Gale', 'Haze', 'Iron', 'Jade', 'Knoll', 'Loam',
                           'Moss', 'Nickel', 'Ochre', 'Pyre', 'Quill', 'Rime', 'Slate', 'Tarn', 'Umber', 'Vale', 'Wisp', 'Zinc'];
    const CUSTOM_COLORS = ['#d4d4d8', '#a8a29e', '#4ade80', '#fb923c', '#94a3b8', '#fde047', '#f87171', '#e0e7ff',
                           '#c084fc', '#a5f3fc', '#f59e0b', '#e879f9', '#818cf8', '#2dd4bf', '#fca5a5', '#bef264'];
    const custom = { row: 0, planets: 6, size: 1, rivals: 1, skill: 1, seed: 1, level: null, rows: [], hit: [] };
    CUSTOM_ROWS.forEach((row, i) => {   // clickable arrows either side of each value, and the row itself
      custom.rows.push({ x: 0, y: 0, w: 0, h: 0, row: i, press() { custom.row = i; }, release() {} });
      for (const delta of [-1, 1]) custom.hit.push({ x: 0, y: 0, w: 0, h: 0, row: i, delta, press() { custom.row = i; customChange(delta); }, release() {} });
    });
    const customButtons = [
      { id: 'go', label: 'LAUNCH', key: 'ENTER', color: '#4fc3f7', x: 0, y: 0, w: 190, h: 48,
        press() { launchCustom(); }, release() {}, active: () => false, enabled: () => true },
      { id: 'back', label: 'STAR MAP', key: 'ESC', color: '#cbd5e1', x: 0, y: 0, w: 150, h: 40,
        press() { openMap(maxLevelReached); }, release() {}, active: () => false, enabled: () => true },
      { id: 'shuffle', label: 'SHUFFLE', key: 'R', color: '#facc15', x: 0, y: 0, w: 150, h: 40,
        press() { customShuffle(); }, release() {}, active: () => false, enabled: () => true },
    ];
    function customButtonAt(x, y) { return customButtons.find(b => hit(b, x, y)) || custom.hit.find(b => hit(b, x, y)) || custom.rows.find(b => hit(b, x, y)) || null; }
    function seededRandom(seed) {   // mulberry32: the same seed always builds the same system
      let a = seed >>> 0;
      return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function makeCustomLevel(c) {
      const rnd = seededRandom(c.seed * 1000003 + c.planets * 7919 + c.size * 131);
      const take = list => list.splice(Math.floor(rnd() * list.length), 1)[0];
      const size = CUSTOM_SIZES[c.size], skill = CUSTOM_SKILLS[c.skill];
      const n = c.planets, k = Math.min(c.rivals, n - 1);
      const star = Object.assign({ name: take(CUSTOM_STARS.slice()) }, size.star), S = Object.assign({}, DEFAULT_STAR, star);
      const names = CUSTOM_WORLDS.slice(), colors = CUSTOM_COLORS.slice();
      const home = Math.min(n - 1, Math.round((n - 1) / 3));   // your world sits a third of the way out
      const others = [];   // rival homes: the worlds farthest from yours, kept apart from each other where possible
      for (let i = 0; i < n; i++) if (i !== home) others.push(i);
      others.sort((a, b) => Math.abs(b - home) - Math.abs(a - home));
      const rivalHomes = [];
      for (const i of others) if (rivalHomes.length < k && rivalHomes.every(j => Math.abs(j - i) >= 2)) rivalHomes.push(i);
      for (const i of others) if (rivalHomes.length < k && !rivalHomes.includes(i)) rivalHomes.push(i);
      const planets = [];
      let d = S.heatRadius * 2, total = 0;
      for (let i = 0; i < n; i++) {

        const isHome = i === home, rh = rivalHomes.indexOf(i);
        const radius = isHome || rh >= 0 ? 8 : [4, 5, 5, 6, 6, 7, 7, 8, 9, 10][Math.floor(rnd() * 10)];
        const ore = radius >= 8 ? 6 : radius >= 6 ? 5 : radius >= 5 ? 4 : 3;

        brief: k ? `${n} worlds and ${k} rival prospector${k > 1 ? 's' : ''}. Finish with more ore than ${k > 1 ? 'any of them' : 'it'}.`
                 : `${n} worlds around ${star.name}. Collect ${goal.count} of their ${total} ore.`,
        hint: k > 1 ? 'The rival ships mine the same belts. Every ore they take is one you cannot.'
            : k ? 'The pink ship mines the same belts. Every ore it takes is one you cannot.'
            : 'Every world pulls on you. Short burns go a long way.',
        notes: k ? [`RIVAL SKILL: ${skill.label}. Hold more than half the ore to win outright, or lead when time runs out.`] : undefined,
        goal, time, planets, oreTotal: total, skill: skill.label,
      };
    }
    function openCustom() {
      game.state = GAME_STATE.CUSTOM; game.stateTimer = 0; game.level = null; game.inRun = false;
      particles.length = 0; rings.length = 0; popups.length = 0;
      hoverButton = null; pressedButton = null;
      startButton.style.display = 'none';
      custom.level = makeCustomLevel(custom);
      OrbitalAudio.startMusic('ambient');
    }
    function customRow(delta) { custom.row = clamp(custom.row + delta, 0, CUSTOM_ROWS.length - 1); OrbitalAudio.sfx.select(); }
    function customChange(delta) {
      const row = CUSTOM_ROWS[custom.row], v = clamp(custom[row.key] + delta, row.min, row.max);
      if (v === custom[row.key]) return;
      custom[row.key] = v; custom.level = makeCustomLevel(custom);
      OrbitalAudio.sfx.select();
    }
    function customShuffle() { custom.seed = Math.floor(Math.random() * 1e6) + 1; custom.level = makeCustomLevel(custom); OrbitalAudio.sfx.select(); }
    function launchCustom() {
      try { localStorage.setItem('orbitalCustom', JSON.stringify({ planets: custom.planets, size: custom.size, rivals: custom.rivals, skill: custom.skill, seed: custom.seed })); } catch (e) {}
      newGame(-1);
    }
    function loadCustom() {
      try {
        const saved = JSON.parse(localStorage.getItem('orbitalCustom'));
        if (!saved) return;
        for (const row of CUSTOM_ROWS) if (typeof saved[row.key] === 'number') custom[row.key] = clamp(Math.round(saved[row.key]), row.min, row.max);
        if (saved.seed > 0) custom.seed = saved.seed;
      } catch (e) {}
    }

    function updateHighScore() {
      if (game.levelIndex < 0) return;   // custom systems keep their scores to themselves
      if (game.score > highScore) {
        highScore = game.score;
        localStorage.setItem('orbitalHighScore', highScore);
      }
    }

    function updateTimer() {
      game.timeLeft -= 1 / 60;
      const sec = Math.ceil(game.timeLeft);
      if (sec !== game.lastSec) {
        game.lastSec = sec;
        if (sec <= 10 && sec > 0) OrbitalAudio.sfx.tick();
      }
      const hot = game.timeLeft < 30;
      if (hot !== game.hot) { game.hot = hot; OrbitalAudio.setIntensity(hot ? 1 : 0); }
      if (game.timeLeft <= 0) { game.timeLeft = 0; if (game.level.goal.type === 'race') raceFinish(); else endGame('Out of time'); }
    }
    function updateCombo() {
      if (game.comboTimer > 0 && --game.comboTimer === 0) game.combo = 0;
    }

    // ---------- Input ----------
    function unlockAudio() {
      if (!OrbitalAudio.unlock()) return;
      if (game.state === GAME_STATE.WELCOME) OrbitalAudio.startMusic('ambient');
    }

    function handleInput() {
      if (rocket.dead) return;
      const left = keys['ArrowLeft'] || keys['a'];
      const right = keys['ArrowRight'] || keys['d'];
      const up = keys['ArrowUp'] || keys['w'];
      const boost = keys[' '] || ui.boost;
      if (left) rocket.rotation -= rocket.rotationSpeed;
      if (right) rocket.rotation += rocket.rotationSpeed;
      const dx = Math.sin(rocket.rotation), dy = -Math.cos(rocket.rotation);
      rocket.thrusting = !!up;
      rocket.boosting = !!boost && rocket.fuel > 0;
      if (rocket.thrusting) {
        rocket.vx += dx * rocket.thrustPower;
        rocket.vy += dy * rocket.thrustPower;
      }
      if (rocket.boosting) {
        rocket.fuel = Math.max(0, rocket.fuel - 1);
        rocket.vx += dx * rocket.boostPower;
        rocket.vy += dy * rocket.boostPower;
      }
      if (rocket.boosting) exhaust(true);
      else if (rocket.thrusting) exhaust(false);
    }

    // ---------- Battery and the nav AI ----------
    function navActive() {
      if (game.level.noNav) return false;   // some systems have no working nav AI at all
      return !game.level.battery || (game.nav && rocket.battery > 0);
    }
    function solarRate() {
      const d = Math.max(Math.hypot(rocket.x, rocket.y), sun.radius);
      return SOLAR_RATE * sun.luminosity * (SOLAR_DISTANCE / d) ** 2;
    }
    function powerRate() {   // net battery change per second, shown on the gauge
      let r = solarRate();
      if (game.nav) r -= NAV_DRAIN;
      if (rocket.charging) r += CHARGE_RATE;
      return r;
    }
    function toggleNav() {
      if (!game.level.battery || rocket.dead) return;
      if (!game.nav && rocket.battery < NAV_MIN_CHARGE) {
        popup(rocket.x, rocket.y - 8, 'NO POWER', '#ff5252', 12);
        OrbitalAudio.sfx.tick();
        return;
      }
      game.nav = !game.nav;
      popup(rocket.x, rocket.y - 8, game.nav ? 'NAV AI ON' : 'NAV AI OFF', game.nav ? '#4fc3f7' : '#cbd5e1', 12);
      OrbitalAudio.sfx.select();
    }
    function updatePower() {
      if (!game.level.battery || rocket.dead) { rocket.charging = false; return; }
      const dt = 1 / 60;
      rocket.charging = !!(keys['r'] || ui.charge) && rocket.fuel > 0 && rocket.battery < BATTERY_MAX;
      let b = rocket.battery + solarRate() * dt;
      if (rocket.charging) {
        const add = Math.min(CHARGE_RATE * dt, BATTERY_MAX - b, rocket.fuel / CHARGE_FUEL_COST);
        b += add; rocket.fuel = Math.max(0, rocket.fuel - add * CHARGE_FUEL_COST);
      }
      if (game.nav) {
        b -= NAV_DRAIN * dt;
        if (b <= 0) {
          b = 0; game.nav = false;
          popup(rocket.x, rocket.y - 8, 'NAV AI OFFLINE', '#ff5252', 12);
          OrbitalAudio.sfx.tick();
        }
      }
      rocket.battery = clamp(b, 0, BATTERY_MAX);
    }

    function syncEngineAudio() {
      const playing = game.state === GAME_STATE.PLAYING && !rocket.dead;
      const th = playing && rocket.thrusting && !rocket.boosting;
      const bo = playing && rocket.boosting;
      if (th !== audioThrust) { audioThrust = th; OrbitalAudio.setThrust(th); }
      if (bo !== audioBoost) { audioBoost = bo; OrbitalAudio.setBoost(bo); }
    }

    function addListeners() {
      window.addEventListener('resize', () => {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        makeStars();
      });
      window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; ui.boost = ui.charge = false; pressedButton = null; hoverButton = null; });

      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        camera.zoomMul = clamp(camera.zoomMul * Math.exp(-e.deltaY * 0.001), 0.25, 3);
      }, { passive: false });

      // On-screen console buttons take presses before the camera drag does.
      function pressAt(x, y) {
        const S = game.state;
        if (S === GAME_STATE.MAP) {
          const b = mapButtonAt(x, y);
          if (b) { b.press(); return true; }
          const i = mapStarAt(x, y);
          if (i < 0 || map.travel) return false;
          if (i === map.selected) launchSelected(); else selectStar(i);   // a second click on the chosen star launches
          return true;
        }
        if (S === GAME_STATE.CUSTOM) {
          const b = customButtonAt(x, y);
          if (b) b.press();
          return !!b;
        }
        if (S === GAME_STATE.LEVEL_INTRO) {
          if (hit(introButton, x, y) || buttonAt(x, y)) { beginPlay(); return true; }
          return false;
        }
        if (S !== GAME_STATE.PLAYING) return false;
        const b = buttonAt(x, y);
        if (!b) return false;
        pressedButton = b; b.press();
        return true;
      }
      function releasePress() { if (pressedButton) { pressedButton.release(); pressedButton = null; } }
      canvas.addEventListener('mousedown', e => {
        unlockAudio();
        if (pressAt(e.clientX, e.clientY) || game.state === GAME_STATE.MAP || game.state === GAME_STATE.CUSTOM) return;
        isDragging = true; lastX = e.clientX; lastY = e.clientY;
      });
      canvas.addEventListener('mousemove', e => {
        if (!isDragging) {
          const S = game.state, x = e.clientX, y = e.clientY;
          hoverButton = S === GAME_STATE.PLAYING ? buttonAt(x, y)
                      : S === GAME_STATE.MAP ? mapButtonAt(x, y)
                      : S === GAME_STATE.CUSTOM ? customButtonAt(x, y)
                      : S === GAME_STATE.LEVEL_INTRO && hit(introButton, x, y) ? introButton : null;
          map.hover = S === GAME_STATE.MAP ? mapStarAt(x, y) : -1;
          canvas.style.cursor = hoverButton || map.hover >= 0 ? 'pointer' : S === GAME_STATE.MAP || S === GAME_STATE.CUSTOM ? 'default' : 'grab';
          return;
        }
        const mx = e.clientX - lastX, my = e.clientY - lastY;
        if (Math.abs(mx) + Math.abs(my) > 2) camera.follow = false;   // dragging the view stops the camera following
        camera.focusX -= mx / camera.scale; camera.focusY -= my / camera.scale;
        camera.offsetX = -camera.focusX * camera.scale; camera.offsetY = -camera.focusY * camera.scale;
        lastX = e.clientX; lastY = e.clientY;
      });
      canvas.addEventListener('mouseup', () => { isDragging = false; releasePress(); });
      canvas.addEventListener('mouseleave', () => { isDragging = false; releasePress(); hoverButton = null; });
      canvas.addEventListener('touchstart', e => {
        unlockAudio();
        const t = e.changedTouches[0];
        if (t && pressAt(t.clientX, t.clientY)) e.preventDefault();
      }, { passive: false });
      canvas.addEventListener('touchend', releasePress);
      canvas.addEventListener('touchcancel', releasePress);

      document.addEventListener('keydown', e => {
        unlockAudio();
        const k = e.key;
        keys[k] = true;
        if (k.length === 1) keys[k.toLowerCase()] = true;
        if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
        if (e.repeat) return;
        const S = game.state, confirm = k === ' ' || k === 'Enter';
        if (k === 'm' || k === 'M') { OrbitalAudio.toggleMute(); return; }
        if (S === GAME_STATE.WELCOME) {
          if (confirm) openMap(maxLevelReached);
        } else if (S === GAME_STATE.MAP) {
          if (map.travel) { if (confirm) map.travel.t = 1; }   // skip the flight
          else if (confirm) launchSelected();
          else if (['ArrowLeft', 'ArrowUp', 'a', 'A', 'w', 'W'].includes(k)) selectStar(map.selected - 1);
          else if (['ArrowRight', 'ArrowDown', 'd', 'D', 's', 'S'].includes(k)) selectStar(map.selected + 1);
          else if (k === 'c' || k === 'C') openCustom();
          else if (k === 'Escape') leaveMap();
        } else if (S === GAME_STATE.CUSTOM) {
          if (confirm) launchCustom();
          else if (['ArrowUp', 'w', 'W'].includes(k)) customRow(-1);
          else if (['ArrowDown', 's', 'S'].includes(k)) customRow(1);
          else if (['ArrowLeft', 'a', 'A'].includes(k)) customChange(-1);
          else if (['ArrowRight', 'd', 'D'].includes(k)) customChange(1);
          else if (k === 'r' || k === 'R') customShuffle();
          else if (k === 'Escape') openMap(maxLevelReached);
        } else if (S === GAME_STATE.LEVEL_INTRO) {   // only a deliberate launch starts the clock
          if (confirm) beginPlay();
          else if (k === 'Escape') { if (game.levelIndex < 0) openCustom(); else openMap(game.levelIndex); }
        } else if (S === GAME_STATE.PLAYING) {
          if (k === 'x' || k === 'X') endGame('Run abandoned');
          if (k === 'f' || k === 'F') camera.follow = !camera.follow;
          if (k === 'n' || k === 'N') toggleNav();
        } else if (S === GAME_STATE.LEVEL_COMPLETE) {
          if (confirm && game.stateTimer > 45) nextLevel();
        } else if (S === GAME_STATE.GAME_OVER || S === GAME_STATE.WIN) {
          if (confirm && game.stateTimer > 90) toWelcome();
        }
      });
      document.addEventListener('keyup', e => {
        keys[e.key] = false;
        if (e.key.length === 1) keys[e.key.toLowerCase()] = false;
      });

      startButton.addEventListener('click', () => { unlockAudio(); openMap(maxLevelReached); });
    }

    // ---------- Rendering: world ----------
    function drawStars(focusX, focusY, t) {
      for (const s of stars) {
        const x = ((s.x - focusX * s.par) % W + W) % W;
        const y = ((s.y - focusY * s.par) % H + H) % H;
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 0.03 + s.phase);
        ctx.fillStyle = s.tint;
        ctx.fillRect(x, y, s.size, s.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawOrbitRings() {
      ctx.lineWidth = 1 / camera.scale;
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      for (const p of planets) { ctx.beginPath(); ctx.arc(0, 0, p.distance, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = 'rgba(156,163,175,0.06)';
      for (const A of levelBelts(game.level)) {
        ctx.beginPath(); ctx.arc(0, 0, A.outer, 0, Math.PI * 2); ctx.arc(0, 0, A.inner, 0, Math.PI * 2, true); ctx.fill();
      }
    }

    function drawSun() {
      const r = sun.radius, pulse = 1 + 0.05 * Math.sin(game.ticks * 0.04);
      let g = ctx.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 3.2 * pulse);
      g.addColorStop(0, rgba(sun.color, 0.45));
      g.addColorStop(0.35, rgba(sun.color, 0.15));
      g.addColorStop(1, rgba(sun.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 3.2 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,82,82,0.25)'; ctx.lineWidth = 1 / camera.scale;
      ctx.setLineDash([5 / camera.scale, 5 / camera.scale]);
      ctx.beginPath(); ctx.arc(0, 0, sun.heatRadius, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, sun.color); g.addColorStop(1, shade(sun.color, 0.6));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    }

    function drawPlanet(p) {
      const ang = Math.atan2(sun.y - p.y, sun.x - p.x);
      const r = p.radius;
      let g = ctx.createRadialGradient(p.x, p.y, r * 0.9, p.x, p.y, r * 1.6);
      g.addColorStop(0, rgba(p.color, 0.35)); g.addColorStop(1, rgba(p.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.6, 0, Math.PI * 2); ctx.fill();
      g = ctx.createRadialGradient(p.x + Math.cos(ang) * r * 0.5, p.y + Math.sin(ang) * r * 0.5, r * 0.1, p.x, p.y, r);
      g.addColorStop(0, shade(p.color, 1.5)); g.addColorStop(0.6, p.color); g.addColorStop(1, shade(p.color, 0.3));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      if (p.soi < p.distance * 0.9) {   // the influence ring only helps when it is smaller than the planet's own orbit
        ctx.strokeStyle = rgba(p.color, 0.12); ctx.lineWidth = 1 / camera.scale;
        ctx.setLineDash([6 / camera.scale, 6 / camera.scale]);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.soi, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = `${12 / camera.scale}px SpaceFont, Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(p.name.toUpperCase(), p.x, p.y + r * 1.6 + 4 / camera.scale);
    }

    function drawAsteroids() {
      for (const a of asteroids) {
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
        ctx.beginPath();
        a.shape.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
        ctx.closePath();
        ctx.fillStyle = '#6b7280'; ctx.fill();
        ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 0.5; ctx.stroke();
        ctx.restore();
      }
    }

    function drawCollectibles() {
      const t = game.ticks;
      for (const o of ores) {
        const tw = 0.7 + 0.3 * Math.sin(t * 0.1 + o.phase);
        ctx.fillStyle = `rgba(250,204,21,${0.25 * tw})`;
        ctx.beginPath(); ctx.arc(o.x, o.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#facc15';
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(t * 0.05 + o.phase); ctx.fillRect(-1.2, -1.2, 2.4, 2.4); ctx.restore();
      }
      for (const f of fuels) {
        ctx.fillStyle = 'rgba(74,222,128,0.25)';
        ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4ade80';
        ctx.beginPath(); ctx.arc(f.x, f.y, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#bbf7d0'; ctx.lineWidth = 0.4;
        ctx.beginPath(); ctx.arc(f.x, f.y, 2.1, 0, Math.PI * 2); ctx.stroke();
      }
    }

    function drawTrail() {
      drawTrailOf(trail, trailFrame, '255,255,255', 0.35);
      for (const r of rivals) if (!r.dead) drawTrailOf(r.trail, r.trailFrame, hexToRgb(r.color).join(','), 0.3);
    }
    function drawTrailOf(T, frame, rgb, alpha) {
      if (T.length < 4) return;
      ctx.save();
      if (frame) ctx.translate(frame.x, frame.y);   // the trail moves with the body it was flown around
      ctx.lineWidth = 1 / camera.scale;
      const n = T.length / 2;
      for (let i = 2; i < T.length; i += 2) {
        ctx.strokeStyle = `rgba(${rgb},${alpha * (i / 2) / n})`;
        ctx.beginPath(); ctx.moveTo(T[i - 2], T[i - 1]); ctx.lineTo(T[i], T[i + 1]); ctx.stroke();
      }
      ctx.restore();
    }

    function drawPrediction() {
      const pts = prediction.pts;
      if (pts.length < 4 || rocket.dead) return;
      ctx.save();
      if (prediction.frame) ctx.translate(prediction.frame.x, prediction.frame.y);
      ctx.lineWidth = 1.2 / camera.scale;
      ctx.setLineDash([4 / camera.scale, 4 / camera.scale]);
      ctx.strokeStyle = prediction.hit ? 'rgba(255,82,82,0.75)' : 'rgba(79,195,247,0.55)';
      ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
      ctx.stroke();
      ctx.setLineDash([]);
      if (prediction.hit) {
        const h = prediction.hit, s = 4 / camera.scale;
        ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1.5 / camera.scale;
        ctx.beginPath(); ctx.moveTo(h.x - s, h.y - s); ctx.lineTo(h.x + s, h.y + s); ctx.moveTo(h.x + s, h.y - s); ctx.lineTo(h.x - s, h.y + s); ctx.stroke();
      }
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        const k = p.life / p.maxLife;
        ctx.globalAlpha = k; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * k), 0, Math.PI * 2); ctx.fill();
      }
      for (const r of rings) {
        const k = r.life / r.maxLife;
        ctx.globalAlpha = k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 / camera.scale;
        ctx.beginPath(); ctx.arc(r.x, r.y, (1 - k) * 30, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // Rocket in local units, nose pointing +x.
    const ROCKET_PALETTE = { body: '#e5e7eb', nose: '#4fc3f7', fin: '#ef4444' };
    function drawRocketShape(thrusting, boosting, flat, pal = ROCKET_PALETTE) {
      ctx.beginPath(); ctx.moveTo(4.5, 0); ctx.lineTo(-2.5, -2.2); ctx.lineTo(-2.5, 2.2); ctx.closePath();
      ctx.fillStyle = flat ? 'white' : pal.body; ctx.fill();
      if (!flat) {
        ctx.beginPath(); ctx.moveTo(4.5, 0); ctx.lineTo(1.5, -0.95); ctx.lineTo(1.5, 0.95); ctx.closePath();
        ctx.fillStyle = pal.nose; ctx.fill();
        ctx.fillStyle = pal.fin;
        ctx.beginPath(); ctx.moveTo(-2.5, -2.2); ctx.lineTo(-3.6, -3.3); ctx.lineTo(-1.4, -1.9); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.5, 2.2); ctx.lineTo(-3.6, 3.3); ctx.lineTo(-1.4, 1.9); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.arc(0.5, 0, 0.7, 0, Math.PI * 2); ctx.fill();
      }
      if (boosting) {
        const len = 8 + Math.random() * 3;
        ctx.beginPath(); ctx.moveTo(-2.5, -1.8); ctx.lineTo(-len, 0); ctx.lineTo(-2.5, 1.8); ctx.closePath();
        ctx.fillStyle = 'rgba(96,165,250,0.9)'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.5, -0.9); ctx.lineTo(-len * 0.6, 0); ctx.lineTo(-2.5, 0.9); ctx.closePath();
        ctx.fillStyle = 'white'; ctx.fill();
      } else if (thrusting) {
        const len = 5 + Math.random() * 2;
        ctx.beginPath(); ctx.moveTo(-2.5, -1.2); ctx.lineTo(-len, 0); ctx.lineTo(-2.5, 1.2); ctx.closePath();
        ctx.fillStyle = '#fb923c'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.5, -0.6); ctx.lineTo(-len * 0.6, 0); ctx.lineTo(-2.5, 0.6); ctx.closePath();
        ctx.fillStyle = '#fde68a'; ctx.fill();
      }
    }

    function drawRocket() {
      if (rocket.dead) return;
      if (rocket.invuln > 0 && rocket.invuln % 16 < 8) ctx.globalAlpha = 0.4;
      ctx.save();
      ctx.translate(rocket.x, rocket.y);
      ctx.rotate(rocket.rotation - Math.PI / 2);
      drawRocketShape(rocket.thrusting, rocket.boosting, false);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    function drawRivals() {
      for (const r of rivals) {
        if (r.dead) continue;
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.rotation - Math.PI / 2);
        drawRocketShape(r.thrusting, r.boosting, false, r.pal);
        ctx.restore();
      }
    }

    // ---------- Rendering: screen space ----------
    function drawPopups() {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const p of popups) {
        const s = worldToScreen(p.x, p.y);
        ctx.globalAlpha = clamp(p.life / 30, 0, 1);
        ctx.fillStyle = p.color;
        ctx.font = `bold ${p.size}px SpaceFont, Arial`;
        ctx.fillText(p.text, s.x, s.y - 14 - (p.maxLife - p.life) * 0.4);
      }
      ctx.globalAlpha = 1;
    }

    function drawTargetArrow() {
      if (rocket.dead || game.state !== GAME_STATE.PLAYING) return;   // not over the intro card or the results
      const target = findTarget();
      if (target) drawEdgeArrow(target.x, target.y, target.color, `${target.name.toUpperCase()} ${Math.round(Math.hypot(target.x - rocket.x, target.y - rocket.y))}`, 48);
      rivals.forEach((r, i) => { if (!r.dead) drawEdgeArrow(r.x, r.y, r.color, `${r.name} ${Math.round(Math.hypot(r.x - rocket.x, r.y - rocket.y))}`, 64 + i * 18); });
    }
    // An arrow at the screen edge pointing at an off-screen world point; nothing is drawn while the point is in view.
    function drawEdgeArrow(x, y, color, label, margin) {
      const s = worldToScreen(x, y), bottom = margin + 70;   // keep clear of the console along the bottom
      if (s.x > margin && s.x < W - margin && s.y > margin && s.y < H - bottom) return;
      const cx = W / 2, cy = H / 2, dx = s.x - cx, dy = s.y - cy;
      const ang = Math.atan2(dy, dx);
      const k = Math.min((W / 2 - margin) / Math.max(Math.abs(dx), 1e-6), (H / 2 - (dy > 0 ? bottom : margin)) / Math.max(Math.abs(dy), 1e-6));
      const ax = cx + dx * k, ay = cy + dy * k;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-4, 0); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'white'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, ax - Math.cos(ang) * 40, ay - Math.sin(ang) * 40);
    }
    function drawRivalLabels() {   // each rival's name floats over its ship while it is in view
      ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      for (const r of rivals) {
        if (r.dead) continue;
        const s = worldToScreen(r.x, r.y);
        if (s.x < 0 || s.x > W || s.y < 0 || s.y > H) continue;
        ctx.fillStyle = rgba(r.color, 0.85);
        ctx.fillText(r.name, s.x, s.y - 6 - 3 * camera.scale);
      }
    }

    // ---------- Console: on-screen buttons with their hotkeys ----------
    const buttons = [
      { id: 'boost', label: 'BOOSTER', key: 'SPACE', color: '#4ade80',
        press() { ui.boost = true; }, release() { ui.boost = false; },
        active: () => rocket.boosting, enabled: () => rocket.fuel > 0 },
      { id: 'nav', label: 'NAV AI', key: 'N', color: '#4fc3f7',
        press() { toggleNav(); }, release() {},
        active: () => game.nav && rocket.battery > 0, enabled: () => game.nav || rocket.battery >= NAV_MIN_CHARGE },
      { id: 'charge', label: 'RECHARGE', key: 'R', color: '#facc15',
        press() { ui.charge = true; }, release() { ui.charge = false; },
        active: () => rocket.charging, enabled: () => rocket.fuel > 0 && rocket.battery < BATTERY_MAX },
    ];
    for (const b of buttons) Object.assign(b, { x: 0, y: 0, w: 0, h: 0, visible: false });
    const BUTTON_W = 160, BUTTON_H = 44, BUTTON_GAP = 14;

    function layoutButtons() {   // centred along the bottom; battery controls only appear on battery levels
      const show = game.level && game.level.battery ? buttons : buttons.slice(0, 1);
      const total = show.length * BUTTON_W + (show.length - 1) * BUTTON_GAP;
      let x = Math.round(W / 2 - total / 2);
      for (const b of buttons) b.visible = false;
      for (const b of show) { b.x = x; b.y = H - 16 - BUTTON_H; b.w = BUTTON_W; b.h = BUTTON_H; b.visible = true; x += BUTTON_W + BUTTON_GAP; }
    }
    function hit(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
    function buttonAt(x, y) {
      for (const b of buttons) if (b.visible && hit(b, x, y)) return b;
      return null;
    }
    const introButton = { id: 'launch', label: 'LAUNCH', key: 'SPACE', color: '#4fc3f7', x: 0, y: 0, w: 190, h: 48,
                          press() { beginPlay(); }, release() {}, active: () => false, enabled: () => true };
    const mapButtons = [
      { id: 'go', label: 'LAUNCH', key: 'ENTER', color: '#4fc3f7', x: 0, y: 0, w: 190, h: 48,
        press() { launchSelected(); }, release() {}, active: () => false, enabled: () => !map.travel },
      { id: 'back', label: 'BACK', key: 'ESC', color: '#cbd5e1', x: 0, y: 0, w: 130, h: 40,
        press() { leaveMap(); }, release() {}, active: () => false, enabled: () => true },
      { id: 'custom', label: 'CUSTOM', key: 'C', color: '#facc15', x: 0, y: 0, w: 140, h: 40,
        press() { if (!map.travel) openCustom(); }, release() {}, active: () => false, enabled: () => !map.travel },
    ];
    function mapButtonAt(x, y) { return mapButtons.find(b => hit(b, x, y)) || null; }
    function roundRectPath(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function drawButton(b) {
      const active = b.active(), enabled = b.enabled();
      ctx.save();
      ctx.globalAlpha *= enabled ? 1 : 0.4;
      roundRectPath(b.x, b.y, b.w, b.h, 8);
      ctx.fillStyle = active ? rgba(b.color, 0.5) : rgba(b.color, hoverButton === b ? 0.28 : 0.12);
      ctx.fill();
      ctx.lineWidth = active ? 2 : 1.5; ctx.strokeStyle = active ? '#ffffff' : b.color; ctx.stroke();
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillStyle = active ? '#ffffff' : b.color; ctx.font = 'bold 15px SpaceFont, Arial';
      ctx.fillText(b.label, b.x + 12, b.y + b.h / 2 + 1);
      // the hotkey, drawn as a keycap inside the button
      ctx.font = 'bold 11px monospace';
      const kw = ctx.measureText(b.key).width + 14, kh = 22, kx = b.x + b.w - 10 - kw, ky = b.y + (b.h - kh) / 2;
      roundRectPath(kx, ky, kw, kh, 4);
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.stroke();
      ctx.fillStyle = 'white'; ctx.textAlign = 'center';
      ctx.fillText(b.key, kx + kw / 2, ky + kh / 2 + 1);
      ctx.restore();
    }
    function drawSunIcon(x, y, strength) {
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.7 * strength; ctx.strokeStyle = '#fde047'; ctx.fillStyle = '#fde047'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.moveTo(x + Math.cos(a) * 4, y + Math.sin(a) * 4); ctx.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6);
      }
      ctx.stroke();
      ctx.restore();
    }
    function drawConsole() {
      layoutButtons();
      ctx.textBaseline = 'top';
      for (const b of buttons) {
        if (!b.visible) continue;
        const gy = b.y - 32;   // gauge row above the button
        ctx.font = '12px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
        if (b.id === 'boost') {
          ctx.fillText(`FUEL ${Math.floor(rocket.fuel)}`, b.x, gy);
          bar(b.x, gy + 18, b.w, 6, rocket.fuel / 500, rocket.fuel > 0 ? '#4ade80' : '#ef4444');
        } else if (b.id === 'nav') {
          ctx.fillText(`BATTERY ${Math.round(rocket.battery)}%`, b.x, gy);
          const rate = powerRate(), txt = `${rate >= 0 ? '+' : ''}${rate.toFixed(Math.abs(rate) >= 10 ? 0 : 1)}/s`;
          ctx.textAlign = 'right'; ctx.fillStyle = rate >= 0 ? '#4ade80' : '#f87171';
          ctx.fillText(txt, b.x + b.w, gy);
          drawSunIcon(b.x + b.w - ctx.measureText(txt).width - 12, gy + 6, clamp(solarRate() / NAV_DRAIN, 0, 1));
          const low = rocket.battery < 20;
          bar(b.x, gy + 18, b.w, 6, rocket.battery / BATTERY_MAX, low && game.ticks % 30 < 15 ? '#ff5252' : low ? '#f87171' : '#4fc3f7');
        } else if (b.id === 'charge') {
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.fillText(`HOLD: ${CHARGE_FUEL_COST} FUEL \u2192 1% CHARGE`, b.x, gy);
        }
        drawButton(b);
      }
      if (game.level.noNav) {
        const b = buttons[0];
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = 'bold 13px monospace';
        ctx.fillStyle = game.ticks % 40 < 28 ? '#ff5252' : 'rgba(255,82,82,0.4)';
        ctx.fillText('NAV AI OFFLINE', b.x + b.w + 18, b.y + b.h / 2);
      }
    }

    function bar(x, y, w, h, frac, color) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
    }
    function drawRaceBar(x, y, w, h) {   // your share grows from the left, the rivals' stack in from the right; past the post in the middle wins outright
      const total = Math.max(1, game.raceTotal);
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#facc15'; ctx.fillRect(x, y, w * clamp(game.ore / total, 0, 1), h);
      let right = x + w;
      for (const r of rivals) {
        const rw = w * clamp(r.ore / total, 0, 1);
        const flash = game.ticks - r.lastOreTick < 40 && game.ticks % 10 < 5;
        ctx.fillStyle = flash ? '#ffffff' : r.color; ctx.fillRect(right - rw, y, rw, h);
        right -= rw;
      }
      ctx.fillStyle = 'white'; ctx.fillRect(x + w / 2 - 1, y - 2, 2, h + 4);
    }
    function drawRaceStatus(x, y) {   // your tally, then each rival's in its own colour
      ctx.textAlign = 'left'; ctx.font = '14px monospace';
      const put = (txt, color) => { ctx.fillStyle = color; ctx.fillText(txt, x, y); x += ctx.measureText(txt).width; };
      put(`YOU  ${game.ore}`, 'white');
      for (const r of rivals) put(`     ${r.name}  ${r.ore}`, r.color);
      put(`     ·   ${ores.length} LEFT`, 'rgba(255,255,255,0.7)');
    }

    function drawHUD() {
      const L = game.level;
      ctx.save();
      ctx.textBaseline = 'top';
      // Level and objective
      ctx.textAlign = 'left';
      ctx.fillStyle = '#4fc3f7'; ctx.font = 'bold 18px SpaceFont, Arial';
      ctx.fillText(`${game.levelIndex < 0 ? 'CUSTOM' : `LEVEL ${game.levelIndex + 1}`}  ·  ${L.name}`, 16, 14);
      ctx.fillStyle = 'white'; ctx.font = '14px monospace';
      if (L.goal.type === 'race') drawRaceStatus(16, 40); else ctx.fillText(goalText(), 16, 40);
      if (L.goal.type === 'race') drawRaceBar(16, 62, 220, 6); else bar(16, 62, 220, 6, goalProgress(), '#facc15');
      // Timer
      ctx.textAlign = 'center';
      const low = game.timeLeft <= 15 && game.state === GAME_STATE.PLAYING;
      ctx.fillStyle = low ? (game.ticks % 30 < 15 ? '#ff5252' : '#ffb4b4') : 'white';
      ctx.font = 'bold 30px monospace';
      ctx.fillText(formatTime(game.timeLeft), W / 2, 12);
      // Score, lives, boost, heat
      ctx.textAlign = 'right';
      ctx.fillStyle = 'white'; ctx.font = 'bold 22px monospace';
      ctx.fillText(`${game.score}`, W - 16, 12);
      ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(`BEST ${highScore}`, W - 16, 38);
      for (let i = 0; i < game.lives; i++) {
        ctx.save(); ctx.translate(W - 22 - i * 18, 66); ctx.rotate(-Math.PI / 2); ctx.scale(2, 2);
        drawRocketShape(false, false, true);
        ctx.restore();
      }
      if (rocket.heat > 0) {
        ctx.fillStyle = '#f87171'; ctx.font = '12px monospace'; ctx.fillText('HULL HEAT', W - 16, 82);
        bar(W - 16 - 140, 98, 140, 8, rocket.heat, rocket.heat > 0.7 && game.ticks % 20 < 10 ? '#ffffff' : '#f87171');
      }
      // Combo
      if (game.combo > 1 && game.comboTimer > 0) {
        ctx.textAlign = 'center';
        ctx.globalAlpha = clamp(game.comboTimer / 60, 0, 1);
        ctx.fillStyle = '#facc15'; ctx.font = 'bold 26px SpaceFont, Arial';
        ctx.fillText(`x${game.combo} COMBO`, W / 2, 56);
        ctx.globalAlpha = 1;
      }
      // Hint (centred above the console) and controls
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      if (game.state === GAME_STATE.PLAYING && game.ticks < 900 && L.hint) {
        ctx.globalAlpha = clamp((900 - game.ticks) / 120, 0, 1);
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '14px monospace';
        ctx.fillText(L.hint, W / 2, H - 112);
        ctx.globalAlpha = 1;
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace';
      ctx.fillText(`M  music ${OrbitalAudio.isMuted() ? 'off' : 'on'}  ·  F  follow ${camera.follow ? 'on' : 'off'}  ·  X  abandon`, 16, 78);
      drawConsole();
      ctx.restore();
    }

    function drawMinimap() {
      const size = 150, pad = 16, cx = W - pad - size / 2, cy = H - pad - size / 2;
      let range = 0;
      for (const p of planets) range = Math.max(range, p.distance);
      for (const A of levelBelts(game.level)) range = Math.max(range, A.outer);
      range = Math.max(range, Math.hypot(rocket.x, rocket.y)) * 1.12;
      const k = (size / 2) / range;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.strokeStyle = 'rgba(79,195,247,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, size / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, size / 2, 0, Math.PI * 2); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      for (const p of planets) { ctx.beginPath(); ctx.arc(cx, cy, p.distance * k, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = 'rgba(160,160,160,0.7)';
      for (const a of asteroids) ctx.fillRect(cx + a.x * k, cy + a.y * k, 1.2, 1.2);
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
      const target = findTarget();
      for (const p of planets) {
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(cx + p.x * k, cy + p.y * k, 3, 0, Math.PI * 2); ctx.fill();
        if (p === target) {
          ctx.strokeStyle = rgba(p.color, 0.5 + 0.5 * Math.sin(game.ticks * 0.15));
          ctx.beginPath(); ctx.arc(cx + p.x * k, cy + p.y * k, 6, 0, Math.PI * 2); ctx.stroke();
        }
      }
      for (const r of rivals) {
        if (r.dead) continue;
        ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(cx + r.x * k, cy + r.y * k, 2.2, 0, Math.PI * 2); ctx.fill();
      }
      if (!rocket.dead) {
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(cx + rocket.x * k, cy + rocket.y * k, 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function overlay(alpha) { ctx.fillStyle = `rgba(0,0,0,${alpha})`; ctx.fillRect(0, 0, W, H); }
    function pulseText(text, x, y) {
      ctx.fillStyle = `rgba(79,195,247,${0.6 + 0.4 * Math.sin(game.ticks * 0.1)})`;
      ctx.font = 'bold 18px SpaceFont, Arial';
      ctx.fillText(text, x, y);
    }

    function drawLevelIntro() {
      const L = game.level, a = clamp(game.stateTimer / 20, 0, 1);
      overlay(0.55 * a);
      ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '20px SpaceFont, Arial';

      ctx.fillStyle = '#4fc3f7'; ctx.font = 'bold 60px SpaceFont, Arial';

      ctx.fillText(L.brief, W / 2, H / 2 + 10);

      let y = H / 2 + 140;
      if (L.notes) {   // new mechanics introduced on this level
        ctx.fillStyle = '#facc15'; ctx.font = '14px monospace';
