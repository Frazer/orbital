        y += L.notes.length * 20 + 4;
      }
      introButton.x = W / 2 - introButton.w / 2; introButton.y = y - introButton.h / 2;
      drawButton(introButton);
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('ESC  star map', W / 2, y + 44);
      ctx.globalAlpha = 1;
    }

    function drawLevelComplete() {
      const s = game.stats, a = clamp(game.stateTimer / 20, 0, 1);
      overlay(0.6 * a);
      ctx.globalAlpha = a; ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#4ade80'; ctx.font = 'bold 60px SpaceFont, Arial';
      ctx.fillText(s.rivalOres.length > 1 ? 'RIVALS BEATEN' : s.rivalOres.length ? 'RIVAL BEATEN' : 'LEVEL COMPLETE', W / 2, H / 2 - 110);
      ctx.font = '18px monospace';
      const rows = [
        ['ORE COLLECTED', `${s.ore}`],
        ...s.rivalOres.map(r => [`${r.name} ORE`, `${r.ore}`]),
        [`TIME BONUS  (${formatTime(s.timeLeft)} left)`, `+${s.timeBonus}`],
        ['LEVEL BONUS', `+${s.levelBonus}`],
        ['EXTRA LIFE', '+1'],
        ['SCORE', `${game.score}`],
      ];
      rows.forEach(([k, v], i) => {
        const y = H / 2 - 40 + i * 28;
        ctx.textAlign = 'right'; ctx.fillStyle = 'white'; ctx.fillText(k, W / 2 - 10, y);
        ctx.textAlign = 'left'; ctx.fillStyle = i === rows.length - 1 ? '#facc15' : 'white'; ctx.fillText(v, W / 2 + 10, y);
      });
      ctx.textAlign = 'center';
      if (game.stateTimer > 45) pulseText(game.levelIndex >= 0 && game.levelIndex + 1 < LEVELS.length ? 'PRESS SPACE TO FLY ON' : 'PRESS SPACE', W / 2, H / 2 + 130);
      ctx.globalAlpha = 1;
    }

    function drawGameOver() {
      const a = clamp(game.stateTimer / 30, 0, 1);
      overlay(0.7 * a);
      ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ff5252'; ctx.font = 'bold 64px SpaceFont, Arial';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 100);
      ctx.fillStyle = 'white'; ctx.font = '20px monospace';
      ctx.fillText(game.gameOverReason.toUpperCase(), W / 2, H / 2 - 40);
      ctx.font = '18px monospace';
      ctx.fillText(`${game.levelIndex < 0 ? 'CUSTOM SYSTEM' : `REACHED LEVEL ${game.levelIndex + 1}`}   ·   SCORE ${game.score}`, W / 2, H / 2 + 10);
      if (game.levelIndex >= 0 && game.score > 0 && game.score >= highScore) { ctx.fillStyle = '#facc15'; ctx.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 45); }
      else { ctx.fillStyle = '#4fc3f7'; ctx.fillText(`HIGH SCORE ${highScore}`, W / 2, H / 2 + 45); }
      if (game.stateTimer > 90) pulseText('PRESS SPACE', W / 2, H / 2 + 120);
      ctx.globalAlpha = 1;
    }

    function drawWin() {
      const a = clamp(game.stateTimer / 30, 0, 1);
      overlay(0.7 * a);
      ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#facc15'; ctx.font = 'bold 60px SpaceFont, Arial';
      ctx.fillText('GALAXY CONQUERED', W / 2, H / 2 - 100);
      ctx.fillStyle = 'white'; ctx.font = '20px monospace';
      ctx.fillText(`YOU CLEARED ALL ${LEVELS.length} STAR SYSTEMS`, W / 2, H / 2 - 40);
      ctx.fillText(`FINAL SCORE ${game.score}`, W / 2, H / 2 + 10);
      ctx.fillStyle = '#4fc3f7';
      ctx.fillText(game.score >= highScore ? 'NEW HIGH SCORE!' : `HIGH SCORE ${highScore}`, W / 2, H / 2 + 45);
      if (game.stateTimer > 90) pulseText('PRESS SPACE', W / 2, H / 2 + 120);
      ctx.globalAlpha = 1;
    }

    function drawWelcome() {
      const t = game.ticks, cx = W / 2, cy = H / 2;
      drawStars(0, 0, t);
      // Planet horizon
      const pr = W * 0.75, px = cx, py = H + pr * 0.82;
      let g = ctx.createRadialGradient(px, py, pr * 0.95, px, py, pr * 1.12);
      g.addColorStop(0, 'rgba(79,195,247,0.35)'); g.addColorStop(1, 'rgba(79,195,247,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, pr * 1.12, 0, Math.PI * 2); ctx.fill();
      g = ctx.createRadialGradient(px - pr * 0.3, py - pr * 0.9, pr * 0.1, px, py, pr);
      g.addColorStop(0, '#60a5fa'); g.addColorStop(0.5, '#1d4ed8'); g.addColorStop(1, '#0b1a3a');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
      // A rocket circling the title
      welcome.rocketAngle += 0.006;
      const ex = 280, ey = 75, oy = cy - 100;
      ctx.strokeStyle = 'rgba(79,195,247,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let k = 0; k < 50; k++) {
        const a = welcome.rocketAngle - k * 0.02;
        const x = cx + Math.cos(a) * ex, y = oy + Math.sin(a) * ey;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      ctx.save();
      ctx.translate(cx + Math.cos(welcome.rocketAngle) * ex, oy + Math.sin(welcome.rocketAngle) * ey);
      ctx.rotate(Math.atan2(Math.cos(welcome.rocketAngle) * ey, -Math.sin(welcome.rocketAngle) * ex));
      ctx.scale(3, 3);
      drawRocketShape(true, false, false);
      ctx.restore();
      // Title
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = '#4fc3f7'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#4fc3f7'; ctx.font = 'bold 80px SpaceFont, Arial';
      ctx.fillText('ORBITAL', cx, cy - 100);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '18px SpaceFont, Arial';
      ctx.fillText('A GAME OF GRAVITY', cx, cy - 45);
      ctx.fillStyle = 'white'; ctx.font = '20px monospace';
      ctx.fillText(`HIGH SCORE  ${highScore}`, cx, cy + 5);
      if (game.score > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '14px monospace';
        ctx.fillText(`LAST RUN  ${game.score}`, cx, cy + 30);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '14px monospace';
      ctx.fillText('ARROWS / WASD  steer & thrust     SPACE  booster     F  camera follow     M  music     X  abandon run', cx, H - 48);
      ctx.fillText(`${LEVELS.length} STAR SYSTEMS   ·   SOUND ${OrbitalAudio.isMuted() ? 'OFF' : 'ON'}`, cx, H - 26);
      startButton.style.display = 'block';
    }

    function drawMap() {
      const t = game.ticks;
      drawStars(t * 0.15, 0, t);
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#4fc3f7'; ctx.font = 'bold 34px SpaceFont, Arial';
      ctx.fillText('STAR MAP', W / 2, 44);
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '14px monospace';
      ctx.fillText(`${Math.min(cleared, LEVELS.length)} OF ${LEVELS.length} SYSTEMS CLEARED`, W / 2, 72);
      if (game.inRun) {
        ctx.textAlign = 'right'; ctx.fillStyle = 'white'; ctx.font = 'bold 22px monospace';
        ctx.fillText(`${game.score}`, W - 16, 24);
        ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText(`LIVES ${game.lives}   ·   FUEL ${Math.floor(rocket.fuel)}`, W - 16, 48);
      }
      // the route
      ctx.setLineDash([4, 6]); ctx.lineWidth = 1.5;
      for (let i = 0; i + 1 < LEVELS.length; i++) {
        const a = mapStarPos(i), b = mapStarPos(i + 1);
        ctx.strokeStyle = i < maxLevelReached ? 'rgba(79,195,247,0.55)' : 'rgba(255,255,255,0.12)';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.setLineDash([]);
      // the systems
      ctx.textAlign = 'center';
      for (let i = 0; i < LEVELS.length; i++) {
        const L = LEVELS[i], st = mapStarStyle(i), p = mapStarPos(i);
        const unlocked = i <= maxLevelReached, done = i < cleared;
        const r = 5 + st.radius / 8, color = unlocked ? st.color : '#475569';
        if (unlocked) {
          const g = ctx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, r * 3.5);
          g.addColorStop(0, rgba(st.color, 0.5)); g.addColorStop(1, rgba(st.color, 0));
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 3.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = unlocked ? 1 : 0.5;
        const g2 = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.1, p.x, p.y, r);
        g2.addColorStop(0, unlocked ? '#ffffff' : '#94a3b8'); g2.addColorStop(0.6, color); g2.addColorStop(1, shade(color, 0.6));
        ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
        if (done) { ctx.strokeStyle = 'rgba(74,222,128,0.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2); ctx.stroke(); }
        if (i === map.selected && !map.travel) {
          ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(p.x, p.y, r + 10 + 2 * Math.sin(t * 0.1), 0, Math.PI * 2); ctx.stroke();
        } else if (i === map.hover) {
          ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(p.x, p.y, r + 10, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(`${i + 1}`, p.x, p.y - r - 12);
        ctx.font = unlocked ? 'bold 11px SpaceFont, Arial' : '11px SpaceFont, Arial';
        ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)';
        ctx.fillText(L.name, p.x, p.y + r + 14);
        ctx.globalAlpha = 1;
      }
      // the rocket, parked at a system or flying between two
      let rx, ry, ang, thrusting = false;
      if (map.travel) {
        const k = smoothstep(map.travel.t), p = travelPos(map.travel, k), q = travelPos(map.travel, Math.min(1, k + 0.01));
        rx = p.x; ry = p.y; ang = Math.atan2(q.y - p.y, q.x - p.x); thrusting = true;
      } else {
        const p = mapStarPos(map.rocketAt), nxt = mapStarPos(Math.min(map.rocketAt + 1, LEVELS.length - 1));
        rx = p.x; ry = p.y - 26 + 2 * Math.sin(t * 0.05); ang = Math.atan2(nxt.y - p.y, nxt.x - p.x);
      }
      drawParticles();
      ctx.save(); ctx.translate(rx, ry); ctx.rotate(ang); ctx.scale(2.5, 2.5); drawRocketShape(thrusting, false, false); ctx.restore();
      // the chosen system
      const sel = LEVELS[map.selected], sst = mapStarStyle(map.selected);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = sst.color; ctx.font = 'bold 26px SpaceFont, Arial';
      ctx.fillText(map.travel ? `EN ROUTE TO ${LEVELS[map.travel.to].name}` : sel.name, W / 2, H - 172);
      ctx.fillStyle = 'white'; ctx.font = '15px monospace';
      ctx.fillText(sel.brief, W / 2, H - 144);
      const status = map.selected < cleared ? 'CLEARED' : map.selected === maxLevelReached ? 'NEXT' : 'UNLOCKED';
      const tags = [status, `${sel.planets.length} PLANET${sel.planets.length > 1 ? 'S' : ''}`, `TIME ${formatTime(sel.time)}`];
      if (levelBelts(sel).length) tags.push('ASTEROIDS');
      if (sel.battery) tags.push('BATTERY');
      if (sel.noNav) tags.push('NO NAV AI');
      const nr = levelRivals(sel).length;
      if (nr) tags.push(nr > 1 ? `${nr} RIVALS` : 'RIVAL');
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '13px monospace';
      ctx.fillText(tags.join('   ·   '), W / 2, H - 120);
      // buttons
      const go = mapButtons[0], back = mapButtons[1], cust = mapButtons[2];
      go.x = W / 2 - go.w / 2; go.y = H - 84;
      back.x = 16; back.y = H - 56; back.label = game.inRun ? 'QUIT RUN' : 'BACK';
      cust.x = W - 16 - cust.w; cust.y = H - 56;
      drawButton(go); drawButton(back); drawButton(cust);
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('ARROWS  choose a system     ENTER  launch     C  build your own     click a star to select it, click again to go', W / 2, H - 18);
      ctx.restore();
    }

    function drawCustom() {
      const t = game.ticks, L = custom.level;
      drawStars(t * 0.1, 0, t);
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#facc15'; ctx.font = 'bold 34px SpaceFont, Arial';
      ctx.fillText('CUSTOM SYSTEM', W / 2, 44);
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '14px monospace';
      ctx.fillText('BUILD A STAR SYSTEM AND FLY IT', W / 2, 72);
      // the choices
      const lx = Math.round(W * 0.08), vx = Math.round(W * 0.34), y0 = Math.round(H * 0.3), dy = 64;
      CUSTOM_ROWS.forEach((row, i) => {
        const y = y0 + i * dy, sel = i === custom.row, dim = row.key === 'skill' && custom.rivals === 0, v = custom[row.key];
        const R = custom.rows[i]; R.x = lx - 16; R.y = y - 24; R.w = vx + 150 - R.x; R.h = 48;
        if (sel) { ctx.fillStyle = 'rgba(79,195,247,0.1)'; roundRectPath(R.x, R.y, R.w, R.h, 8); ctx.fill(); }
        ctx.globalAlpha = dim ? 0.35 : 1;
        ctx.textAlign = 'left'; ctx.fillStyle = sel ? '#4fc3f7' : 'rgba(255,255,255,0.8)'; ctx.font = `${sel ? 'bold ' : ''}16px SpaceFont, Arial`;
        ctx.fillText(row.label, lx, y);
        ctx.textAlign = 'center'; ctx.fillStyle = 'white'; ctx.font = 'bold 20px monospace';
        ctx.fillText(row.text(v), vx + 66, y);
        for (const h of custom.hit) {   // the arrows either side of the value
          if (h.row !== i) continue;
          h.x = h.delta < 0 ? vx - 14 : vx + 118; h.y = y - 14; h.w = 28; h.h = 28;
          const can = h.delta < 0 ? v > row.min : v < row.max;
          ctx.fillStyle = !can ? 'rgba(255,255,255,0.15)' : hoverButton === h ? '#ffffff' : sel ? '#4fc3f7' : 'rgba(255,255,255,0.6)';
          ctx.beginPath();
          if (h.delta < 0) { ctx.moveTo(h.x + 19, h.y + 5); ctx.lineTo(h.x + 8, h.y + 14); ctx.lineTo(h.x + 19, h.y + 23); }
          else { ctx.moveTo(h.x + 9, h.y + 5); ctx.lineTo(h.x + 20, h.y + 14); ctx.lineTo(h.x + 9, h.y + 23); }
          ctx.closePath(); ctx.fill();
        }
        ctx.globalAlpha = 1;
      });
      // what the rival handicap means, under the choices
      const sk = CUSTOM_SKILLS[custom.skill], ly = y0 + CUSTOM_ROWS.length * dy - 10;
      ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '12px monospace';
      if (custom.rivals > 0) {
        ctx.fillText(`${sk.label}: ${Math.round(sk.thrust * 100)}% thrust, ${Math.round(sk.turn * 100)}% turn rate,`, lx, ly);
        ctx.fillText(`pauses ${(sk.pause / 60).toFixed(0)} s after each capture and ${(sk.linger / 60).toFixed(0)} s after each pickup`, lx, ly + 18);
      } else {
        ctx.fillText('No rivals: collect the ore quota before time runs out', lx, ly);
      }
      // the generated system
      const cx = Math.round(W * 0.73), cy = Math.round(H * 0.47), R = Math.round(Math.min(W * 0.17, H * 0.25));
      drawCustomPreview(cx, cy, R);
      const nr = levelRivals(L).length;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = Object.assign({}, DEFAULT_STAR, L.star).color; ctx.font = 'bold 22px SpaceFont, Arial';
      ctx.fillText(L.name, cx, cy + R + 36);
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '13px monospace';
      ctx.fillText(`${L.planets.length} WORLDS   ·   ${L.oreTotal} ORE   ·   TIME ${formatTime(L.time)}`, cx, cy + R + 60);
      ctx.fillText(nr ? `WIN: MORE ORE THAN ${nr > 1 ? 'EVERY RIVAL' : 'THE RIVAL'}` : `WIN: COLLECT ${L.goal.count} ORE`, cx, cy + R + 80);
      // buttons
      const go = customButtons[0], back = customButtons[1], shuf = customButtons[2];
      go.x = W / 2 - go.w / 2; go.y = H - 84;
      back.x = 16; back.y = H - 56;
      shuf.x = W - 16 - shuf.w; shuf.y = H - 56;
      drawButton(go); drawButton(back); drawButton(shuf);
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('UP / DOWN  choose a setting     LEFT / RIGHT  change it     R  new layout     ENTER  launch', W / 2, H - 18);
      ctx.restore();
    }
    function drawCustomPreview(cx, cy, R) {   // the system to scale: orbits, worlds, and who starts where
      const L = custom.level, S = Object.assign({}, DEFAULT_STAR, L.star), nr = levelRivals(L).length;
      let range = 0;
      for (const p of L.planets) range = Math.max(range, p.distance);
      const k = R / (range * 1.08), inner = L.planets[0].distance;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.strokeStyle = 'rgba(79,195,247,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, R + 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      const sr = Math.max(4, S.radius * k);
      const g = ctx.createRadialGradient(cx, cy, sr * 0.5, cx, cy, sr * 3);
      g.addColorStop(0, rgba(S.color, 0.5)); g.addColorStop(1, rgba(S.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, sr * 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = S.color; ctx.beginPath(); ctx.arc(cx, cy, sr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      for (const p of L.planets) { ctx.beginPath(); ctx.arc(cx, cy, p.distance * k, 0, Math.PI * 2); ctx.stroke(); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 9px monospace';
      for (const p of L.planets) {
        const a = p.startAngle + game.ticks * 0.004 * Math.pow(inner / p.distance, 1.5);   // the worlds turn, inner ones fastest
        const x = cx + Math.cos(a) * p.distance * k, y = cy + Math.sin(a) * p.distance * k, pr = 2 + p.radius * 0.35;
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y, pr, 0, Math.PI * 2); ctx.fill();
        const tag = p.home ? { text: 'YOU', color: '#4fc3f7' }
                  : p.rivalHome !== undefined ? { text: rivalName(p.rivalHome, nr), color: RIVAL_LOOKS[p.rivalHome].color } : null;
        if (!tag) continue;
        ctx.strokeStyle = tag.color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, pr + 4, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = tag.color; ctx.fillText(tag.text, x, y - pr - 10);
      }
      ctx.restore();
    }

    // ---------- Main loop ----------
    function tick() {
      game.ticks++; game.stateTimer++;
      updateParticles(); updatePopups();
      if (camera.shake > 0) { camera.shake *= 0.88; if (camera.shake < 0.3) camera.shake = 0; }
      const S = game.state;
      if (S === GAME_STATE.WELCOME || S === GAME_STATE.CUSTOM) return;
      if (S === GAME_STATE.MAP) { updateTravel(); return; }
      if (S === GAME_STATE.LEVEL_INTRO) {   // the world turns while the player reads; nothing launches until they do
        stepWorld(); computePrediction(); updateCamera();
        return;
      }
      if (S === GAME_STATE.PLAYING) {
        handleInput(); updatePower();
        rivalPlanSpent = 0;   // the rivals take turns going first, so a slow planner cannot starve the others
        for (let j = 0; j < rivals.length; j++) { rival = rivals[(j + game.ticks) % rivals.length]; rivalThink(); rivalInput(); }
        stepWorld();
        if (!rocket.dead) { checkCollisions(); collectItems(); }
        for (const r of rivals) { if (game.state !== GAME_STATE.PLAYING || r.dead) continue; rival = r; rivalCollisions(); rivalCollect(); }
        if (game.state === GAME_STATE.PLAYING) { updateTimer(); updateCombo(); handleRespawn(); for (const r of rivals) { rival = r; rivalRespawn(); } }
        computePrediction(); updateCamera(); syncEngineAudio();
        return;
      }
      stepWorld(); computePrediction(); updateCamera();   // level complete / game over / win: the world keeps drifting
    }

    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
      if (game.state === GAME_STATE.MAP) { drawMap(); return; }
      if (game.state === GAME_STATE.CUSTOM) { drawCustom(); return; }
      if (game.state === GAME_STATE.WELCOME || !game.level) { drawWelcome(); return; }

      drawStars(-camera.offsetX / camera.scale, -camera.offsetY / camera.scale, game.ticks);
      const sx = camera.shake ? (Math.random() - 0.5) * camera.shake : 0;
      const sy = camera.shake ? (Math.random() - 0.5) * camera.shake : 0;
      ctx.setTransform(camera.scale, 0, 0, camera.scale, W / 2 + camera.offsetX + sx, H / 2 + camera.offsetY + sy);
      drawOrbitRings();
      drawSun();
      drawAsteroids();
      for (const p of planets) drawPlanet(p);
      drawCollectibles();
      drawTrail();
      drawPrediction();
      drawParticles();
      drawRivals();
      drawRocket();

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawRivalLabels();
      drawPopups();
      drawTargetArrow();
      drawHUD();
      drawMinimap();
      if (game.state === GAME_STATE.LEVEL_INTRO) drawLevelIntro();
      else if (game.state === GAME_STATE.LEVEL_COMPLETE) drawLevelComplete();
      else if (game.state === GAME_STATE.GAME_OVER) drawGameOver();
      else if (game.state === GAME_STATE.WIN) drawWin();
    }

    let lastTime = 0, acc = 0;
    function loop(now) {
      if (!lastTime) lastTime = now;
      acc += Math.min(250, now - lastTime);
      lastTime = now;
      while (acc >= TICK_MS) { tick(); acc -= TICK_MS; }
      render();
      requestAnimationFrame(loop);
    }

    makeStars();
    addListeners();
    loadCustom();
    const devLevel = parseInt(new URLSearchParams(location.search).get('level'));
    if (devLevel >= 1 && devLevel <= LEVELS.length) { newGame(devLevel - 1); beginPlay(); }
    const devCustom = new URLSearchParams(location.search).get('custom');   // planets,size,rivals,skill[,seed]: straight into a custom system
    if (devCustom) {
      const v = devCustom.split(',').map(Number);
      CUSTOM_ROWS.forEach((row, i) => { if (!isNaN(v[i])) custom[row.key] = clamp(v[i], row.min, row.max); });
      if (v[4] > 0) custom.seed = v[4];
      custom.level = makeCustomLevel(custom); newGame(-1); beginPlay();
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
